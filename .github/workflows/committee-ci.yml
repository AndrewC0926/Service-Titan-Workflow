name: committee-ci

on:
  push:
    paths: ["committee/**", ".github/workflows/committee-ci.yml"]
  pull_request:
    paths: ["committee/**", ".github/workflows/committee-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: committee
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest --cov=committee --cov-report=term-missing
