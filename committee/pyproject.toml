[project]
name = "committee"
version = "0.1.0"
description = "Personal AI investment committee: disciplined, evidence-backed, human-approved."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "keyring>=25",
    "httpx>=0.27",
    "duckdb>=1.0",
    "pyarrow>=16",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "anthropic>=0.40",
    "cryptography>=43",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
edgar = ["edgartools>=3"]
broker = ["alpaca-py>=0.30"]
ui = ["streamlit>=1.38", "altair>=5"]
ops = ["apscheduler>=3.10,<4"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pandas-stubs",
    "pre-commit>=3.7",
]

[project.scripts]
committee = "committee.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/committee"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["E501", "S101", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*", "sklearn.*", "scipy.*", "keyring.*", "edgar.*", "alpaca.*", "streamlit.*", "altair.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: hits the network (excluded by default)"]
