# Render blueprint: one web service, one daily cron, one Postgres.
# Root directory is dmg-scout/ within the repo.
#
# No backup cron: Render's paid Postgres plans (basic-256mb here) run
# continuous point-in-time recovery already. A nightly pg_dump to S3 on top of
# that was pure redundancy, and it failed every run for want of AWS
# credentials that were never provisioned. scripts/backup.sh is left in the
# repo for anyone on a Render plan without PITR, or a future migration off
# Render, but nothing in this blueprint calls it.
databases:
  - name: dmg-scout-db
    plan: basic-256mb

services:
  - type: web
    name: dmg-scout-web
    runtime: docker
    rootDir: dmg-scout
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: dmg-scout-db, property: connectionString}
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OPENAI_API_KEY   # Whisper transcription only -- see app/pipeline/voice_capture.py
        sync: false
      - key: CAPTURE_API_KEY  # bearer token for POST /capture/voice (the iOS Shortcut), separate
        sync: false          # from DASHBOARD_PASSWORD on purpose -- see app/config.py:capture_api_key

  - type: cron
    name: dmg-scout-pipeline
    runtime: docker
    rootDir: dmg-scout
    # standard (2GB), not starter (512MB): the fetch stage alone measured a
    # peak of ~642MB RSS locally against production data (2026-08-13) --
    # over the 512Mi Render was killing it at, matching the real oomKilled
    # event Render logged for this service. +$18/mo over starter buys ~3x
    # headroom over the measured peak; upgraded live via the Render API
    # first, this keeps render.yaml from reverting it on the next deploy.
    plan: standard
    schedule: "0 13 * * *"   # 13:00 UTC = 6am PT daily
    # A single bare token, deliberately -- see scripts/run-pipeline.sh's own
    # header comment and tests/test_render_config.py. The previous value
    # here, `sh -c "alembic upgrade head && scout pipeline"`, is a multi-
    # word quoted string that Render's dockerCommand composition does not
    # preserve intact: every cron run failed with `sh: 1: alembic upgrade
    # head && scout pipeline: not found`, `sh` treating the whole phrase as
    # one opaque token. A bare script path has nothing in it for any
    # tokenizer to split, so it can't fail the same way.
    dockerCommand: scripts/run-pipeline.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: dmg-scout-db, property: connectionString}
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: HEALTHCHECK_URL   # healthchecks.io ping — dead man's switch
        sync: false
      - key: SAM_GOV_API_KEY   # app.pipeline.sam_gov -- not part of `scout pipeline`,
        sync: false           # triggered on its own via `scout sam-gov` (rate-limited, see that module)
      - key: LOG_FORMAT
        value: json
