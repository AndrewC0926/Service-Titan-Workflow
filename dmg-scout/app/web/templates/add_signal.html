{% extends "base.html" %}
{% block title %}Add Signal{% endblock %}
{% block content %}
<h2>Log a manual signal — engineer moves, prequal/bid invites, tips</h2>
<form method="post" action="/signals/add" class="grid" style="max-width:1000px">
  <select name="signal_type" required>
    {% for t in signal_types %}<option value="{{ t }}" {{ 'selected' if t=='manual_tip' }}>{{ t }}</option>{% endfor %}
  </select>
  <select name="stage">{% for s in stages %}<option>{{ s }}</option>{% endfor %}</select>
  <select name="category" title="Which board this lands on">
    {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
  </select>
  <input name="summary" placeholder="What happened (one line) *" required style="grid-column:1/-1">
  <input name="project_name" placeholder="Project name">
  <input name="developer" placeholder="Developer / owner">
  <input name="county" placeholder="County">
  <input name="state" placeholder="State (CA/NV/AZ)">
  <input name="mw_it" placeholder="MW IT (if known)" type="number" step="any">
  <input name="person_name" placeholder="Person (engineer move / contact)">
  <input name="person_org" placeholder="Their firm">
  <input name="url" placeholder="Link (if any)">
  <button style="grid-column:1/-1">Record signal</button>
</form>
<p class="dim">The signal enters the same scoring pipeline as scraped data and is resolved
against existing projects immediately.</p>
{% endblock %}
