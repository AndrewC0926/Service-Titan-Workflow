[project]
name = "dmg-scout"
version = "0.1.0"
description = "Early-signal data center project intelligence for HVAC manufacturers' rep sales"
requires-python = ">=3.11"
# Every entry below is upper-bounded, not just a floor. 2026-08-20 a bare
# `anthropic>=0.40` let a routine rebuild silently pick up anthropic 1.0.0 --
# a major release that dropped the `temperature` kwarg from Messages.create
# entirely (moved to extra_body, not removed from the API itself) -- and
# broke schedule extraction in production for 19 hours before anyone
# noticed, with no code of ours involved. `pip install .` re-resolves every
# dependency fresh on every image build (see Dockerfile's own note on why),
# so an unbounded floor is a standing promise that a rebuild can silently
# change what runs. Bounded at the next major version (or next minor for a
# 0.x package, since 0.x treats minor bumps as breaking by convention) --
# not exact-pinned here, so a deliberate `pip install -U` still finds
# compatible upgrades; requirements.lock.txt is the actual reproducibility
# guarantee (see Dockerfile), this is the documented intent behind it.
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "sqlmodel>=0.0.16,<0.1",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "httpx>=0.27,<1.0",
    "selectolax>=0.3.21,<1.0",
    "pdfplumber>=0.11,<1.0",
    "anthropic>=0.40,<1.0",
    "pydantic>=2.0,<3.0",  # already a transitive dep via fastapi/sqlmodel; explicit
                      # because app/schemas.py:OutreachCallExtraction depends on
                      # it directly -- see app/pipeline/voice_capture.py
    "jinja2>=3.1,<4.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "feedparser>=6.0,<7.0",
    "rapidfuzz>=3.6,<4.0",
    "python-dateutil>=2.9,<3.0",
    "itsdangerous>=2.1,<3.0",
    "fastmcp>=3.4.6,<4.0",
    "openpyxl>=3.1,<4.0",
    "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "respx>=0.21,<1.0",
    "ruff>=0.4,<1.0",
]
playwright = [
    "playwright>=1.44,<2.0",
]

[project.scripts]
scout = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Skipped by default -- a bare `pytest` run should never depend on network
# access or burn real API spend. Full coverage (CI, a pre-release check)
# runs `pytest -m ""` (or any -m expression, e.g. "live") to override this
# addopts value -- pytest takes the last -m it sees, so a later -m always
# wins over this default rather than adding to it.
addopts = "-m 'not live'"
markers = [
    "live: hits a real external network endpoint (e.g. the Anthropic API) -- costs real money/time and needs real credentials, unlike everything else in this suite (mocked via respx/monkeypatch). See tests/test_golden_regression.py.",
]

[tool.ruff]
line-length = 110
target-version = "py311"
