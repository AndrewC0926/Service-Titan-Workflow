[project]
name = "dmg-scout"
version = "0.1.0"
description = "Early-signal data center project intelligence for HVAC manufacturers' rep sales"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pdfplumber>=0.11",
    "anthropic>=0.40",
    "pydantic>=2.0",  # already a transitive dep via fastapi/sqlmodel; explicit
                      # because app/schemas.py:OutreachCallExtraction depends on
                      # it directly -- see app/pipeline/voice_capture.py
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "feedparser>=6.0",
    "rapidfuzz>=3.6",
    "python-dateutil>=2.9",
    "itsdangerous>=2.1",
    "fastmcp>=3.4.6",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]
playwright = [
    "playwright>=1.44",
]

[project.scripts]
scout = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
