    - {name: "Penn Barry", firm: ToroAire, category: fans_exhaust, subcategory: "roof/wall exhaust fans",
       description: "Roof and wall exhaust fans", value_tier: 3, equipment_type: null,
       oshpd_osp: null,
       oshpd_osp_basis: "Searched HCAI's OSP directory (hcai.ca.gov/facilities/building-safety/preapproval-programs/osp) and the third-party mirror at panacheg.com/osp-database/category/exhaust-smoke-control-fans (which lists 11 preapprovals across 7 holders: Loren Cook Company OSP-0033/0102/0442, Greenheck Fan Corporation OSP-0148/0223/0502/0503/0748, ENERVEX Inc. OSP-0343, ACME Engineering & Manufacturing OSP-0360, Twin City Fan OSP-0395). Penn Barry, PennBarry, Air System Components, and Air Distribution Technologies do not appear in that category listing. Site-restricted web searches for 'Penn Barry' and 'PennBarry' returned no relevant HCAI OSP records — only an unrelated 'Penn Mar' healthcare facility page. Could not locate any HCAI-hosted OSP application PDF naming Penn Barry. No evidence found either way in HCAI's own directory, so this is recorded as null rather than false — it's possible Penn Barry holds an OSP under a name/spelling not surfaced by these searches, or has simply never sought one. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Not applicable — Penn Barry's product line (roof and wall exhaust fans, including SupremeFan and related exhaust/supply products) falls outside AHRI's certifiable scope. AHRI's certification programs cover unitary AC/heat pumps, chillers, air handlers with coils, VRF, fan coils, ERV/HRV, PTAC, and similar equipment; general exhaust/ventilation fans are not an AHRI-certifiable category. Fan aerodynamic and sound performance for this equipment class is instead rated/certified under AMCA's Certified Ratings Program (e.g., ANSI/AMCA 210/300), which explicitly covers roof ventilators, wall/exhaust fans, and propeller/axial/centrifugal fans. Checked pennbarry.com and general web search results for any AHRI claim by Penn Barry — found none; the company's own marketing describes itself only as a ventilation products manufacturer with no AHRI reference. Retrieved 2026-08-09.",
       country_of_manufacture: "United States",
       country_of_manufacture_basis: "PennBarry's own site (pennbarry.com) identifies itself as a leading manufacturer of full service ventilation products based at 843 Indianapolis Ave., Lebanon, IN 46052 — a working plant address, not just a sales office. Corroborated by the PR Newswire release 'Air Distribution Technologies Completes Sale of PennBarry' (and matching coverage on mechanicalbusiness.com, citybiz.co, thermalcontrolmagazine.com, privsource.com, all June 2026), announcing that Air Distribution Technologies (Truelink Capital) sold PennBarry to Hessaire Products Inc. on June 23, 2026, explicitly describing PennBarry as a 'Lebanon, Indiana-based' manufacturer of ventilation solutions. IMPORTANT OWNERSHIP FLAG: as of this June 2026 divestiture, PennBarry is no longer a sister brand to Titus under Air Distribution Technologies/Air System Components — it is now owned by Hessaire Products — though its manufacturing location (Lebanon, IN, USA) is unaffected by the ownership change per these sources. Retrieved 2026-08-09.",
       competes_with: "Greenheck, Loren Cook Company, ACME Engineering & Prod",
       competes_with_basis: "Owler business-intelligence data explicitly lists PennBarry's top competitors as Loren Cook Company, Greenheck, and ACME. Corroborated by general industry knowledge: Greenheck, Loren Cook, and ACME Engineering are the other major North American manufacturers of commercial/industrial roof and wall power ventilators and exhaust fans, and are the standard alternates specified alongside PennBarry on mechanical schedules/basis-of-design comparisons. Retrieved 2026-08-09.",
       markets: [labs, industrial_warehouse],
       markets_basis: "pennbarry.com (retrieved 2026-08-09): Industrial catalog page explicitly states heavy-duty exhaust products 'handle the most extreme applications such as high temperature, corrosive chemicals, or spark resistant environments' for 'research labs, chemical plants, or food processing facilities,' and lists a dedicated 'Laboratory Exhaust' product category (vPlume, iPlume, vcPlume-Lite) — supports labs. Same catalog and homepage list an 'Axial Warehouse Exhaust (AWX)' product line under the Industrial section alongside general 'commercial and industrial ventilation' positioning — supports industrial_warehouse. Checked but found no explicit market copy for data_center, healthcare, education, hospitality, office, or multifamily on homepage, About PennBarry, Commercial catalog, Kitchen Ventilation page, Application Assistance page, or Industry Codes page. Some press-release/case-study pages render via client-side JS and could not be fully verified. Retrieved 2026-08-09."}
