# Companies watched on ATS job boards and in EDGAR full-text search.
#
# ATS board identifiers are opaque vendor strings — never guess them. Every one
# below was confirmed live AND checked to belong to the right company. Two
# plausible-looking guesses were real boards owned by unrelated firms:
# greenhouse "aligned" = alignedup.com (sales SaaS), ashby "vantage" =
# vantage.sh (cloud costs). Verify job titles before adding a board.
companies:
  developers:
    # Workday, not Greenhouse (greenhouse "vantagedatacenters" does not exist).
    - {name: "Vantage Data Centers", edgar_terms: ["Vantage Data Centers"],
       workday: {host: "vantagedc.wd1.myworkdayjobs.com", tenant: "vantagedc", site: "Vantage"}}
