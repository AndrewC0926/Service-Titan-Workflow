  # ---- selection tools ------------------------------------------------
  #
  # Which selection software a rep actually uses to spec one line. One row
  # per ProductLine at seed time (70 total, see app.accounts.seed_selection_tools)
  # -- lines NOT listed here get an all-null, verification_status=unchecked
  # row by default, not a guess. firm is deliberately absent from every
  # entry below: it's read from the ProductLine this joins to (the existing
  # DMG/ToroAire/both facet on /lines), never duplicated here.
  #
  # 2026-08-11 seed: web research, not manufacturer-direct, except Marley/
  # Recold (verification_status: confirmed -- SPX's own CoolSpec page names
  # both). Everything else here is verification_status: search_verified,
  # same discipline as the AHRI round, where several entries rested on a
  # manufacturer's own marketing copy rather than a live AHRI Directory hit
  # and were flagged accordingly rather than upgraded to a false confirm.
  #
  # RULE, do not violate when adding more of these: never infer a shared
  # tool from a corporate or manufacturing relationship. Geoclima and
  # Hecoclima share a physical Italian plant; ClimateCraft and ClimaCool are
  # both Oklahoma City under NIBE's Climate Control Group; Nailor owns
  # Engineered Comfort. None of that says anything about selection software
  # -- only a name explicitly published together (like SPX's CoolSpec page)
  # earns verification_status: confirmed or search_verified. Every other
  # apparent pairing stays unchecked until someone actually checks it. Penn
  # Barry was sold to Hessaire in mid-2026 and is no longer a Titus sister
  # brand -- that family relationship is stale even though manufacturing is
  # unaffected; do not resurrect it here.
  selection_tools:
    - {name: "AAON", tool_name: "ECat", vendor_url: "aaon.com/ecat-download", access_level: free_registration,
       what_it_outputs: "Full unit selection plus drawings and system calculators. A separate program, Heat Flow, covers coil-only selections -- not the same tool as ECat.",
       produces_submittal_docs: true,
       verified_by: "web research", verified_date: "2026-08-11", verification_status: search_verified}
    - {name: "Marley", tool_name: "CoolSpec", vendor_url: "spxcooling.com/coolspec", access_level: free_registration,
       what_it_outputs: "Cooling tower / fluid cooler / evaporative condenser selection. Covers both the Marley and Recold lines -- see spxcooling.com/coolspec, which names both directly. Marley FIT is a separate tool, for components and fill only, not full-unit selection.",
       produces_submittal_docs: true,
       verified_by: "SPX's own CoolSpec page (spxcooling.com/coolspec)", verified_date: "2026-08-11", verification_status: confirmed}
    - {name: "Recold", tool_name: "CoolSpec", vendor_url: "spxcooling.com/coolspec", access_level: free_registration,
       what_it_outputs: "Same tool as Marley, not a separate Recold-branded program -- SPX's own CoolSpec page names both Marley and Recold as covered lines.",
       produces_submittal_docs: true,
       verified_by: "SPX's own CoolSpec page (spxcooling.com/coolspec)", verified_date: "2026-08-11", verification_status: confirmed}
    - {name: "TCF/Twin City Fan", tool_name: "Fan Selector 10",
       vendor_url: "tcf.com/resources/fan-selection-software", access_level: free_registration,
       what_it_outputs: "Fan selection; credentials arrive by email after registration, not instant access.",
       produces_submittal_docs: null,
       verified_by: "web research", verified_date: "2026-08-11", verification_status: search_verified}
    - {name: "Titus", tool_name: "Multiple programs by product family (not one unified tool)",
       vendor_url: "titus-hvac.com", access_level: null,
       what_it_outputs: "Splits by product family rather than one program: DLSC for air distribution, a fan-coil selector run per AHRI-410, a separate louver program, a separate chilled-beam program. access_level is left null on purpose -- it varies by which of these a rep actually opens, not one access tier for the whole line.",
       produces_submittal_docs: null,
       verified_by: "web research", verified_date: "2026-08-11", verification_status: search_verified}

# app.pipeline.sam_gov's own search-quota guard (see that module's docstring
# for the underlying ~10/day figure, confirmed real 2026-08-13 via an actual
# 429 from api.sam.gov after 12 calls in one day). Both budgets are counted
# against the SAME rolling-24h call log (SamGovSearchCall), so they cap a
# combined total, not two independent 10-call allowances -- a scheduled run
# spending its 4 still leaves only 4 more for the rest of that day, not a
# fresh 8. scheduled_call_budget is deliberately less than half of
# daily_call_budget: a scheduled run's whole point is to run unattended, so
# it must never be the reason a same-day manual investigation (like the one
# that hit the real 429) finds the well already dry.
sam_gov:
  daily_call_budget: 8
  scheduled_call_budget: 4
