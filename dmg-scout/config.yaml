    - {name: "Strobic Air", firm: DMG, category: process_exhaust, subcategory: "lab/fume exhaust fans",
       description: "Lab and fume exhaust fans (Tri-Stack)", value_tier: 2, equipment_type: null,
       oshpd_osp: null,
       oshpd_osp_basis: "Searched HCAI's official OSP directory, the HCAI OSP-list-by-category PDF, and the third-party mirror panacheg.com/osp-database/category/exhaust-smoke-control-fans (which lists all 11 current OSP entries in the Exhaust/Smoke Control Fans category: manufacturers ACME Engineering & Manufacturing, ENERVEX, Greenheck/Greenheck Fan Corp, Loren Cook/Loren Cook Company, and Twin City Fan, OSP numbers 0033, 0102, 0148, 0223, 0343, 0360, 0395, 0442, 0502, 0503, 0748). Strobic Air and Tri-Stack do not appear anywhere in that category or in a site-restricted search of hcai.ca.gov. Two search hits that initially looked like Strobic Air OSP records were checked directly and ruled out: OSP-0272 is actually ClimateCraft, Inc. (FanMatrix/MiniTower/MTX fan towers, expires 07/18/2029), and OSP-0481 is Evapco (AXS cooling towers, already expired 12/31/2022). No HCAI-published OSP record for Strobic Air or the Tri-Stack brand was found in any of these official or mirrored sources. This is an absence-of-evidence result, not a confirmed rejection/expiration, so the field is left null rather than false. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Not applicable — AHRI does not operate a certification program for lab/fume exhaust fans. AHRI's roughly 50 certification programs cover residential/commercial HVAC, refrigeration, water heating, and heat pump equipment — no fan or exhaust-fan category exists. Reviewed strobicair.com (including the Tri-Stack product pages): no AHRI logo, claim, or directory reference appears anywhere on the site; the only standards body referenced is AMCA (Air Movement and Control Association), via a dedicated 'AMCA Guidelines' page — consistent with fans being AMCA-rated/certified rather than AHRI-certified. ahri_certified is null/not-applicable, not false, since the product category is outside AHRI's certifiable scope rather than having failed or lacked certification within it. Retrieved 2026-08-09.",
       country_of_manufacture: "United States",
       country_of_manufacture_basis: "Company website states verbatim: 'Headquartered and manufactured in the United States.' Headquarters/facility listed as 140 West Orvilla Road, Lansdale, PA 19446. Source: strobicair.com/about-us/. Strobic Air is now part of SPX Technologies' Engineered Air Movement division; no additional overseas plant locations were found on the site. Retrieved 2026-08-09.",
       competes_with: "Greenheck (Vektor-Cyclone/Vektor series), Twin City Fan (Laboratory & Fume Exhaust Fans / BCIFE), Loren Cook Company (Power Plume)",
       competes_with_basis: "Verified directly against each manufacturer's own product pages: Greenheck's site lists a Vektor-brand family (Vektor-CD, -CH, -H, -MD, -MH) of laboratory exhaust fan systems in the same 500-122,000 CFM high-plume dilution category as Strobic Air's Tri-Stack; Twin City Fan (also a DMG-carried line — see that line_card entry) lists a dedicated 'Laboratory & Fume Exhaust Fans' category including the BCIFE model; Loren Cook Company lists a 'Power Plume' product line, a high-plume dilution fan directly analogous to Tri-Stack. These three are the manufacturers most commonly specified as alternates to Strobic Air on lab/fume exhaust bid packages, per general industry knowledge in the mechanical contracting trade. New York Blower Company is also frequently cited in this space per general industry knowledge, but its site could not be reached to verify directly (403 error), so it was left out of the confirmed list. Retrieved 2026-08-09.",
       markets: [healthcare, industrial_warehouse, education, labs],
       markets_basis: "strobicair.com, retrieved 2026-08-09: exhaust-systems page states these are 'essential in facilities where air quality and control directly impact health, safety, and operational performance—such as laboratories, research centers, cleanrooms, and industrial sites' and 'Whether you're working in life sciences, healthcare, or high-containment research...'. About Us page references 'solutions for universities, government facilities, pharmaceutical plants' and 'exhaust systems for laboratory fume hoods.' Tri-Stack product page explicitly states 'Ideal for use in hospitals and biomedical/research laboratories at universities' and 'Ideal for use in pharmaceutical, chemical, and petrochemical organizations.' No explicit mentions of data_center, hospitality, office, or multifamily were found on any checked page. Retrieved 2026-08-09."}
