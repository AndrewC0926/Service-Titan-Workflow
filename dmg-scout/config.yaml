    - {name: "Aldes", firm: both, category: air_handling, subcategory: "ventilation / ERV",
       description: "Ventilation, ERV, exhaust products", value_tier: 3, equipment_type: null,
       oshpd_osp: null,
       oshpd_osp_basis: "Searched HCAI's official 'OSP List by Category' PDF (the live document served at hcai.ca.gov/document/osp-list-by-category/, which redirects to https://hcai.ca.gov/wp-content/uploads/2020/10/OSP-List-by-Category-18.pdf, Last-Modified 2022-03-03, retrieved 2026-08-09). Full-text-searched all pages for 'Aldes' — zero matches anywhere, including every HVAC-relevant category: Air Conditioning Units - Custom, Data Room, Inline Fans and Terminal, Packaged, and Split; Air Filters; Fan Coil Units; Humidification Systems; and Exhaust/Smoke Control Fans (Exhaust/Smoke Control Fans lists only Loren Cook, Greenheck, Twin City Fan, Enervex, ACME). No standalone ERV/energy-recovery-ventilator category exists on the HCAI list at all. Also ran general web searches ('Aldes HCAI OSP special seismic certification preapproval', 'Aldes OSHPD OSP number site:hcai.ca.gov', 'Aldes ventilation seismic certification hospital California') — no results tie Aldes to any HCAI/OSHPD OSP record or number. No evidence found of a current OSP for Aldes in HCAI's own directory, but absence from this list is not proof no OSP exists (the PDF could be incomplete/outdated relative to eServices, which was not independently queryable) — so this is recorded as null rather than false. Retrieved 2026-08-09.",
       ahri_certified: true,
       ahri_certified_basis: "Relevant category: Air-to-Air Energy Recovery Ventilators (ERV/HRV), certifiable under AHRI Standard 1060. Direct verification attempted at ahridirectory.org (including the ERV directory search page and domain root) but the site returned HTTP 402 Payment Required on every path tried. As an alternate approach, Aldes' own technical/product documentation was checked and explicitly names the standard (not just vague 'AHRI compliant' marketing language): Aldes commercial HRV/ERV product pages and spec sheets (aldes-na.com) state specific models — CW10000i/e, CW8000i/e, LE2000i, E650L-N, E1100L-N, E1800L-N, H1800-N, SE1000e, E280-SRG — are 'AHRI Certified to Standard 1060'; and Aldes' Advanced Commercial ERV page (advcom.aldes.us/advcom) states its High Latent Transfer (HTL) core is 'certified by AHRI' and lists 'AHRI certified' as a product feature. This is manufacturer-published documentation naming the specific AHRI program/standard for named models, not just generic prose, but it was not cross-confirmed against AHRI's own participant listing since ahridirectory.org could not be reached directly. Retrieved 2026-08-09.",
       country_of_manufacture: "France (primary manufacturing base) with additional production/assembly in Canada; US operations appear to be sales/distribution rather than manufacturing",
       country_of_manufacture_basis: "Aldes Group is headquartered in Venissieux (Lyon area), France, founded in Lyon in 1925 (aldes-na.com/a-history-of-innovation). The corporate site (aldes.com/who-are-we/aldes) states the group operates 12 production sites globally alongside 5 logistics hubs and 3 R&D centers, though it does not break out sites by country. Trade press (Le Journal des Entreprises, 'Aldes: Pourquoi le groupe ferme le site industriel de Strasbourg,' 2017-05-05) confirms Aldes operated multiple industrial/production sites within France (four remaining after the 2017 Strasbourg plant closure), consistent with France being a core manufacturing base. Separately, Aldes North America's careers page (aldes-na.com/careers-at-aldes) lists open roles such as 'Electromechanical Technician - Assembly' and 'Assembler' tied to its Saint-Leonard-d'Aston, Quebec, Canada address — indicating an actual assembly/production facility in Canada, likely tracing to Aldes' 2010 acquisition of Air 2000, a Canadian dual-flow ventilation specialist. No evidence was found of manufacturing at the US office (Bradenton, FL), which appears to be sales/administrative only. Could not independently confirm country-by-country allocation of the 12 production sites (e.g., whether China listed among Aldes subsidiaries is a sales office or also manufactures) — flagging this as an open gap rather than asserting it. Retrieved 2026-08-09.",
       competes_with: "RenewAire, Zehnder America, Greenheck, Ventacity Systems",
       competes_with_basis: "General industry knowledge. Aldes's InspirAIR Commercial and Light Commercial HRV/ERV lines (269-2170 CFM enthalpy/heat recovery units) sit in the specialty commercial dedicated-ERV/HRV category, where the standard cross-bid set on mechanical specs is: RenewAire (US-based dedicated ERV/HRV manufacturer, most frequently specified as the base-bid alternate against Aldes on commercial jobs), Zehnder America (Swiss-heritage import like Aldes, similar premium high-efficiency enthalpy/plate exchanger positioning and comparable price tier), Greenheck (major US commercial ventilation OEM whose ERV/ERCB product lines compete directly on healthcare/education/office bids), and Ventacity Systems (also a DMG-carried line — see that line_card entry; specializes in high-efficiency commercial DOAS/ERV systems aimed at the same IAQ-driven light-commercial and commercial segment). These are treated as the direct comparison set rather than full-line HVAC OEMs (Trane, Carrier, Daikin) because those compete on total HVAC systems, not head-to-head as dedicated ERV/HRV ventilation specialists. Retrieved 2026-08-09.",
       markets: [healthcare, industrial_warehouse, education, hospitality, office, multifamily],
       markets_basis: "Aldes North America site (aldes-na.com) has a Solutions menu with dedicated named vertical pages and explicit marketing copy for: Healthcare Facilities ('Committed to Patients' Health Through Better Air Quality', aldes-na.com/solutions/healthcare-facilities), Hotel/Hospitality ('Providing hotels with aesthetically pleasing, comfortable and healthy living spaces', aldes-na.com/solutions/hotel — features a Marriott case study), Education ('Ventilating schools means improving indoor air quality and fostering learning ability', aldes-na.com/solutions/education), Office ('Optimizing Energy, Comfort, and Air Quality in Working Environments', aldes-na.com/solutions/office), and Multi-family ('designed to meet the needs and challenges of condos, apartments and other multi-family buildings', aldes-na.com/solutions/multi-family). Industries page (aldes-na.com/solutions/industries) explicitly targets the industrial sector ('Designed to meet the needs of the industrial sector, our ventilation systems provide efficient air renewal up to 11,000 CFM'; references 'production sites'), supporting industrial_warehouse. Checked but found no data_center or labs mentions on Aldes-NA site or on global aldes.com. Retrieved 2026-08-09."}
