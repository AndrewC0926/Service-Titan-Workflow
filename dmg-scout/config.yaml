    - {name: "Howden", firm: DMG, category: fans_exhaust, subcategory: "industrial fans & blowers",
       description: "Industrial fans, blowers, compressors", value_tier: 2, equipment_type: null,
       oshpd_osp: null,
       oshpd_osp_basis: "Searched HCAI's OSP list-by-category directory (hcai.ca.gov/document/osp-list-by-category/) and the third-party mirror at panacheg.com/osp-database/category/exhaust-smoke-control-fans, which enumerates all 11 current/expired HCAI Exhaust/Smoke Control Fans OSP records: ACME Engineering & Manufacturing (OSP-0360), ENERVEX (OSP-0343), Greenheck / Greenheck Fan Corp (OSP-0223 expired, OSP-0748, OSP-0148, OSP-0502, OSP-0503), Loren Cook / Loren Cook Company (OSP-0102, OSP-0033, OSP-0442), and Twin City Fan (OSP-0395, expired). Howden, Howden Buffalo, and Howden American Fan do not appear in this list under any name. Also checked panacheg.com/osp-database/manufacturer/howden directly, which returned a 404 (no manufacturer page exists for Howden on that mirror). No HCAI-hosted OSP application PDF for Howden was located. This is a negative search result, not a rejected/expired HCAI record, so absence of evidence should not be read as a denial. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Not applicable — Howden's product lines (industrial axial/centrifugal fans, centrifugal/reciprocating/screw/diaphragm process blowers and compressors for power, mining, water, oil & gas, and industrial refrigeration applications) fall outside AHRI's certification scope. AHRI's certification programs cover unitary AC/heat pumps, chillers, air handlers with coils, VRF, fan coils, PTAC/PTHP, ERV/HRV, furnaces, boilers, and similar HVACR equipment — not industrial process fans, blowers, or compressors; industrial fans are rated under AMCA standards instead. Direct check of Howden's own marketing (chartindustries.com/Businesses-Brands/Howden, since Howden is now a Chart Industries brand) found zero mentions of AHRI or AHRI certification anywhere on the page or its described product lines. Field set to null (not false) because the category is not AHRI-certifiable, not because Howden failed a certification it could have pursued. Retrieved 2026-08-09.",
       country_of_manufacture: "Multiple countries — no single country of manufacture. Howden is a multinational manufacturer (UK-originated, Scottish founding in Glasgow, 1854) with plants historically and currently spanning the UK, Netherlands, Germany, Czech Republic, India, and China, among others.",
       country_of_manufacture_basis: "chartindustries.com/Businesses-Brands/Howden names specific Howden facilities in Peterborough UK (Peter Brotherhood), Chesterfield UK, Frankenthal Germany, Decin Czech Republic (Chart Ferox), and Netherlands (cooling fans). chartindustries.com/locations confirms Chart's (parent company since 2023) international engineering and manufacturing network spans the US, UK, Germany, France, Netherlands, Italy, Czech Republic, and Nordic countries in Europe, plus China, India, Japan, South Korea, Taiwan, Singapore, Thailand, and Vietnam in Asia. Note: all howden.com URLs now 301-redirect to this single Chart Industries brand page, so a Howden-only (vs. combined Chart) facility list could not be independently verified beyond what is stated there; the multi-country characterization is corroborated by Howden's known corporate history (Charter International 1997 -> Colfax 2012 -> KPS Capital/Howden Group 2019 -> Chart Industries 2023) as a long-standing multinational fan/blower/compressor manufacturer. Retrieved 2026-08-09.",
       competes_with: "Atlas Copco, Aerzen, Gardner Denver (Ingersoll Rand), Sulzer",
       competes_with_basis: "General industry knowledge. These manufacturers overlap most directly with Howden's core lines: Atlas Copco and Aerzen both compete head-to-head in industrial blowers and process gas/air compressors; Gardner Denver (now part of Ingersoll Rand) competes in rotary/centrifugal blowers and compressors for industrial and wastewater applications; Sulzer competes in large industrial compressors and rotating equipment for process industries. Howden itself (now a Chart Industries brand) is known for centrifugal and axial fans, Roots-type blowers, and process compressors used in power, oil & gas, wastewater, and mining — the same end markets these four companies serve with comparable product lines. Retrieved 2026-08-09.",
       markets: [data_center, industrial_warehouse],
       markets_basis: "howden.com now redirects entirely to chartindustries.com/Businesses-Brands/Howden. data_center: dedicated Howden/Chart data-center literature explicitly names Howden FPX and SX cooling fans for data center cooling, plus a dedicated brochure and case study 'Scalable Cooling Innovation for a Large-Scale Hyperscaler.' industrial_warehouse: Howden's own cooling-fan applications page explicitly lists 'Industrial: General manufacturing, HVAC-R applications' as a target application sector, backed by an industrial case study, alongside its broader named heavy-industrial verticals (cement, glass, metals processing, chemical, mining, marine). Checked but found no explicit healthcare, education, hospitality, labs, office, or multifamily copy, case studies, or named vertical pages anywhere on the Howden/Chart site. Retrieved 2026-08-09."}
