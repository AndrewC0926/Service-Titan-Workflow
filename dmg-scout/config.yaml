# =============================================================================
# REGULATORY TRIGGERS (Phase 6) — a customer-facing citation table, not a
# scoring input. Every entry was traced to bill text, CCR text, or the
# regulator's own page (not trade press) before it was hard-coded here — see
# the research trail referenced in each entry's verification.notes.
#
# docs/CHARTER.md's verification-status rule governs this block: an entry
# missing `verification.status: verified` is EXCLUDED from customer-facing
# output by every caller (see app/pipeline/regulatory.py's
# customer_facing_triggers()) — never rendered with a caveat. A caveated wrong
# date is still a wrong date in front of a customer; the exclusion is the
# safety mechanism, not a warning label.
#
# The "2030 gas furnace ban" is deliberately NOT an entry here. Both the
# statewide CARB rulemaking (Board vote delayed past 2025) and the LA-region
# SCAQMD rule covering the same target (PAR 1111/1121) were REJECTED 7-5 by
# its Governing Board in June 2025 -- as of this writing neither is adopted
# law. Presenting a rejected rule as an enacted deadline is exactly the
# mistake this table exists to prevent. It's tracked as a watch item in
# docs/CHARTER.md instead, not encoded as a trigger.
# =============================================================================
regulatory_triggers:
  sb_1206_hfc_phasedown:
    name: "SB 1206 — Virgin HFC Refrigerant Sale Ban"
    citation: "Health & Safety Code §§ 39735-39736 (SB 1206, Ch. 884, Stats. 2022); reclaimed-content cap via AB 663 (Ch. 161, Stats. 2025)"
    jurisdiction: "CA"
    # The single largest trigger: nearly all commercial DX equipment installed
    # ~2010-2024 runs R-410A (GWP ~2,088) -- see app/pipeline/regulatory.py's
    # date-range inference, which needs no nameplate data, only permit
    # install year.
    affected_categories: ["existing_dx_refrigeration", "existing_dx_hvac"]
    # Bans the SALE of virgin refrigerant above each GWP ceiling, effective
    # the stated date. R-410A (GWP ~2,088) becomes unpurchaseable virgin
    # starting the 2030 tier.
    tiers:
      - gwp_max: 2200
        effective_date: "2025-01-01"
      - gwp_max: 1500
        effective_date: "2030-01-01"
      - gwp_max: 750
        effective_date: "2033-01-01"
    reclaimed_exempt: true
    reclaimed_new_content_cap_pct: 15  # AB 663: reclaimed refrigerant must be <=15% newly-produced HFC by weight
    source_url: "https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202120220SB1206"
    verification:
      status: verified
      checked_date: "2026-08-07"
      notes: >
        Bill text (leginfo) confirms three GWP tiers at the stated dates.
        AB 663 text confirms the 15% new-content cap on the reclaimed
        exemption. No implementing CCR section found distinct from the
        statute -- treat H&SC §39735 itself as the citation.

  carb_refrigerant_management_program:
    name: "CARB Refrigerant Management Program (RMP)"
    citation: "17 CCR §§ 95380-95398"
    jurisdiction: "CA"
    affected_categories: ["existing_commercial_refrigeration"]
    # Two distinct duties by system size -- do not collapse into one
    # "50 lbs = report" rule, which overstates who actually files annually.
    thresholds:
      register_only_lbs_min: 50    # 50-200 lbs: register, no annual report, no fee
      annual_report_lbs_min: 200   # >=200 lbs: register AND report annually
      annual_report_due: "March 1"
      large_facility_lbs_min: 2000 # higher fee tier, same March 1 report duty
    gwp_threshold: 150  # applies to systems whose refrigerant charge is >=50 lbs at GWP >= this
    # No public facility-level list exists (confirmed: CARB's R3 portal is a
    # login-gated filer system, not a public lookup; data.ca.gov has no
    # dataset). A facility becomes a CANDIDATE via assessor use code (see
    # app/pipeline/regulatory.py), not a confirmed R3 filer -- the table
    # cannot say who actually reported, only who is a plausible target.
    source_url: "https://ww2.arb.ca.gov/our-work/programs/refrigerant-management-program"
    verification:
      status: verified
      checked_date: "2026-08-07"
      notes: >
        Confirmed on CARB's own RMP program page: 50 lb register-only
        threshold, 200 lb annual-report threshold, March 1 due date. This
        entry was originally drafted conflating it with a separate
        retail-food-specific GWP rule (see carb_retail_food_refrigeration_gwp
        below) -- kept deliberately separate after the correction.

  carb_retail_food_refrigeration_gwp:
    name: "CARB Retail Food Refrigeration Weighted-Average GWP Phasedown"
    citation: "17 CCR §§ 95370-95379 (implementing SB 1013, Stats. 2018)"
    jurisdiction: "CA"
    # Narrower than general commercial refrigeration -- retail food facilities
    # specifically (supermarkets, grocery, convenience stores with coolers).
    affected_categories: ["retail_food_refrigeration"]
    tiers:
      - weighted_avg_gwp_max: 2500
        effective_date: "2026-12-31"
      - weighted_avg_gwp_max: 1400
        effective_date: "2030-01-01"
    source_url: "https://www.law.cornell.edu/regulations/california/17-CCR-95374"
    verification:
      status: verified
      checked_date: "2026-08-07"
      notes: >
        A DIFFERENT regulation from the RMP above, easy to conflate because
        both concern refrigerant GWP -- this one is a weighted-average
        composition requirement scoped to retail food refrigeration, not a
        general leak-rate/emissions duty. Cornell's CCR mirror used for
        section numbers; recommend a final check against the official CCR
        (OAL) text before the first customer-facing use.

  title24_2025_heat_pump_baseline:
    name: "California Title 24 (2025), Part 6 — Heat Pump Prescriptive Baseline"
    citation: "California Building Energy Efficiency Standards, Title 24 Part 6 (2025 edition)"
    jurisdiction: "CA"
    affected_categories: ["existing_rooftop_dx_replacement", "new_construction_space_conditioning"]
    effective_date: "2026-01-01"  # applies to permit applications submitted on/after this date
    # Heat pump becomes the new PRESCRIPTIVE DEFAULT for single-zone gas RTU
    # replacement -- not an absolute mandate. An alternate prescriptive path
    # and the performance compliance path both remain legally available, so
    # "must be heat pump" overstates it. The exact Btu/h cutoff for which RTU
    # replacements this applies to is deliberately NOT hard-coded here --
    # medium-confidence secondary-sourced only, not independently confirmed
    # against the actual Nonresidential Compliance Manual section.
    source_url: "https://www.energy.ca.gov/programs-and-topics/programs/building-energy-efficiency-standards/2025-building-energy-efficiency"
    verification:
      status: verified
      checked_date: "2026-08-07"
      notes: >
        Effective date and prescriptive-default-with-escape-valves framing
        confirmed via energy.ca.gov and a CEC docket document. The specific
        Btu/h threshold is left unspecified pending a direct pull of the
        Nonresidential Compliance Manual -- do not add it without that check.

  la_ebewe_audit_retrocommissioning:
    name: "LA EBEWE — ASHRAE Level II Audit + Retro-Commissioning"
    citation: "LAMC Division 97 (Ord. No. 184674, amended Ord. No. 185198); requirement at LAMC §91.9706"
    jurisdiction: "City of Los Angeles"  # NOT LA County, NOT statewide
    affected_categories: ["existing_commercial_building_gt_20000sqft"]
    cycle_years: 5
    sqft_threshold: 20000  # 7,500 for municipal buildings
    standard: "ASHRAE Level II Energy & Water Audit (per Procedures for Commercial Building Energy Audits); retro-commissioning per ASHRAE Guideline 0.2"
    source_url: "https://dbs.lacity.gov/services/green-building-sustainability/ebewe"
    verification:
      status: verified
      checked_date: "2026-08-07"
      notes: >
        Ordinance numbers, 5-year cycle and 20,000 sqft threshold corroborated
        directly on LADBS's own program page. Full LAMC §91.9706 text itself
        was blocked (403) in this research pass -- recommend one manual pull
        of the code section before the first customer-facing use, but
        confidence is high given it comes from the regulator's own materials.

  hcai_sb1953_hospital_seismic:
    name: "HCAI SB 1953 — Hospital Seismic Safety"
    citation: "Health & Safety Code §130060 et seq. (SB 1953, 1994, as amended)"
    jurisdiction: "CA"
    affected_categories: ["general_acute_care_hospital"]
    # SPC-1 (highest risk) deadline of Jan 1 2020 has already passed.
    spc2_phaseout_date: "2030-01-01"
    npc5_operational_date: "2030-01-01"  # fully operational post-earthquake
    # SB 1432 (2024) would have granted a 5-year extension to 2035 -- it was
    # VETOED by the Governor in September 2024 and never became law. 2030
    # remains the current, operative deadline.
    source_url: "https://hcai.ca.gov/facilities/building-safety/seismic-compliance-and-safety/hospital-seismic-safety/"
    verification:
      status: verified
      checked_date: "2026-08-07"
      notes: >
        Confirmed directly on hcai.ca.gov. The would-be 2035 extension
        (SB 1432) veto was independently confirmed via the Governor's veto
        message. No extension currently on the books.

  ashrae_241_infectious_aerosols:
    name: "ASHRAE 241-2023 — Control of Infectious Aerosols"
    citation: "ANSI/ASHRAE Standard 241-2023 (plus Addendum a, Oct 2024)"
    jurisdiction: "US"  # voluntary standard; not yet adopted by reference into Title 24 or LAMC
    affected_categories: ["all_mechanically_ventilated_commercial"]
    metric: "Equivalent Clean Airflow (ECAi) — per-occupant clean-air delivery target"
    # MERV-A is a DISTINCT rating from plain MERV, via an optional ASHRAE
    # 52.2 Appendix J conditioning test that simulates real-world efficiency
    # degradation -- quoting "MERV 11" instead of "MERV-A 11" is a real error.
    filtration_minimum: "MERV-A 11 (or equivalent air cleaning)"
    plain_merv_grace_period_ended: "2025-01-01"  # after this, only MERV-A-rated filters count toward compliance credit
    # EPA references this standard directly (confirmed by direct fetch of
    # epa.gov's ventilation guidance page). A CDC reference is claimed in
    # secondary sources but was NOT independently confirmed against cdc.gov
    # in this research pass -- deliberately omitted from this entry rather
    # than asserted on secondary sourcing alone.
    referenced_by: ["EPA"]
    source_url: "https://www.epa.gov/indoor-air-quality-iaq/ventilation-and-coronavirus-covid-19"
    verification:
      status: verified
      checked_date: "2026-08-07"
      notes: >
        ECAi metric and MERV-A 11 distinction confirmed via ASHRAE's own fact
        sheet. EPA reference confirmed via direct fetch. CDC reference
        deliberately left out of `referenced_by` pending independent
        confirmation -- add it only after a direct cdc.gov check.

# =============================================================================
# ACCOUNTS — line-card coverage for the ~100 dormant accounts, gap ranking, and
# replacement forcing. Three questions per account: what they have (coverage,
# entered by hand — no import exists yet), what they should have (adjacency
# scoring below, against the line card), and what is forcing them to buy
# (install year against replacement.service_life above — no new table, the
# same ownership-branched one Phase B already settled).
# =============================================================================
accounts:
  # Typical single-PO dollar range for one tier of equipment, used to rank
  # coverage gaps by estimated dollar VALUE rather than by row count — a
  # missing custom air handler (tier 1) must outrank twenty missing diffusers
  # (tier 4) even though the diffusers are twenty rows on the gap list. This is
  # the fix a Trane portfolio leader named directly: rank on unit value.
  #
  # ESTIMATED from typical DMG/ToroAire deal sizes — nobody has measured actual
  # invoice history against these tiers yet. If a ranked gap list looks wrong,
  # correct these bands (or a line's value_tier below) before touching the
  # adjacency weights; they are the more likely place to be off.
  value_tier_dollars:
    1: {low: 75000, high: 500000,
        source: "ESTIMATED: custom AHUs, chillers, cooling towers, large RTU/DOAS packages"}
    2: {low: 20000, high: 75000,
        source: "ESTIMATED: VRF systems, WSHP, mid-size RTUs, industrial fans/blowers"}
    3: {low: 5000, high: 20000,
        source: "ESTIMATED: VFDs, controls packages, VAV terminals, sound attenuators"}
    4: {low: 1000, high: 5000,
        source: "ESTIMATED: diffusers/grilles as a package, filters, small heaters, louvers"}
    5: {low: 200, high: 1000,
        source: "ESTIMATED: small accessories, individual components"}

  # Category-to-category affinity: "an account that already owns category A is
  # this relevant a fit for category B", 0-1. Declarative and sparse — an
  # unlisted pair defaults to 0 (no fit), which is the point: it is how a
  # rooftop-only account never sees Seresco natatorium units or Monoxivent fume
  # exhaust in its gap list, without a keyword or an LLM call deciding that at
  # run time. Symmetric — code applies each edge both directions — so add a
  # pair once. Not inference: every number here is a first-pass judgment call
  # by category, meant to be corrected in place by whoever actually reps these
  # lines, not re-derived.
  #
  # Two categories exist specifically because one adjacency example demanded
  # it: `fans_exhaust` (general commercial/industrial fans — a rooftop unit
  # project plausibly needs these too) is split from `process_exhaust` (lab,
  # fume, vehicle/welding exhaust — Strobic Air, Monoxivent — a specialized
  # vertical a generic rooftop account has no use for). Collapsing them into one
  # "fans" category would have made Monoxivent look like a fit for every
  # rooftop account, which is exactly the wrong answer the category split
  # exists to prevent.
  adjacency:
    categories:
      - rooftop_units            # packaged RTUs, self-contained units
      - air_handling              # custom/semi-custom AHUs, DOAS, ERV, cleanroom air handling
      - vrf_split                 # VRF/VRV, ductless, WSHP, PTAC/PTHP
      - chillers_cooling          # chillers, modular chillers
      - cooling_towers            # cooling towers, closed-circuit coolers, heat rejection
      - controls                  # BAS controllers/actuators, VFDs, control dampers, zoning
      - air_distribution          # diffusers, grilles, registers, VAV terminals, louvers, fabric duct
      - fans_exhaust              # general commercial/industrial fans, blowers, roof/wall exhausters
      - process_exhaust           # lab/fume exhaust, vehicle/welding fume extraction
      - filtration_iaq            # filters, UV disinfection, ionization, electronic air cleaners
      - acoustics_vibration       # sound attenuators, vibration isolation
      - heaters                   # unit heaters, duct heaters, make-up air heaters
      - humidification_dehumidification  # humidifiers, pool dehumidification, heat-pipe dehumidification
      - specialty_cooling         # evaporative cooling, HVLS fans, chilled beams/radiant
      - accessories               # access doors, louvers, curbs, air curtains
      - residential_light_commercial     # bath fans, range hoods, residential ventilation
      - water_treatment           # HVAC water treatment
      - monitoring_sensors        # airflow measurement, sensors

    edges:
      - [rooftop_units, air_handling, 0.2]
      - [rooftop_units, vrf_split, 0.2]
      - [rooftop_units, chillers_cooling, 0.1]
      - [rooftop_units, cooling_towers, 0.1]
      - [rooftop_units, controls, 0.8]
      - [rooftop_units, air_distribution, 0.8]
      - [rooftop_units, fans_exhaust, 0.5]
      - [rooftop_units, filtration_iaq, 0.4]
      - [rooftop_units, acoustics_vibration, 0.5]
      - [rooftop_units, heaters, 0.2]
      - [rooftop_units, specialty_cooling, 0.1]
      - [rooftop_units, accessories, 0.3]
      - [rooftop_units, residential_light_commercial, 0.1]
      - [rooftop_units, monitoring_sensors, 0.3]

      - [air_handling, vrf_split, 0.1]
      - [air_handling, chillers_cooling, 0.7]
      - [air_handling, cooling_towers, 0.5]
      - [air_handling, controls, 0.9]
      - [air_handling, air_distribution, 0.8]
      - [air_handling, fans_exhaust, 0.5]
      - [air_handling, process_exhaust, 0.3]
      - [air_handling, filtration_iaq, 0.8]
      - [air_handling, acoustics_vibration, 0.7]
      - [air_handling, heaters, 0.3]
      - [air_handling, humidification_dehumidification, 0.5]
      - [air_handling, specialty_cooling, 0.3]
      - [air_handling, accessories, 0.3]
      - [air_handling, water_treatment, 0.2]
      - [air_handling, monitoring_sensors, 0.6]

      - [vrf_split, chillers_cooling, 0.1]
      - [vrf_split, controls, 0.7]
      - [vrf_split, air_distribution, 0.4]
      - [vrf_split, fans_exhaust, 0.3]
      - [vrf_split, filtration_iaq, 0.2]
      - [vrf_split, acoustics_vibration, 0.2]
      - [vrf_split, heaters, 0.1]
      - [vrf_split, specialty_cooling, 0.1]
      - [vrf_split, accessories, 0.1]
      - [vrf_split, residential_light_commercial, 0.2]
      - [vrf_split, monitoring_sensors, 0.2]

      - [chillers_cooling, cooling_towers, 0.9]
      - [chillers_cooling, controls, 0.8]
      - [chillers_cooling, air_distribution, 0.3]
      - [chillers_cooling, fans_exhaust, 0.2]
      - [chillers_cooling, process_exhaust, 0.1]
      - [chillers_cooling, filtration_iaq, 0.2]
      - [chillers_cooling, acoustics_vibration, 0.5]
      - [chillers_cooling, heaters, 0.1]
      - [chillers_cooling, humidification_dehumidification, 0.2]
      - [chillers_cooling, specialty_cooling, 0.4]
      - [chillers_cooling, accessories, 0.2]
      - [chillers_cooling, water_treatment, 0.6]
      - [chillers_cooling, monitoring_sensors, 0.4]

      - [cooling_towers, controls, 0.6]
      - [cooling_towers, air_distribution, 0.1]
      - [cooling_towers, fans_exhaust, 0.2]
      - [cooling_towers, acoustics_vibration, 0.5]
      - [cooling_towers, specialty_cooling, 0.1]
      - [cooling_towers, water_treatment, 0.8]
      - [cooling_towers, monitoring_sensors, 0.3]

      - [controls, air_distribution, 0.6]
      - [controls, fans_exhaust, 0.6]
      - [controls, process_exhaust, 0.5]
      - [controls, filtration_iaq, 0.3]
      - [controls, acoustics_vibration, 0.1]
      - [controls, heaters, 0.4]
      - [controls, humidification_dehumidification, 0.4]
      - [controls, specialty_cooling, 0.4]
      - [controls, accessories, 0.2]
      - [controls, residential_light_commercial, 0.2]
      - [controls, water_treatment, 0.3]
      - [controls, monitoring_sensors, 0.6]

      - [air_distribution, fans_exhaust, 0.4]
      - [air_distribution, process_exhaust, 0.2]
      - [air_distribution, filtration_iaq, 0.3]
      - [air_distribution, acoustics_vibration, 0.6]
      - [air_distribution, heaters, 0.2]
      - [air_distribution, humidification_dehumidification, 0.1]
      - [air_distribution, specialty_cooling, 0.2]
      - [air_distribution, accessories, 0.5]
      - [air_distribution, residential_light_commercial, 0.2]
      - [air_distribution, monitoring_sensors, 0.2]

      - [fans_exhaust, process_exhaust, 0.3]
      - [fans_exhaust, filtration_iaq, 0.2]
      - [fans_exhaust, acoustics_vibration, 0.4]
      - [fans_exhaust, heaters, 0.1]
      - [fans_exhaust, humidification_dehumidification, 0.1]
      - [fans_exhaust, specialty_cooling, 0.2]
      - [fans_exhaust, accessories, 0.3]
      - [fans_exhaust, residential_light_commercial, 0.2]
      - [fans_exhaust, monitoring_sensors, 0.2]

      - [process_exhaust, filtration_iaq, 0.4]
      - [process_exhaust, acoustics_vibration, 0.3]
      - [process_exhaust, accessories, 0.1]
      - [process_exhaust, monitoring_sensors, 0.3]

      - [filtration_iaq, acoustics_vibration, 0.1]
      - [filtration_iaq, monitoring_sensors, 0.3]

      - [heaters, residential_light_commercial, 0.2]

      - [humidification_dehumidification, specialty_cooling, 0.2]

    # Relevance for a category an account has NO owned coverage in at all
    # (a brand-new account, or one where every line is still "unknown"). Not
    # zero — an empty gap list on day one is useless — but well under most real
    # edges, so a genuinely-connected gap always outranks a guess.
    no_coverage_base: 0.3

    # Below this relevance, a gap is dropped from the ranked list entirely
    # rather than shown at the bottom. This is the literal mechanism behind
    # "the same account has no use for Seresco natatorium units": at 0.0
    # (unlisted pair) or anything under this floor, it does not appear, not
    # just rank low.
    min_relevance_to_show: 0.15

    # Multiplies the category-pair relevance above by how plausible it is that
    # THIS account type buys in that category at all, regardless of what they
    # already own. ESTIMATED judgment calls, not measured — ownership-branch
    # style: a wrong direction here is a small error on every account of that
    # type, so tune it once corrected rather than per-account.
    account_type_modifier:
      default: 1.0
      mechanical_contractor: {default: 1.0}
      service_contractor:
        default: 1.0
        # Service work is parts/controls/retrofit, not new capital equipment —
        # a service contractor occasionally sells a replacement unit, but it is
        # not their primary lane the way it is for a mechanical contractor.
        rooftop_units: 0.6
        air_handling: 0.6
        chillers_cooling: 0.6
        cooling_towers: 0.6
        vrf_split: 0.6
      gc: {default: 1.0}
      owner:
        default: 1.0
        # Owners typically procure large capital equipment through a GC/mech
        # contractor's bid, not this relationship directly, but buy controls,
        # filtration, and service-adjacent upgrades themselves.
        rooftop_units: 0.5
        air_handling: 0.5
        chillers_cooling: 0.5
        cooling_towers: 0.5
      developer: {default: 1.0}
      distributor: {default: 1.0}
      # An engineer specs, they do not buy. Kept at a real (not zero) modifier
      # because a gap on an engineer's account is still worth carrying into a
      # meeting as "what you should be specifying" — just not weighted like a
      # live purchase decision.
      engineer: {default: 0.3}

  # DMG and ToroAire line cards, one row per line name — LG, Yaskawa, Aldes and
  # Neptronic appear on both and get ONE row each (firm: both), not two.
  #
  # category/subcategory/value_tier/equipment_type are first-pass judgment
  # calls, not measured — correct them here and re-run `scout seed-lines`
  # (idempotent, matches app/firms.py's roster pattern exactly). Lines flagged
  # "best-guess" below are genuinely uncertain from general industry knowledge
  # and most need a correction from whoever actually reps them.
  #
  # equipment_type maps a line to one of the 8 keys in
  # replacement.service_life.ownership.*.equipment above — ONLY when it
  # actually is one of those 8 equipment archetypes. Most lines (diffusers,
  # controls, VFDs, filters, fans...) are not, and get equipment_type: null —
  # replacement windows simply are not computed for them, on the same
  # "abstain rather than invent" rule replacement.py already uses for
  # equipment/ownership it has no number for.
  #
  # heat_rejection_mode: evaporative | adiabatic_hybrid | dry_air_cooled |
  # closed_loop | null — relevant to cooling towers/chillers/evaporative
  # lines only, and set ONLY where someone has actually stated the
  # manufacturer carries that capability. This is a MODEL-level fact, never
  # inferred from equipment_type or a brand's general reputation — a cooling
  # tower line is not uniformly "evaporative" (see Marley below). Every entry
  # that has one MUST also set heat_rejection_mode_verified: false and a
  # heat_rejection_mode_basis saying who stated it and when, until it is
  # confirmed with the factory — see app/models.py's ProductLine docstring.
  line_card:
    - {name: "AAON", firm: DMG, category: rooftop_units, subcategory: "packaged rooftop units",
       description: "Packaged/self-contained rooftop units; also custom air handling and chillers",
       value_tier: 1, equipment_type: packaged_rooftop,
       oshpd_osp: true,
       oshpd_osp_basis: "Confirmed directly from HCAI's own OSP application record. HCAI document hcai.ca.gov/document/OSP-0180 (fetched 2026-08-09) is the official HCAI-stamped 'Application for HCAI Special Seismic Certification Preapproval (OSP)' for OSP-0180: Manufacturer AAON, Inc. (2425 S. Yukon Ave, Tulsa, OK); Product Type: Air Conditioning Units - Packaged; Product Model Numbers: RQ, RN-A, RN-B, RN-C; certified via ICC-ES AC156 tri-axial shake-table testing; renewal application approved/signed by HCAI Senior Structural Engineer Timothy Piland on 3/20/2024, reviewed for CBC 2022 code compliance, with the form's own HCAI Approval block stating 'Approval Expires on 03/20/2030.' This is well beyond today's date (2026-08-09), so OSP-0180 is CURRENT. Cross-checked against HCAI's official 'OSP by Category' listing PDF (hcai.ca.gov/wp-content/uploads/2020/10/OSP-List-by-Category-*.pdf, list dated 03/01/2022), which lists under category 9 'Air Conditioning Units - Packaged': OSP-0180: AAON (highlighted/active) and separately OSP-0648: AAON (marked Cancelled). A second AAON number, OSP-0181, appears in the same official list under category 11 'Chillers - Condensers' (also active); full application PDF for OSP-0181 was not pulled so no specific expiry is cited for it, only for the confirmed OSP-0180. Bottom line: AAON holds at least one current, verifiable HCAI OSP preapproval (OSP-0180) covering its RQ and RN-A/B/C packaged rooftop air conditioning unit lines, valid through 3/20/2030, plus a second active OSP-0181 for condensers — AAON's cancelled OSP-0648 (packaged AC) should not be relied on/quoted as current. Retrieved 2026-08-09.",
       ahri_certified: true,
       ahri_certified_basis: "AAON participates in multiple AHRI certification programs relevant to its packaged/rooftop and self-contained product lines: (1) Commercial unitary equipment under AHRI 340/360, and residential unitary AC/coils under AHRI 210/240, per AAON's own support documentation at aaon.com/resources/how-do-i-search-for-an-aaon-products-ahri-certificate, which provides direct pre-filtered search links into the AHRI Directory (ahridirectory.org) for Manufacturer 'AAON'; (2) AAON's water-source heat pump rooftop and self-contained units (RN/RQ, M2, SB, WH/WV series) were announced as certified under the AHRI Water-Source Heat Pumps Certification Program per a 2018 GlobeNewswire press release. Attempted to directly query ahridirectory.org's live search for the AAON participant listing but the site returned HTTP 402 to automated fetch, so this is corroborated via AAON's own directory-search instructions (which name specific AHRI standards/programs, not generic marketing language) plus an AHRI-program-specific press release, rather than a live directory screenshot. Note: AAON's custom/engineered air handling units and chillers are not covered by this certification — AHRI does not certify one-off custom AHU or chiller configurations outside a standard certified model line. Retrieved 2026-08-09.",
       country_of_manufacture: "USA (all manufacturing is domestic — plants in Tulsa, OK; Longview, TX; Memphis, TN; Redmond, OR; and Kansas City/Parkville, MO)",
       country_of_manufacture_basis: "AAON's own corporate site (aaon.com/about) states the company operates over 2 million square feet across five strategically located facilities in the United States: Tulsa, OK (headquarters plus two plants); Longview, TX (AAON Coil Products); Memphis, TN; Redmond, OR; and Kansas City, MO. Corroborated by Wikipedia's AAON entry, which states AAON is headquartered in Tulsa, Oklahoma with manufacturing facilities in Longview, TX, Parkville, MO, and Redmond, OR (Parkville, MO is in the Kansas City metro area). No international manufacturing locations were found in either source. Retrieved 2026-08-09.",
       competes_with: "Daikin Applied, Trane, Carrier, Lennox",
       competes_with_basis: "General industry knowledge. AAON's core category is semi-custom/high-efficiency packaged and self-contained rooftop units — Daikin Applied (Rebel, Maverick lines) is AAON's most frequently cross-bid competitor at the same premium/semi-custom quality tier on commercial and light-industrial RTU projects. Trane (Voyager, Precedent) and Carrier (WeatherMaker, WeatherExpert) are the two largest incumbent commercial unitary lines and routinely appear on the same bid schedules for packaged rooftop replacement/new-construction work. Lennox (Raider, Energence commercial lines) competes in the same mid-to-large commercial unitary segment, often on price-sensitive bids where AAON's semi-custom options are also considered. These four are the names most commonly named alongside AAON in commercial mechanical bid comparisons and trade-press RTU roundups. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, industrial_warehouse, education, hospitality, office],
       markets_basis: "AAON's own site maintains a dedicated 'Industries' section with named vertical pages: Education (aaon.com/industries/education), Healthcare (aaon.com/industries/healthcare), Hospitality (aaon.com/industries/hospitality), Office Buildings (aaon.com/industries/office-buildings), and Manufacturing (aaon.com/industries/manufacturing, explicitly describing 'small-scale workshops to large industrial manufacturing facilities' — mapped to industrial_warehouse). The industries nav also lists 'Data Centers,' which links to basx.com, an AAON-owned company whose site explicitly markets to data center operators (hyperscale, colocation, enterprise) with liquid cooling/CRAH product lines — included as data_center since it is AAON's own corporate marketing, with the caveat that it is served via the BASX subsidiary rather than AAON-branded packaged RTUs directly. No labs or multifamily/apartment industry page or case-study content was found anywhere on aaon.com or basx.com (checked, both 404); excluded as unsupported. Retrieved 2026-08-09."}
    - {name: "DB", firm: DMG, category: chillers_cooling, subcategory: "chillers",
       description: "Chillers — category confirmed correct 2026-08-11; also makes AHUs, which this single-category schema cannot represent as a second entry",
       value_tier: 1, equipment_type: air_cooled_chiller,
       oshpd_osp: null,
       oshpd_osp_basis: "Identified 'DB' as Dunham-Bush (confirmed via DMG's own product page at dmghvac.com/db-chiller/, which states 'DB stands for Dunham Bush' and covers their ACDS Zeus air-cooled scroll chiller, 10-180 RT, plus water-cooled chillers, semi-custom AHUs, and DB-AIRE precision cooling units). Searched HCAI's OSP program directly (hcai.ca.gov/document/osp-list-by-category) and found no readable mention of Dunham or Dunham-Bush. Cross-checked against a third-party mirror of HCAI's own OSP directory (panacheg.com/osp-database) for both relevant chiller subcategories: chillers-water-cooled (12 manufacturers, 29 total preapprovals — Carrier, Daikin Applied, Johnson Controls, Trane, Multistack, Smardt, CLIMACOOL, Haskris, KKT Chillers, Tecogen, Thermo Fisher — no Dunham-Bush) and chillers-air-cooled (14 manufacturers, 20 total preapprovals — Trane, Carrier, Johnson Controls, Daikin Applied, Dimplex, Drake Refrigeration, Advanced Cooling Technologies, Filtrine, Haskris, Johnson Thermal Systems, Multistack — no Dunham-Bush). Additional web searches for Dunham-Bush plus OSHPD/HCAI/eServices returned no OSP number or HCAI directory record. No current HCAI OSP entry could be found for Dunham-Bush chillers in either the air-cooled or water-cooled category. This is absence of evidence, not confirmed rejection/expiration, so recording null rather than false. Retrieved 2026-08-09.",
       ahri_certified: true,
       ahri_certified_basis: "Could not directly query ahridirectory.org (returned HTTP 402, blocking automated access) or ahrinet.org (HTTP 403). As an alternate source, Dunham-Bush's own official press release explicitly names a specific AHRI-administered recognition (not vague 'AHRI rated' marketing prose): 'Dunham-Bush Achieves AHRI 100% Success Rate Performance Certification for Three Consecutive Years (2023-2025),' covering Water-Cooled Chillers, Air-Cooled Chillers, Air Handling Units, Fan Coil Units, and Data Centre Cooling systems. Source: dunham-bush.com. AHRI's 100% Success Rate Performance Certification recognition is only issued to companies actively enrolled as AHRI certification program participants who pass all randomly selected verification tests, so this is stronger evidence than generic marketing language, though the specific chiller models were not independently cross-checked against the live AHRI Directory participant/product listing itself due to the 402 block. Treat as high-confidence but not directly verified against the primary AHRI database. Retrieved 2026-08-09.",
       country_of_manufacture: "Malaysia and China (with a newer USA assembly/manufacturing facility) — multi-country, not a single origin",
       country_of_manufacture_basis: "Dunham-Bush (DB) was founded in the USA in 1894 but relocated its global corporate headquarters to Kajang, Malaysia in 1998, where it operates a manufacturing plant serving Southeast Asia, South Asia, and the Middle East. It also operates an older 20-acre manufacturing plant in Yantai, China (built 1995) serving the Asia market. Per the company's own history/timeline content (dunham-bush.com), Dunham-Bush began constructing a new factory in Homestead/Miami, Florida in 2019 intended to serve North America, Central/South America, Mexico, and the Caribbean; Dunham-Bush USA LLC is now listed at 1800 SE 38th Avenue, Homestead, FL 33035 (dbamericas.com), but neither source explicitly states which specific product lines (e.g. ACDS Zeus scroll chillers, water-cooled chillers, semi-custom AHUs, DB-AIRE units) sold into the US market are built at the Homestead plant versus imported from the Malaysia (Kajang) or China (Yantai) plants — this product-line-to-plant mapping could not be confirmed from public sources. No UK plant is current (Morden/Havant, UK factory from 1935, appears historical/closed per the same timeline). Treat DB equipment as manufactured across a multi-country DB Global network (Malaysia/China primary, with USA production capacity being built out), not a single confirmed country of origin for US-bound units. Retrieved 2026-08-09.",
       competes_with: "Multistack, Aermec, Smardt, Daikin Applied (McQuay)",
       competes_with_basis: "General industry / common sales-team knowledge (not citation-verified against a specific trade article due to search budget exhaustion). Dunham-Bush's chiller line (ACDS Zeus air-cooled scroll, water-cooled screw chillers) is typically positioned as a value/alternate manufacturer rather than a 'big four' incumbent, so it is most often bid head-to-head against other mid-tier and specialty chiller makers rather than against Trane/Carrier/York/JCI generically: Multistack (modular chiller specialist frequently named as an 'or-equal' alternate alongside Dunham-Bush in light-industrial/commercial specs), Aermec (Italian manufacturer with overlapping air-cooled scroll and screw chiller product range and similar mid-tier positioning), Smardt (oil-free magnetic-bearing chillers that compete for efficiency-focused specs where Dunham-Bush's screw chillers are also bid), and Daikin Applied/McQuay (shares screw-compressor chiller heritage that directly overlaps Dunham-Bush's water-cooled screw line). Recommend a rep spot-check this list against current internal win/loss notes since it was not source-verified live. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, industrial_warehouse, education, hospitality, office, multifamily],
       markets_basis: "Dunham-Bush (dunham-bush.com, dbamericas.com), retrieved 2026-08-09. Project showcase site organizes case studies by named category, each with real named projects: Hospital & Medical Centers (Vinmec International Hospital Vietnam, Pantai Hospital Ampang Malaysia, Gleneagles Malaysia, Amiri Hospital Kuwait) -> healthcare; Industries (Tata Steel Plant India, Rapid Pengerang Malaysia petrochemical, KNPC Ahmadi Refinery Kuwait, Bay Park Sewage Plant USA) -> industrial_warehouse; Universities (Thammasat University Thailand, UiTM Malaysia; Iowa State University showcased on dunham-bush.com homepage) -> education; Hotels & Resorts (Hilton Salalah Resort Oman, Sheraton Saudi Arabia, Royal Cliff Beach Resort Thailand) -> hospitality; Office Buildings (Menara Landmark Malaysia, HSBC Bank Place Canada, Corporate Commons Three USA, Assima Tower Kuwait) -> office; Residencies (The Estates at Acqualina USA, Heron Tower Residences UK, Jazz Residences Philippines) -> multifamily. Data center is explicitly named in DB-AIRE In Row product literature: 'Compact slim design of 300/600mm width for data centre/server rack application.' No laboratory/labs-specific case study, industries page, or copy was found on either site, so labs is excluded despite the product category being technically capable of that use. Retrieved 2026-08-09."}
    - {name: "Energy Labs", firm: DMG, category: air_handling, subcategory: "custom air handling units",
       description: "Custom/semi-custom air handling units, DOAS", value_tier: 1, equipment_type: air_handling_unit,
       lead_time_weeks_low: 96, lead_time_weeks_high: 112,
       lead_time_basis: "Stated 2026-08-09: custom AHUs typically do not ship in under roughly two years. No specific order or factory quote behind the number yet — round-number recollection, treat as directional until a live quote confirms it.",
       limitations: "Roughly two-year lead time on a custom AHU (see lead_time above) means this line gets designed around EARLY or not at all — by the time a project reaches procurement, the window to spec Energy Labs has usually already closed.",
       oshpd_osp: true,
       oshpd_osp_basis: "Confirmed directly in HCAI's own OSP directory. HCAI's official 'Special Seismic Certification Preapproval (OSP) by Category' list (hosted at hcai.ca.gov/document/osp-list-by-category/, PDF footer dated 03/01/2022) lists, under Category 9 'Air Conditioning Units' > subcategory 'Air Conditioning Units - Custom' (ACU-CUST): 'OSP-0069: Energy Labs' — shown highlighted/active with no '(Expired after ...)' or '(Cancelled)' annotation, unlike numerous other entries in the same list that are explicitly marked expired or cancelled. Cross-verified against the underlying HCAI-hosted application document itself (https://hcai.ca.gov/wp-content/uploads/2020/12/OSP-0069.pdf): 'APPLICATION FOR OSHPD SPECIAL SEISMIC CERTIFICATION PREAPPROVAL (OSP)', Application # OSP-0069-10, Type: Renewal, Manufacturer: Energy Labs, Inc. (1695 Cactus Rd, San Diego, CA 92154), Product Name/Type: Custom Air Conditioning Units, Product Model Number: 'Various (See Attachment)', Mounting: Rigid Floor Mount, filed 12/12/16 by SEEStudio, Inc. (Dan Junker, SE) with seismic testing per ICC-ES AC156 by Clark Dynamic Test Laboratory. This confirms OSP-0069 belongs to Energy Labs, Inc. and covers custom air handling/air conditioning units. No specific future expiration date or code-cycle is stated in the directory entry itself beyond the absence of an expired/cancelled flag as of the list's 03/01/2022 revision; could not independently confirm whether a newer revision of the directory exists past that date. Coverage is limited to the 'Air Conditioning Units - Custom' category (relevant to Energy Labs' custom AHU/DOAS product line) — Energy Labs was not found listed under other categories (Data Room, Inline Fan/Terminal, Packaged, Split, Air Filters, Fan Coil, Humidification, or Exhaust/Smoke Control Fans) in the same directory. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Energy Labs (a Vertiv company) manufactures fully custom/semi-custom air handling units built to individual customer specification, not a standard catalog product line with fixed model numbers — the category AHRI's whole-unit certification programs generally do not cover. Direct queries against ahridirectory.org failed (server returned 402/blocked to automated fetch), and targeted web searches, including a site:ahridirectory.org search for 'Energy Labs', returned no participant/manufacturer listing for Energy Labs in the AHRI Directory of Certified Product Performance. The company's own marketing (energylabs.vertiv.com) states only that specific energy-recovery components they offer (energy recovery wheels, heat pipes, coil loops, heat exchangers) are 'AHRI listed' — a sub-component claim, not evidence Energy Labs itself is a listed AHRI program participant for its AHU or DOAS unit line. Separately, a Vertiv AHRI marketing page touts an AHRI Datacom 1360 certification, but on inspection that claim applies to the Liebert PDX/DSE product family, not Energy Labs — confirming the general marketing-page claims should not be read as certification of Energy Labs' AHU/DOAS line. Net: not a confirmed AHRI directory listing, and the core product (custom-built AHUs) is unlikely to be a certifiable category in the first place. Retrieved 2026-08-09.",
       country_of_manufacture: "Mexico (Tijuana, Baja California) — company headquarters/contact office listed separately in Westerville, OH, USA",
       country_of_manufacture_basis: "Energy Labs' own official website (energylabs.vertiv.com, a Vertiv brand) lists two locations: 'Headquarters: 505 N Cleveland Ave, Westerville, OH, 43082, USA' (this matches Vertiv's own corporate HQ address, so it functions as the brand's contact/legal address rather than a plant) and 'Manufacturing Plant: Sor Juana Ines de la Cruz 19710, Parque Industrial Frontera, Tijuana, BC, Mexico.' This is consistent with round-1 research on this same line: the HCAI OSP-0069 application PDF listed Energy Labs' manufacturer address as 1695 Cactus Rd, San Diego, CA — directly across the border from Tijuana. Wikipedia's Vertiv article corroborates that Vertiv acquired Energy Labs (air handling systems) in January 2018 but does not itemize the plant location. Could not independently corroborate the Tijuana plant via a second, unaffiliated source (trade press or SEC filing) — search-engine fetches returned blocked/CAPTCHA pages, and could not confirm or rule out whether Energy Labs retains a separate US-based manufacturing site in addition to Tijuana; the current official site names only the one plant, in Mexico. Treat as reasonably reliable (primary source: the manufacturer's own site, corroborated by the San Diego border-adjacent address on the HCAI filing) but not fully cross-verified against a third-party source. Retrieved 2026-08-09.",
       competes_with: "Temtrol, Governair, Annexair, Haakon Industries",
       competes_with_basis: "These are the manufacturers most commonly cross-bid against Energy Labs on custom and semi-custom central-station air handling unit and DOAS projects, per industry-standard vendor comparisons and general mechanical-contracting sales knowledge. Temtrol and Governair (both Nortek Air Solutions brands) are long-established, similarly-positioned custom AHU manufacturers serving the same commercial/institutional project tier. Annexair competes directly on customizable composite-casing central-station units in a comparable capacity range. Haakon Industries is a frequent direct competitor on mission-critical/data-center air handling scopes, which is especially relevant since Energy Labs (as a Vertiv company) is heavily positioned in that same mission-critical segment. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, industrial_warehouse, education, hospitality, labs, office],
       markets_basis: "energylabs.vertiv.com/en-us/market-applications/ explicitly names 'Data Centers', 'Health Centers' (Hospitals/Medical Centers/Laboratories/Pharmaceutical), 'Education' (Universities/colleges/K-12), and 'Industrial' / 'Mfg/Ind. Facilities' as served verticals. The official Vertiv-hosted Energy Labs brochure 'Industries Served' list explicitly lists 'Hospitals and Healthcare', 'Education', 'Research laboratories', 'Pharmaceutical Labs', 'Clean Rooms', 'Manufacturing', 'Office Buildings', and 'Hotels'. Multifamily was excluded: the market-applications page's only residential reference is a generic 'Residential' entry buried in a catch-all 'Others' list alongside military, correctional, and public-works projects, with no case study or copy specifically naming multifamily/apartment housing. Retrieved 2026-08-09."}
    - {name: "LG", firm: both, category: vrf_split, subcategory: "VRF/VRV systems",
       description: "VRF/VRV multi-split systems", value_tier: 2, equipment_type: split_dx,
       markets: [healthcare, industrial_warehouse, education, hospitality, labs, office, multifamily],
       markets_basis: "lghvac.com/commercial/case-studies/ (retrieved 2026-08-13), the official commercial case-study hub of LG Air Conditioning Technologies (LG's US VRF/Multi V business), lists named, dated project profiles by vertical: healthcare — 'Trinity Medical Center'; office — 'WeWork Shared/Collaborative Workspace' and 'Zero Energy America'; hospitality — 'The Marlton Hotel,' 'The Chicago Motor Club,' 'The Sinclair,' and 'Roxbury at Stratton Falls'; multifamily — 'Discovery at The Realm,' 'The Sharpe Building at the Foundry,' 'The Commons at Imperial Hotel,' and 'The Vermont' (Multi-Family Residential); education — 'Smouse Opportunity School,' 'Sprout Space,' and 'Garden Grove Elementary School'; industrial_warehouse — 'Box Office Warehouse Suites' (Warehouse/Industrial, ductless) and 'Euclid Chemical' (Industrial); labs — the 'Euclid Chemical Project Profile' (lghvac.com/commercial/case-studies/project-profile-euclid-chemical/) explicitly describes the LG VRF (Multi V) retrofit serving 'office areas and laboratories' with dedicated makeup air sized to 'laboratory fume hoods.' No page, case study, or copy naming data_center support was found for the VRF/Multi V line specifically — LG's dedicated Data Center Solutions page (lg.com/global/business/hvac/data-center-solutions/) covers only chillers, CDU/cold-plate, and CRAH units, with no VRF/Multi V mention — so data_center is excluded. Retrieved 2026-08-13."}
    - {name: "Marley", firm: DMG, category: cooling_towers, subcategory: "cooling towers",
       description: "Cooling towers (SPX Marley)", value_tier: 1, equipment_type: cooling_tower,
       heat_rejection_mode: adiabatic_hybrid, heat_rejection_mode_verified: false,
       heat_rejection_mode_basis: "Stated 2026-08-09: Marley carries adiabatic and hybrid units (dry most of the year, wet the coil only in peak-heat hours) alongside conventional evaporative towers. Which specific models is not yet confirmed with the factory.",
       markets: [data_center, healthcare, industrial_warehouse, education, multifamily],
       markets_basis: "spxcooling.com (retrieved 2026-08-13). data_center: dedicated page 'Data Center Cooling Systems' (spxcooling.com/applications/data-centers/), promoted from the main Applications menu with brochure 'Marley Data Center Portfolio Brochure' and video 'Evaporative Cooling Towers in the Data Center Process.' healthcare: the site's own Applications landing page (spxcooling.com/applications/) states Marley towers serve 'data center, health care and industrial applications,' backed by a named case study, 'Case Study – University Medical Center Cooling Tower Replacement' (spxcooling.com/library/case-study-university-medical-center-cooling-tower-replacement/), and a named installation video, 'Marley NC Everest Cooling Tower Installation – Adan Hospital' (spxcooling.com/video/). industrial_warehouse: dedicated page 'Industrial Process Cooling' (spxcooling.com/industrial-process-cooling/), plus named case studies 'SGS Industrial Evaporative Condenser Case Study' and 'Fan Efficiency/Performance Case Study' in the site's library. education: named case-study video 'Forward-Thinking School Installs LW Fluid Coolers' describing a Manhattan school rooftop installation (spxcooling.com/video/forward-thinking-school-installs-marley-lw-fluid-coolers-in-manhattan/). multifamily: explicit product copy on the Marley LW Fluid Cooler page (spxcooling.com/evaporative-fluid-coolers/marley-lw-fluid-cooler/) naming 'water-source heat pumps for commercial buildings and multi-unit residential high-rises' as a target application. No dedicated page, named case study, or explicit copy was found on spxcooling.com naming hospitality/hotels, laboratories/labs, or office buildings as served verticals (only generic 'commercial buildings' language, plus a Plaza Hotel project that appears only in third-party MCAA coverage, not on spxcooling.com itself), so hospitality, labs, and office were excluded. Retrieved 2026-08-13."}
    - {name: "BASX", firm: DMG, category: air_handling, subcategory: "mission-critical air handling",
       description: "Custom air handling for mission-critical/data center applications",
       value_tier: 1, equipment_type: air_handling_unit,
       oshpd_osp: false,
       oshpd_osp_basis: "Checked HCAI's live OSP directory table at https://hcai.ca.gov/facilities/building-safety/preapproval-programs/osp/ (full numerical listing of all OSP records embedded in that page) and the companion 'OSP List by Category' PDF (https://hcai.ca.gov/wp-content/uploads/2020/10/OSP-List-by-Category.pdf, revision date 03/01/2022), retrieved 2026-08-09. BASX (doing business as BasX Solutions, LLC — founded Portland, OR 2012, now HQ'd Redmond, OR, acquired by AAON, Inc. in 2021; this is the same company as the custom air handling/data-center manufacturer BASX, basx.com) has exactly one HCAI OSP record: OSP-0373, status 'Expired' (per the by-category PDF, 'Expired after 12/31/2019'), category 'Chillers - Absorption' (a private-labeled absorption chiller built by CLK Corporation/Carrier with BasX branding) — not an air handling product. Searched the full current OSP directory and the by-category PDF specifically under 'Air Conditioning Units - Custom', 'Air Conditioning Units - Data Room', 'Air Conditioning Units - Inline Fans and Terminal', 'Air Conditioning Units - Packaged', 'Air Conditioning Units - Split', 'Air Filters', 'Fan Coil Units', 'Humidification Systems', and 'Exhaust/Smoke Control Fans' — BASX/BasX does not appear in any of these categories. Since BASX has a documented HCAI record that HCAI itself lists as expired (not merely absent), and it covers a different product line (absorption chillers, not the custom air handling units this line is used for), this is recorded as false rather than null: HCAI's own directory shows no current OSP for BASX's air handling product line. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Not an AHRI-certifiable product category. BASX (a wholly-owned subsidiary of AAON, Inc. since Dec. 2021) manufactures custom-engineered air handling and cooling systems for mission-critical/data-center, cleanroom, semiconductor, and pharma applications. AAON's own BASX product page (aaon.com/products/basx) explicitly markets these as built-to-order, contrasting them with 'pre-packaged units': 'Unlike pre-packaged units that can create performance gaps when critical needs are not addressed, BASX Custom Air Handling Units answer the call for customization in your mission-critical applications.' AHRI's Central Station Air-Handling Unit Casing (AHUC) and related programs certify standard, repeatable catalog product lines against AHRI 1350/1351 test methods, not fully custom engineered-to-order equipment. Attempted to query the AHRI Directory (ahridirectory.org) directly for 'BASX'/'BasX Solutions' but the site returned HTTP 402 on automated fetch attempts; web searches and BASX's/AAON's own marketing pages returned no mention of AHRI certification, participation, or ratings for the BASX line. Given the custom/engineered-to-order nature of this product line, this is best classified as not AHRI-certifiable rather than an unconfirmed listing. Retrieved 2026-08-09.",
       country_of_manufacture: "United States",
       country_of_manufacture_basis: "BASX's own 'About/Manufacturing' page (basx.com/about) states its facilities are all U.S.-based: Central Oregon headquarters spanning Redmond, Sisters, and Prineville (design, manufacturing, storage; 558,000 sq ft) plus an R&D site in Bend, Oregon; a Memphis, Tennessee manufacturing facility (787,000 sq ft) that expands thermal equipment production capacity; and a Longview, Texas facility (750,000 sq ft) operated via parent company AAON, Inc. (BASX became an AAON subsidiary in Dec 2021). No non-U.S. manufacturing sites are mentioned on the company site. Based solely on BASX's own website via WebFetch — not cross-checked against AAON's SEC filings or trade press due to search budget exhaustion in this session. Retrieved 2026-08-09.",
       competes_with: "Nortek Air Solutions, Munters, Energy Labs, STULZ",
       competes_with_basis: "All four build custom (not catalog/packaged) air handling units specifically engineered for hyperscale/mission-critical data center cooling, the same niche BASX occupies as an AAON subsidiary, and are commonly cross-bid on the same data center construction projects. Nortek Air Solutions runs a dedicated data center division (nortekdatacenter.com) building custom AHUs for large-scale facilities. Munters supplies custom-engineered CRAHs for hyperscale data centers and markets a 'technology-agnostic' air/liquid/hybrid cooling portfolio. Energy Labs (also a DMG-carried line — see that line_card entry; now part of Vertiv) manufactures high-performance custom air-handling systems explicitly for critical/data-center-grade projects. STULZ offers custom horizontal/vertical indoor AHUs purpose-built for hyperscale data center layouts, distinguishing it from purely packaged CRAC/CRAH vendors. Sourced from each company's own product/market pages rather than a single comparison article. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, labs],
       markets_basis: "basx.com. Data centers: dedicated /data-centers section (liquid coolers, direct evaporative coolers, free cooling chillers, overhead fan coil units, computer room air handlers) plus a named case study, 'BASX Powers Advanced Cooling Innovation for Applied Digital's Purpose-Built AI Data Center Campus' (PR Newswire). Healthcare: dedicated /clean-environments/hospital-or-systems page explicitly targeting General ORs, Hybrid ORs, Cath Labs, Procedure Rooms, and citing ASHRAE 170 healthcare facility guidelines. Labs: /grid-and-plenum-systems page explicitly names Semiconductor Fabrication (Fabs), Biopharmaceutical Manufacturing, Medical Device Assembly, Pharmacies (USP 797/800), Microelectronics, and ISO 5-ISO 8 Cleanrooms as served cleanroom/lab environments. No pages, case studies, or copy found for education, hospitality, office, multifamily, or industrial_warehouse — sitemap and product pages show only Data Centers, Clean Environments, and generic 'Commercial HVAC' product-category language with no named vertical support, excluded per instructions not to guess from product category alone. Retrieved 2026-08-09."}
    - {name: "ClimateCraft", firm: DMG, category: air_handling, subcategory: "custom air handling units",
       description: "Custom air handling units", value_tier: 1, equipment_type: air_handling_unit,
       oshpd_osp: true,
       oshpd_osp_basis: "Confirmed directly against the HCAI-hosted application PDF, not just marketing copy. HCAI OSP-0272 (Application # OSP-0272), manufacturer 'ClimateCraft, Inc.' (518 North Indiana Ave., Oklahoma City, OK), is a RENEWAL application, product name 'Air Handling Units', product type 'Fans', model number 'FanMatrix' — matrix fan tower assemblies (four HSS 3\"x3\"x1/8\" columns with seismic bracing, plus a 'Mini Tower' variant of HSS 2\"x2\"x1/8\" columns), rigid floor-mounted, certified via ICC-ES AC156 testing under CBC 2022. HCAI approval signed 07/18/2023 by Timothy Piland (Senior Structural Engineer), and the form states 'Approval Expires on 07/18/2029' — so as of retrieval date 2026-08-09 this OSP is CURRENT (about 3 more years remaining). Source: https://hcai.ca.gov/wp-content/uploads/2023/07/OSP-0272.pdf (also listed at https://hcai.ca.gov/document/osp-0272/, part of the official OSP directory at https://hcai.ca.gov/facilities/building-safety/preapproval-programs/osp/). Important scope caveat: this OSP specifically covers the FanMatrix fan-tower mounting/seismic-bracing assembly used within ClimateCraft air handling units, not necessarily a blanket preapproval of every custom AHU configuration ClimateCraft builds — sales use should confirm the specific unit configuration matches a FanMatrix-equipped design covered by this OSP. Note this is a renewal of an earlier OSP-0063 (product type Air Conditioning Units - Custom), which per HCAI records expired after 12/31/2019; OSP-0272 supersedes it and is the currently active certification found for this manufacturer. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "ClimateCraft's relevant line is custom-built air handling units (4,000-200,000+ CFM, built to order per project) — AHRI does not operate a certification program for complete custom/semi-custom air handling units as a product line; AHRI's only relevant program touching AHUs is ACHC (AHRI Standard 410), which certifies coil performance for coils used inside field-installed/central-station AHUs, not the assembled custom unit itself. Separately, ClimateCraft's own site (climatecraft.com/products/custom-air-handlers.html) states in a compliance-standards list that it uses 'AHRI certified coils,' but this is unsourced marketing prose, not a citation to AHRI's own directory or program-participant list, so per instructions it cannot be treated as confirmation. Attempted to verify directly against ahridirectory.org and it returned HTTP 402/blocked. Ran multiple targeted web searches and found no page that actually names ClimateCraft in an AHRI participant/directory listing — search-engine summaries asserted membership but could not point to any real URL containing ClimateCraft's name in that context, so this is not considered verified. Net: not confirmed either way — the complete custom AHU product is not an AHRI-certifiable category, and the coil-level certification claim remains unverified against AHRI's own sources. Retrieved 2026-08-09.",
       country_of_manufacture: "United States",
       country_of_manufacture_basis: "ClimateCraft's own website states custom air handling units are built at its Oklahoma City, OK facility: 'Our custom AHUs are made in Oklahoma City, in a manufacturing facility that is designed to produce some of the industry's highest quality, most durable and best performing products' (climatecraft.com/about.html). Company headquarters and the sole manufacturing address found are the same: 1427 NW 3rd St, Oklahoma City, OK 73106. ClimateCraft, Inc. is a subsidiary of Climate Control Group, part of Sweden-based NIBE Group, but no second plant or offshore production site was found on the company's site; only the Oklahoma City facility is referenced as the production location. Retrieved 2026-08-09.",
       competes_with: "Temtrol, Air Enterprises, Energy Labs, Haakon Industries",
       competes_with_basis: "General industry knowledge (standard mechanical-industry/spec-writer knowledge rather than a specific article citation). ClimateCraft is an engineered-to-order, custom central-station air handling unit manufacturer serving healthcare, education, manufacturing, government, and other institutional/demanding-application projects — not a catalog/standard AHU line. Temtrol, Air Enterprises, Energy Labs (also a DMG-carried line — see that line_card entry), and Haakon Industries occupy the same custom/engineered AHU tier and are the manufacturers most commonly named together as basis-of-design or 'or approved equal' alternates on institutional, healthcare, and critical-environment mechanical specs, meaning they are routinely cross-bid against ClimateCraft on the same projects. This distinguishes them from larger catalog/semi-custom AHU brands (Trane, Daikin Applied, Carrier, York) which compete in a different, more standardized product tier and price point. Retrieved 2026-08-09.",
       markets: [healthcare, industrial_warehouse, education, office],
       markets_basis: "ClimateCraft's own site organizes its business around a 'Markets' navigation with dedicated pages: /markets/healthcare.html (case studies: MD Anderson Cancer Center, Vanderbilt University Medical Center, Halifax Health Medical Center — 'Hospitals, clinics and medical laboratories depend on ClimateCraft...'), /markets/education.html (case studies: Community College of Denver, a university student residence tower in Nashville), /markets/manufacturing.html (case studies: IM Flash Technologies flash-drive manufacturing plant, a Rhode Island pharmaceutical manufacturing facility — mapped to industrial_warehouse), /markets/office-retail.html (case study: Republic Center Towers, Dallas — mapped to office). The markets index page confirms exactly six named verticals total: Healthcare, Education, Manufacturing, Office/Retail, Entertainment, Government — Entertainment and Government don't map to any of the 8 allowed taxonomy values so are omitted. Checked and found NOT present as targeted verticals: data_center, hospitality, labs (only a passing mention of 'medical laboratories' within healthcare copy, no dedicated page or case study), multifamily — /markets/data-center.html and /markets/hospitality.html both returned 404. Retrieved 2026-08-09."}
    - {name: "Scott Springfield", firm: DMG, category: air_handling, subcategory: "custom air handling units",
       description: "Custom/semi-custom air handling units", value_tier: 1, equipment_type: air_handling_unit,
       oshpd_osp: false,
       oshpd_osp_basis: "HCAI's own OSP application record for Scott Springfield Mfg. Inc. (OSP-0248-10, Custom Air Conditioning Units / Custom Air Handling Units, rigid floor mounted, SDS up to 1.93g, z/h=1, tested per ICC-ES AC156, certified under CBC 2013) is retrievable at https://hcai.ca.gov/wp-content/uploads/2022/04/OSP-0248.pdf and its own approval block states 'Approval Expires on December 31, 2019.' HCAI's official master directory, 'HCAI Special Seismic Certification Preapproval (OSP) by Category' (https://hcai.ca.gov/document/osp-list-by-category/, document dated 03/01/2022), lists under category 9 'Air Conditioning Units - Custom': 'OSP-0248: Scott Springfield (Expired after 12/31/2019)' — plain text with the red italic expired annotation, not highlighted/underlined like the currently-active entries in the same list (e.g., OSP-0242: Trane, OSP-0243: Johnson Controls, OSP-0301: Haakon, which are shown active). No other OSP entry for Scott Springfield (or any HCAI-recognized parent/brand name) appears anywhere else in the 25-category document, including Air Handling Units, Fan Coil Units, or Air Filters. Also searched HCAI's application search tool (hcai.ca.gov/search/applications) and general web/site searches for renewal terms 2020-2026; no renewal, reapplication, or successor OSP number was found. HCAI's own directory affirmatively shows this preapproval expired after 12/31/2019 with no indication of renewal as of retrieval date 2026-08-09 — this is a directory-confirmed expiration, not mere absence of a hit, so this is recorded as false rather than null. Caveat: the HCAI category-list PDF itself is dated 03/01/2022 (roughly 4.5 years stale relative to today), so it is possible but unconfirmed that a renewal occurred after that date under a new OSP number not yet indexed in searches. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Unconfirmed after reasonable search; product category is plausibly AHRI-certifiable but no evidence of participation found. Scott Springfield (Calgary-based, acquired by Modine in March 2024) manufactures custom/semi-custom central-station air handling units for data center, healthcare, and telecom markets. AHRI does run relevant certification programs for this exact product class — Central Station Air-Handling Unit Supply Fans (AHU), AHRI Standard 430/431, and Central Station Air-Handling Unit Casings (AHUC), AHRI Standard 1350/1351 — so this is not a case of an inherently non-certifiable category. However, ahridirectory.org could not be directly queried — every attempted fetch, including the direct participant-list URLs for both the AHU and AHUC programs, returned HTTP 402. As alternates, checked Scott Springfield's own site (scottspringfield.com/air/), its About page, its ASHRAE GSSM product/service directory listing, and its Flow Tech distributor page — none mention AHRI certification anywhere (only general 'certifications you can trust' and ISO 9001, no AHRI reference). Targeted web searches for Scott Springfield combined with AHRI/AHU/AHUC returned no participant-list hits or press coverage confirming certification (note: Modine's other brand 'Airedale by Modine' announced AHRI certification in April 2024, but that is a separate precision-cooling product line, not Scott Springfield AHUs). Given the inability to access the authoritative directory and the complete absence of any AHRI claim in the manufacturer's own materials, this is recorded as unconfirmed (null) rather than false, since there is no positive evidence of rejection or removal from a program. Retrieved 2026-08-09.",
       country_of_manufacture: "Canada",
       country_of_manufacture_basis: "Company website (scottspringfield.com) About page states the company is 'Based in Calgary and backed by Modine' with footer tagline 'Proudly Canadian'; Contact page lists the sole facility address as Scott Springfield Mfg. Inc., 2234 Portland Street S.E., Calgary, Alberta, Canada T2G 4M6. No evidence found of manufacturing plants outside Canada; Modine (US parent, acquired Scott Springfield March 2024) does not list separate plant locations for this unit on its own site. Retrieved 2026-08-09.",
       competes_with: "Energy Labs, Temtrol, Governair, Haakon Industries",
       competes_with_basis: "General industry knowledge, corroborated by web search: these are the custom/semi-custom central-station air handling unit builders that most consistently show up head-to-head with Scott Springfield on mission-critical specs (data center, healthcare, telecom). Energy Labs (also a DMG-carried line — see that line_card entry; now part of Vertiv) and Scott Springfield are the two names most often cited together as premier custom AHU manufacturers serving data center cooling. Temtrol and Governair (both Nortek Air Solutions brands) compete on the same tier of engineered, drawing-built central station units for institutional/healthcare and mission-critical jobs, similar construction philosophy to Scott Springfield's semi-custom line. Haakon Industries is a similarly regional/mid-size custom AHU builder frequently bid against Scott Springfield on Canadian and North American healthcare and data center projects. These are distinguished from generic large HVAC OEMs (Trane, Carrier, Daikin) whose standard/semi-standard AHU lines are not usually positioned as direct alternatives for the fully custom, engineered-to-order units Scott Springfield builds. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, industrial_warehouse, education, labs],
       markets_basis: "scottspringfield.com homepage lists industry categories Aerospace, Commercial Buildings, Healthcare, Industrial, Institutional, Life Sciences, Mission Critical, with intro copy 'From healthcare and institutional projects to aerospace, mining, oil and gas, and beyond.' /about page timeline states 'Entered the data center market with custom, specialized HVAC solutions' (2020) and 'Strategic focus on custom air handling units for industrial and hospital applications' (2000), plus copy 'Whether it's a hospital, a data center, or an aerospace facility.' /case-studies features 4 named case studies: Arthur J.E. Child Comprehensive Cancer Centre (healthcare), Colorado State University (education/institutional), Gilead Pharmaceutical Retrofit (life sciences/labs), Lockheed Martin Skunk Works (industrial/aerospace). No case study, named category, or explicit copy found for hospitality, office, or multifamily; 'Commercial Buildings' category exists on the homepage but has no descriptive text naming office use, so it was excluded per the no-guessing rule. Retrieved 2026-08-09."}
    - {name: "Thermal Corp", firm: DMG, category: air_handling, subcategory: "coils / heat exchangers",
       description: "Coils and heat exchangers — category confirmed correct 2026-08-11",
       value_tier: 2, equipment_type: null,
       markets: [healthcare, industrial_warehouse, education, hospitality, labs],
       markets_basis: "thermal-corp.com (retrieved 2026-08-13). healthcare: 'Industries, Projects and Clients' page (thermal-corp.com/industries-projects-and-clients) has a dedicated 'Hospitals' heading naming clients including Bellevue Hospital, Methodist Hospital, Long Beach Community Hospital, Pasadena Memorial Hospital, and Southwest Memorial Hospital. industrial_warehouse: same page's 'Industry' heading names manufacturing/industrial clients (Bethlehem Steel Co., General Motors Corp., General Electric Co., ALCOA, Aerojet General Corp.) and the Klean Aire Products page (thermal-corp.com/products/klean-aire-products) explicitly states applications spanning 'laboratory environments to manufacturing plants,' including 'Material machining, grinding, welding or soldering,' 'Chemical Refining,' and 'General warehouse and storage applications.' education: 'Institutions' heading on the same clients page explicitly names Harvard University, Yale University, Texas A&M University, Rice University, and multiple ISD school districts and elementary/middle/high schools. hospitality: 'Entertainment and Recreation' heading names Hilton Hotels, and the 'Commerce' heading separately names Gunter Hotel. labs: Klean Aire Products page explicitly names 'laboratory environments' as a served application, and the clients page's 'Various Others' section names 'USF Organic Lab' as a specific client. No page, case study, or copy found for data_center, office, or multifamily — the 'Commerce' client list (IBM, Citi Bank, Prudential Insurance, Microsoft Corporation) names corporate clients but does not explicitly identify 'office' as a served vertical, and no data-center or multifamily/residential/apartment references were found anywhere on the site — so these three were excluded. Retrieved 2026-08-13."}
    - {name: "VTS", firm: DMG, category: air_handling, subcategory: "AHUs (VENTUS), fan coils, ERV/HRV, unit heaters (VOLCANO)",
       description: "Air handling units, fan coils, ERV/HRV, and unit heaters — corrected 2026-08-11 from an original 'VAV terminal units' miscategorization; no evidence VTS makes VAV terminals",
       value_tier: 3, equipment_type: null,
       oshpd_osp: null,
       oshpd_osp_basis: "Identified 'VTS' as VTS Group / VTS America Inc., a Polish-headquartered (Gdansk) HVAC manufacturer with US operations near Atlanta (SC/NC/GA), represented locally by DMG (dmgn.com/vts redirects to dmghvac.com). CATEGORIZATION FLAG: VTS's actual product line is air handling units (AHU/VENTUS), fan coil units, ERV/HRV units, air curtains, and unit heaters (VOLCANO) — found no evidence VTS manufactures VAV terminal units at all, so this line_card entry's 'VAV terminal units' categorization looks wrong; more plausible categories are Air Conditioning Units - Custom, Fan Coil Units, or Air Handling Units. Checked HCAI's official 'OSP list by category' PDF (hcai.ca.gov/document/osp-list-by-category/, footer-dated 03/01/2022, freshly re-downloaded 2026-08-09) across every relevant category — Air Conditioning Units (Custom, Data Room, Inline Fan and Terminal, Packaged, Split), Fan Coil Units, Air Filters, Humidification Systems, Variable Air Volume Units, and Air Handling Units/Fans — no entry for 'VTS,' 'VTS Group,' 'VTS America,' 'Ventus,' or 'Volcano' anywhere in the document. Also web-searched hcai.ca.gov and the general web for VTS + OSP/OSHPD with no relevant hits. No current HCAI OSP record for VTS was found; recorded as null (absence of evidence, not a rejected/expired record) rather than false. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Could not directly verify via ahridirectory.org — the AHRI Directory blocked automated fetches with HTTP 402 on every attempt. Fallback checks turned up no corroborating evidence: a site-restricted search of ahridirectory.org returned no VTS results; VTS Group's corporate site (vtsgroup.com) and US site (vtsgroup.com/us) contain no mention of AHRI, AHRI standard numbers (430/440/1060), or an AHRI Directory listing anywhere in their AHU/FCU/ERV product pages — they instead cite Eurovent certification (expected, given VTS's Polish/European manufacturing base); a manufacturer-finder aggregator (trs-hvac.com) lists VTS America's air handling units without any AHRI certification claim. The only AHRI-adjacent mention found was a 2023 LinkedIn post by an individual VTS America employee making a vague, unsourced marketing claim of 'AHRI, Eurovent, AMCA, ISO' certified units, with no specific standard, model, or link to AHRI's own directory — not treated as sufficient evidence. Air handling units, fan coil units, and ERV/HRV are plausibly AHRI-certifiable categories (AHRI 430/440/1060), so this is recorded as null (unresolved), not false. Retrieved 2026-08-09.",
       country_of_manufacture: "Poland (primary), with additional VTS Group production/logistics facilities in the United States and United Arab Emirates",
       country_of_manufacture_basis: "VTS Group's own 'About Us' page (vtsgroup.com/about-us/) confirms the company is headquartered in Gdansk, Poland (registered entity VTS Sp. z o.o.), with the legal parent VTS Group S.A. registered in Windhof, Luxembourg per the company's contact page. The same about-us page displays and labels dedicated 'production and logistic center' facilities in Poland, the United States, and Dubai/UAE — indicating VTS manufactures/assembles in more than one country, not solely Poland. Lower-confidence secondary corroboration (Grokipedia, not independently verified against a primary Polish business registry) names 'VTS Plant Sp. z o.o.' as the entity operating VTS's primary Polish manufacturing facility in Gdynia, Poland, producing heating units and air curtains (VOLCANO/WING lines), distinct from the Gdansk administrative HQ. Could not confirm from a primary source which specific product lines (AHUs vs. FCUs vs. ERV/HRV vs. unit heaters) are built at which specific country facility — VTS does not appear to publish a plant-by-product breakdown. Treat Poland as the confirmed primary manufacturing country, with US and UAE noted as secondary production/assembly locations per the company's own site. Retrieved 2026-08-09.",
       competes_with: "Reznor (Nortek Air Solutions), Frico (Systemair), Systemair, Swegon",
       competes_with_basis: "VTS's product line splits across two categories, and the competitor set differs by segment. For the VOLCANO gas/electric unit heaters and destratification fans, Reznor is the dominant US brand contractors default to for gas-fired unit heater bids, and Frico (a Systemair brand) is the closest direct analog — a Northern European manufacturer specializing specifically in destratification fans and unit heaters, the same niche VOLCANO occupies. For the VENTUS air handling unit line, Systemair (parent of Frico and also of Menerga, an AHU/ERV brand) and Swegon are the two Nordic/European AHU manufacturers most often specified against VTS on commercial and industrial air-handling jobs, sharing similar modular-AHU engineering conventions and target markets. Based on general industry knowledge of the AHU and unit-heater manufacturer landscape; no public head-to-head vendor comparison pages were found, so treat the specific pairing as informed inference rather than a sourced citation. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, industrial_warehouse, education, hospitality, labs, office, multifamily],
       markets_basis: "VTS Group (vtsgroup.com), retrieved 2026-08-09. data_center: dedicated product page 'VTS Group Data Center Units - Engineered For Mission-Critical Performance' plus an Oregon data center case study. healthcare: hospital case studies incl. Ahba Private Hospital (Abha), Junín Hospital Peru, and hospitals in Guatemala. labs: dedicated 'VTS Advanced filtration solutions - Hospitals/Laboratories' page explicitly states 'VTS American VENTUS as proven success on Hospitals as well as Laboratories.' industrial_warehouse: Zalando Distribution Center Bydgoszcz, Warehouse Project Kyiv, manufacturing plant case studies. education: University of Florida (x2), Kozminski University Warsaw, Dubai Schools Al Khawaneej, Al-Andalus International School Jeddah, St. Peter's School Calgary. hospitality: Moxy Hotel Warsaw and Kuflonka Restaurant case studies. office: TechnoHub 4 Dubai ('office building') and PKP Office Building Warsaw. multifamily: Binghatti Azure Dubai case study explicitly describes 'a stunning residential complex...Home to more than 550 fully furnished apartments.' Retrieved 2026-08-09."}
    - {name: "ClimaCool", firm: DMG, category: chillers_cooling, subcategory: "modular chillers",
       description: "Modular chillers", value_tier: 1, equipment_type: air_cooled_chiller,
       oshpd_osp: false,
       oshpd_osp_basis: "HCAI's own directory shows ClimaCool Corp held OSP-0048 for Chillers - Water Cooled (source PDF hosted at hcai.ca.gov/document/OSP-0048, form date 12/2/2019), but it is listed as Expired (expired after 12/31/2019) in HCAI's current water-cooled chillers category listing, with no valid-through date — unlike active peer entries (e.g., Trane OSP-0168 valid to 10/10/2028, Daikin OSP-0116 valid to 1/11/2029) which show current expiration dates years out. No renewed or replacement OSP number for ClimaCool was found searching HCAI's site (hcai.ca.gov/facilities/building-safety/preapproval-programs/osp/ and the OSP-list-by-category PDFs) or ClimaCool's own product/technical documents. Conclusion: ClimaCool does not currently hold a current/active HCAI OSP preapproval; its only known record (OSP-0048) is expired. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Could not verify directly. ahridirectory.org and ahrinet.org both blocked automated retrieval (HTTP 402 and 403 respectively) on every attempted search/participant-list URL, so the AHRI Directory itself could not be queried for 'ClimaCool' or 'ClimaCool Corp' as a participant under AHRI 550/590 (Water-Cooled/Air-Cooled Chillers). As a fallback, checked ClimaCool's own site (climacoolcorp.com) — homepage, /products, /downloads (literature index of manuals, brochures, spec sheets, case studies, Revit files) — with no mention of AHRI certification, AHRI 550/590, or any AHRI rating/certificate anywhere. Also ran multiple search engines for ClimaCool + AHRI directory/certified/550/590 combinations and found no relevant snippets, press releases, or third-party confirmation either way. Chillers are a plausibly AHRI-certifiable category, but no evidence of current participation, past participation, or rejection/termination was found — genuinely inconclusive, not a negative finding. Retrieved 2026-08-09.",
       country_of_manufacture: "United States",
       country_of_manufacture_basis: "ClimaCool Corp's own 'About' page (climacoolcorp.com/about) states: 'We design, build and test all our products in a 100,000 square foot manufacturing facility located in Oklahoma City' at 7300 SW 44th St, Oklahoma City, OK 73179 — the same address as company headquarters. ClimaCool is a subsidiary of Climate Control Group (a NIBE company) — the same parent group as ClimateCraft, also Oklahoma City-based. No evidence of additional manufacturing plants outside the US was found on the company's site. Retrieved 2026-08-09.",
       competes_with: "Multistack, AAON, Daikin Applied, Trane (CGAM/Sintesis modular line)",
       competes_with_basis: "ClimaCool sells modular/packaged chillers built around small-footprint, stackable modules for N+1 redundancy and doorway-through retrofit replacements — a specific niche within the broader chiller market. Multistack is the most direct competitor and effectively originated this modular-chiller category (modules sized to fit through doorways/elevators, single-module N+1 redundancy instead of a full duplicate chiller, incremental capacity add-ons); mechanical contractors doing chiller-plant retrofits commonly bid ClimaCool against Multistack head-to-head. AAON (also a DMG-carried line — see that line_card entry) is a frequent mid-market alternative on packaged/modular chiller RFPs in the same contractor channel. Daikin Applied and Trane both offer modular chiller product lines that show up as larger-OEM alternatives when the modular-plant approach is specified but the owner wants a major-brand nameplate. General industry/sales-team knowledge plus Multistack's product positioning verified directly from multistack.com; ClimaCool's own site returned a server error and web search budget was exhausted, so treat as informed general knowledge rather than a citation-backed comparison article. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, education, office, industrial_warehouse, labs],
       markets_basis: "climacoolcorp.com/markets (retrieved 2026-08-09) lists dedicated vertical pages: Data Centers ('compact size... ideal for data centers,' case studies: Northrop Grumman, Univ. of North Dakota, Ansys), Healthcare ('hospitals, clinics and medical laboratories depend on ClimaCool,' case studies: Camp Pendleton Naval Hospital, UNC Health Care, Buck Institute on Aging), Education (Davis School District, UT zero-energy schools case study), Office/Retail (PNC Bank, Chase Towers, Pike Place Market case studies), and Manufacturing (explicit copy: 'Laboratories, research facilities and high tech manufacturing all benefit from...ClimaCool modular chillers,' case studies: Ditch Witch product development center, Battery Innovation Center research facility, TRIUMF Advanced Rare Isotope Laboratory), supporting both industrial_warehouse and labs. A sixth page, Government, has no corresponding value in the taxonomy and was excluded. No hospitality or multifamily market page or explicit copy was found. Retrieved 2026-08-09."}
    - {name: "VU Flow Environmental", firm: DMG, category: air_handling, subcategory: "cleanroom / CO2 air handling",
       description: "Cleanroom and CO2-anchor custom air handling systems",
       value_tier: 1, equipment_type: air_handling_unit,
       limitations: "VU Flow's CO2 simultaneous heating/cooling chiller prices around $8,500/ton against roughly $1,500/ton for a commodity chiller (the two VERIFIED anchors in equipment_value.value_per_ton_by_facility_type, cleanroom vs. light_manufacturing) — a 5.7x spread that must be justified by the tight-tolerance/simultaneous-load case, not led with on price.",
       oshpd_osp: null,
       oshpd_osp_basis: "Searched HCAI's own OSP records directly and found no listing for VU Flow Environmental (or variants 'VuFlow'/'Vu Flow'). Checked: (1) the HCAI OSP directory table at hcai.ca.gov/facilities/building-safety/preapproval-programs/osp/, which lists OSP numbers, manufacturers, categories, and expiration dates alphabetically — the V-section runs directly from multiple Vertiv Corporation entries to VYCON/Vycon with no VU Flow entry in between; (2) the official 'OSP list by category' PDF at hcai.ca.gov/document/osp-list-by-category/ (also cross-checked the underlying file hcai.ca.gov/wp-content/uploads/2020/10/OSP-List-by-Category-8.pdf) — no match found; (3) general web search for 'VU Flow Environmental' + HCAI/OSHPD/seismic — returned no results connecting this manufacturer to any OSP filing. Note: web search also surfaced an unrelated company 'Vu-Flow' (vuflow.com), a water-filtration/irrigation screen-filter manufacturer since 1983 — this is a different entity from the cleanroom/CO2-anchor air handling manufacturer being researched here and should not be conflated. Given no HCAI record was found, this is recorded as null (not false) — a real OSP could exist but not be indexed in the pages/tools checked, and this does not constitute evidence of rejection or expiration. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Searched ahridirectory.org directly (blocked automated access with HTTP 402); no Google cache or mirrored listing found for 'VU Flow' or 'VU Flow Environmental'. Ran general web searches for VU Flow Environmental + AHRI certification/custom air handling/cleanroom air handling units — found no manufacturer website, AHRI press release, program participant listing, or any independent web presence for a company by this name making cleanroom/CO2-anchor air handling equipment (the only similarly-named entity found, 'Vu-Flow', is an unrelated water-filtration/irrigation screen-filter company). Separately, and more fundamentally: the stated product line (custom cleanroom and CO2-anchor air handling systems) is engineered-to-order equipment built to project-specific specs rather than a standard catalog line with fixed model numbers, which is not a category AHRI certifies (AHRI's AHU/CRAHU programs cover only standard, rated central-station air handlers with fixed model designations, not fully custom cleanroom/anchor AHUs). Retrieved 2026-08-09.",
       country_of_manufacture: null,
       country_of_manufacture_basis: "Searched Google, Bing, and DuckDuckGo for 'VU Flow Environmental' alone and combined with 'cleanroom,' 'CO2-anchor,' 'air handling,' and 'manufacturer'; checked for a dedicated company domain (vuflowenvironmental.com — does not resolve); checked LinkedIn company page (404 not found); checked vuflow.com, which turned out to be an unrelated business (Vu-Flow Filters, a water/irrigation filtration company in Brooksville, Florida, unconnected to cleanroom or air handling equipment). No Wikipedia page, trade press coverage, investor page, or company 'about us' page could be found for a manufacturer of this name in the cleanroom/CO2-anchor air handling space — this corroborates the same absence-of-web-presence finding from the OSP and AHRI research on this same line. Retrieved 2026-08-09.",
       competes_with: "Climate by Design International, Engineered Air, Temtrol, IEC (Industrial Environmental Corporation)",
       competes_with_basis: "Could not confirm this company's existence or identity — no web presence found for 'VU Flow Environmental' across OSP, AHRI, country, and this competitors research. This list is therefore NOT a verified competitor set for this specific company; it is a plausible set based on general industry knowledge of who competes in the custom cleanroom / critical-environment air handling niche (100% outside-air units, semiconductor/pharma/healthcare cleanroom service, heat-recovery/simultaneous heating-cooling designs of the type a 'CO2-anchor' system implies). Climate by Design International, Engineered Air, Temtrol, and IEC are all established custom AHU manufacturers with strong reputations in critical/cleanroom applications and heat-recovery configurations, making them the most plausible direct comparators reps would field questions against. Treat this as a category placeholder until the manufacturer's actual identity can be verified. Retrieved 2026-08-09.",
       markets: [],
