       markets_basis: "flowtechsystems.com (retrieved 2026-08-13). healthcare: Success Stories page (flowtechsystems.com/success-stories) names two hospital case studies — 'Utah Critical Care Hospital' (Legionella control) and a 'Swedish Hospital' (Legionella) — both explicitly described as hospital facilities. education: Success Stories page names 'Loyola Law School' (Los Angeles law school, HVAC cooling tower treatment) and a 'University of California' HVAC case study, both explicitly education-sector facilities. multifamily: Success Stories page includes an 'Apartment Complex' case study explicitly described as a residential multifamily building (domestic water treatment). industrial_warehouse: the site's Industries page (flowtechsystems.com/industries) and top nav explicitly list an 'Industrial' market segment, and a named case study 'Searles Valley Minerals Success' (flowtechsystems.com/searles-valley-minerals-success) documents Flow-Tech transmitters installed at a mineral-extraction/borax-production facility, an explicit industrial-plant application. No page, dedicated market segment, or named case study found for data_center, hospitality, labs, or office — the site's Industries page lists only HVAC, Power, Industrial, Refining, Legionella, Residential, Recreational, Agriculture, and Wastewater as named market segments, and site-specific searches for data center, hotel/hospitality, laboratory, and office building content returned no matching pages or case studies, so these four were excluded. Retrieved 2026-08-13."}
