# DMG Scout configuration.
# Everything tunable lives here: jurisdictions, keywords, companies, thresholds,
# sizing assumptions. Never edit Python to add a county.

user_agent: "DMGScout/0.1 (HVAC market research; contact: acrane988@gmail.com)"
request_interval_seconds: 2.0     # per-domain politeness
request_max_retries: 4            # throttles (403/429) and transport errors — waiting helps
request_max_retries_5xx: 2        # 5xx is often deterministic (Legistar 500 = unknown client)
                                  # 404 and other definitive 4xx are never retried

llm:
  triage_model: "claude-haiku-4-5-20251001"
  extract_model: "claude-sonnet-4-6"
  adjudicate_model: "claude-sonnet-4-6"
  outreach_model: "claude-sonnet-4-6"  # see app/pipeline/fathom_outreach.py
  # Sonnet 5, not 4-6: a short, well-scoped extraction task, and Sonnet 5's
  # intro pricing ($2/$10 per MTok through 2026-08-31) runs out the same day
  # this feature's own deadline does -- see app/assumptions.py's entry for
  # this constant and app/pipeline/voice_capture.py's cost-per-capture math.
  voice_capture_model: "claude-sonnet-5"
  # Triage reads the WHOLE document up to this, then falls to a spanning sample.
  # Was 6000, which meant 144 of 204 documents were classified on their first few
  # pages and 86% of all stored text never reached triage at all — an 82,724-char
  # Storey County packet was ruled "no building project" on its first 7%. Relevance
  # is a question about the whole document, so this is deliberately as wide as the
  # extraction budget; Haiku at $1/MTok makes that affordable.
  triage_max_chars: 60000
  triage_head_chars: 8000              # always-included head, when sampling kicks in
  triage_sample_window_chars: 2000     # size of each evenly spaced excerpt
  extract_max_chars: 60000        # ceiling on chars sent to Sonnet per document
  # Section-aware chunking for long docs (EIRs): head + targeted sections.
  section_head_chars: 8000        # always include the document head
  section_max_chars: 15000        # cap per captured section
  # If heading matching fills less than this fraction of extract_max_chars, top the
  # rest up with excerpts spanning the document. The patterns target EIR and SEC
  # headings, so a county agenda packet matched almost nothing and extraction sent
  # 13% of a document triage had read 95% of. Unused budget is a dropped project.
  section_topup_below_fraction: 0.8
  section_topup_window_chars: 2500
  # $/MTok, used for spend logging and backfill estimates. Update if pricing changes.
  prices:
    "claude-haiku-4-5-20251001": {in: 1.0, out: 5.0}
    "claude-sonnet-4-6": {in: 3.0, out: 15.0}
  # Cost-estimate constants, all MEASURED rather than assumed. The estimator ran
  # ~39% low for a whole session on rules of thumb: 4.0 chars/token is an
  # English-prose figure and these are PDF-extracted government filings (dense
  # tables, numbers, addresses), and the prompt overheads ignored that the tool
  # schemas ride along on every call. Overheads come from count_tokens against the
  # live prompts; chars/token and output are fitted over 204 triage and 80 extract
  # calls. Re-measure after any prompt change — `scout backfill --estimate` is only
  # as honest as these.
  #
  # VALIDATED against actuals on 2026-08-06 (`scout validate-estimate --since
  # 2026-08-06T00:00 --until 2026-08-06T03:00 --source ceqanet`), the first time
  # this estimator was ever checked against money actually spent. It was 10.9%
  # low on triage input and 9.2% low on extract input, both in the direction that
  # gets a budget approved and then overrun. See chars_per_token below.
  assumed_triage_pass_rate: 0.39  # FALLBACK ONLY — the estimator now measures the
                                  # real corpus (measured_pass_rate); this applies
                                  # only when fewer than 100 documents are triaged.
                                  # The measured rate on 2026-08-06 was 0.512 over
                                  # 861 documents, so this figure ran a third low.
  chars_per_token: 3.1            # was 3.7, which made every input estimate ~10% low.
                                  # Triage and extract independently imply 3.07 and
                                  # 3.11 from their recorded spend — two stages with
                                  # different system prompts, different tool schemas
                                  # and different text-selection paths landing on one
                                  # number is what makes this a measurement and not a
                                  # fudge. At 3.1 both stages come in under 1%.
                                  #
                                  # CAVEAT, so nobody re-derives it the hard way: an
                                  # unmodelled fixed per-request overhead of ~330
                                  # tokens fits the same two data points equally well,
                                  # and the two hypotheses only diverge on documents
                                  # far from this corpus's ~6,200-char mean. Telling
                                  # them apart needs a count_tokens fit across the
                                  # size range (free endpoint, see the note on
                                  # overheads above) — blocked on 2026-08-06 by an
                                  # exhausted account balance, not by the method.
  triage_prompt_overhead_tokens: 1087    # system + tool schema + scaffold
  extract_prompt_overhead_tokens: 1462   # EXTRACTION_JSON_SCHEMA is most of this
  triage_output_tokens: 95        # measured per document
  extract_output_tokens: 624      # measured; the old 900 overstated it
  adjudicate_cost_per_signal: 0.0034  # resolve was absent from the estimate entirely
  daily_budget_usd: 15.0          # hard kill switch: LLM calls stop past this
                                  # back to 15 on 2026-08-05: the CEQAnet backfill
                                  # week is over (175/182 chunks done) and 40 was
                                  # only ever the temporary ceiling for it
  run_budget_usd: 8.0             # per-run cap, fixed when the run opens and NOT
                                  # reset by midnight. The daily cap alone could
                                  # not stop a long job: the 08-05 resolve crossed
                                  # into 08-06, spent_today() fell back to zero and
                                  # the kill switch silently re-armed at full
                                  # budget. 8.0 is above the largest honest single
                                  # run measured (extract, $6.95) and below the
                                  # daily cap, so it binds first on a runaway.
  budget_warn_fraction: 0.8       # digest + dashboard warning threshold

territories:
  california:
    counties: [Los Angeles, Orange, San Bernardino, Riverside, San Diego, Imperial, Kern]
  nevada:
    counties: [Storey, Washoe, Clark, Lyon, Douglas, Carson City]
  arizona:
    counties: [Maricopa, Pinal]
  baja_california:
    counties: [Tijuana, Mexicali]

keywords:
  # The pre-LLM fetch gate. A row matching NEITHER list is never stored, so a term
  # missing here makes a project invisible to the whole pipeline — this is the
  # narrowest funnel in the system, ahead of triage.
  data_center:
    - data center
    - datacenter
    - data centre
    - hyperscale
    - colocation
    - server farm
    - mission critical facility
    - technology campus
  # Kept SEPARATE from data_center so the two boards stay distinct and either list
  # can be widened without disturbing the other. Deliberately tight: CEQAnet returns
  # every environmental filing in a county, so a loose term like "industrial" alone
  # would pull in road projects, remediation and general-plan updates. Widen from
  # observed misses, not from guesses.
  industrial:
    - warehouse
    - distribution center
    - distribution centre
    - fulfillment center
    - logistics center
    - manufacturing facility
    - manufacturing plant
    - light industrial
    - industrial park
    - business park
    - cold storage
  # A public agency selecting an Energy Services Company for a performance
  # contract. This is a RETROFIT signal, not new construction, and it is on this
  # list because of one asymmetry: unlike an architect or CM award, the ESCO
  # actually selects the equipment. An ESPC award means equipment gets bought in
  # 12 to 24 months and there is a named party who decides what.
  #
  # These appear in the Legistar and CivicPlus agendas already being read — no new
  # source. Deliberately tight: "energy services" alone matches every utility
  # billing item on a consent calendar, so each term either names the instrument
  # (ESPC, guaranteed energy savings) or pairs "energy services" with the
  # contracting language that makes it an award.
  esco:
    - energy services agreement
    - energy services contract
    - energy savings performance contract
    - energy service performance contract
    - espc
    - guaranteed energy savings
    - guaranteed energy cost savings
    - investment grade audit
    - rfq for energy services
    - rfp for energy services
    - request for qualifications for energy services
    - request for proposals for energy services
    - energy services company
    - esco
  supporting:
    - megawatt
    - substation
    - backup generator
    - diesel generator
    - cooling tower
    - chiller

