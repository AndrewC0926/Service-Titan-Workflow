       oshpd_osp_basis: "Searched HCAI's own OSP list-by-category PDF (hcai.ca.gov/document/osp-list-by-category/), HCAI site search, and the third-party Panache Engineering OSP database (panacheg.com/osp-database), which mirrors HCAI/OSHPD OSP records, for the Chillers - Water Cooled and Chillers - Air Cooled categories (relevant to Geoclima's geothermal/water-source heat pump chiller product line). No mention of Geoclima found in HCAI's category PDF, in HCAI site search results, or in either Panache chiller category listing (manufacturers present include Carrier, Trane, Johnson Controls, Daikin Applied, Multistack, KKT Chillers, Smardt, Haskris, Filtrine, Tecogen, Thermo Fisher, CLIMACOOL, Dimplex Thermal Solutions, Johnson Thermal Systems, Drake Refrigeration, Advanced Cooling Technologies — no Geoclima or obvious US-subsidiary/distributor variant). No HCAI-hosted application PDF or OSP number could be located for Geoclima. This is absence of evidence, not confirmation of rejection/expiration, so recording null rather than false. Retrieved 2026-08-09.",
       ahri_certified: true,
       ahri_certified_basis: "Could not directly query ahridirectory.org (returned HTTP 402 Payment Required on fetch). However, Geoclima's own certification page (geoclima.com/certification/) and two dedicated announcement pages provide specific, non-marketing evidence of AHRI program participation: Geoclima earned the AHRI WCCL (Water-Cooled Water-Chilling and Heat Pump Water-Heating Packages) certification mark on 2017-02-27, covering its Turbomiser and V-Range water-cooled chillers, tested by CETIAT (an independent lab under contract to AHRI). It separately earned the AHRI ACCL (Air-Cooled Water-Chilling Package) certification mark on 2017-12-07, covering its air-cooled chiller range including Circlemiser (excluding evaporative/free-cooling series). These name specific AHRI certification programs (WCCL/ACCL, the programs underlying AHRI Standard 550/590 for chillers) with specific dates and named third-party testing, rather than vague 'AHRI compliant' language, so this meets the bar for true — but the current live AHRI directory listing itself was not independently verified due to access blocks. Retrieved 2026-08-09.",
       country_of_manufacture: "Italy",
       country_of_manufacture_basis: "Geoclima's own company/contact page (geoclima.com) lists its address as Via dell'Industria 12, 34077 Ronchi dei Legionari (GO), Italia — a facility in Gorizia province, Friuli-Venezia Giulia, Italy — and describes the firm as designing and building chillers there since 1994. This is the identical street address found for the sister-brand Hecoclima's main plant (see the Hecoclima line_card entry), confirming both brands are built at the same physical Geoclima International facility. Corroborated by Geoclima's LinkedIn company page (identical Ronchi dei Legionari, Gorizia location) and by trade coverage of the October 2024 Munters Group acquisition (Munters press release; DataCenterDynamics), which consistently identify Geoclima as an Italian manufacturer of air- and water-cooled chillers. No evidence found of manufacturing outside Italy. Retrieved 2026-08-09.",
       competes_with: "Multistack, Climaveneta (Mitsubishi Electric Hydronics & IT Cooling Systems), Aermec, Daikin Applied",
       competes_with_basis: "General industry knowledge of the water-cooled/heat-recovery chiller and geothermal water-source heat pump category, cross-checked against Geoclima's own product site (confirms magnetic-bearing/Turbocor-compressor chillers, microchannel condensers, free/evaporative cooling for data center and industrial-scale applications). Multistack is the closest US-market comparison — modular, factory-built heat pump chillers widely specified on geothermal ground-source and heat-recovery plant projects, the same project type DMG/ToroAire would bid Geoclima against. Climaveneta and Aermec are Italian manufacturers (Climaveneta now under Mitsubishi Electric) making a near-identical product range of heat pumps, heat-recovery chillers, and magnetic-bearing units, and are Geoclima's most direct same-origin competitors in Europe with a US presence. Daikin Applied is included for its Pathfinder magnetic-bearing and WSHP/heat-recovery chiller lines, which use comparable compressor technology and target the same large-tonnage commercial/institutional heat-recovery and geothermal jobs. Larger commodity brands (Trane, Carrier, York) were excluded because reps would rarely position Geoclima head-to-head against their standard packaged chiller lines — the closer fight is against these more specialized/modular heat-recovery and WSHP-focused makers. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, industrial_warehouse, education, hospitality, labs, office, multifamily],
       markets_basis: "geoclima.com, retrieved 2026-08-09. data_center: dedicated page 'Geoclima's solutions for data centres' plus named projects (Digital Realty Hong Kong, Colt's Data Center London, Global Connect Data Center Denmark, Dart mega data centre). healthcare: named application category page geoclima.com/pro/hospitals/ plus case studies (Cardinal Massaia Hospital, Hvidovre Hospital, Manchester Hospital, Tor Vergata Polyclinic, Hong Kong Baptist Hospital, University Hospital of Wales). industrial_warehouse: application category pages for pharmaceutical/plastic/car-manufacturing industries and power stations plus industrial case studies (Plastic Forte, Siam Poongsan Metal, Whirlpool India, Evonik). education: multiple named university case studies (Swansea, Ulster, Bath, Cardiff, Southampton, Nottingham). hospitality: named hotel case studies (DoubleTree London, Dorchester Hotel, Lordos Beach Hotel Cyprus). labs: named laboratory case studies (Unison Laboratories Thailand, Vodafone testing lab Newbury). office: geoclima.com/turbomiser-for-residential-application/ describes a building 'home to many apartments, plus offices and shops'; also named office/corporate case studies (Business Center Bellinzona, Ullsteinhaus Berlin, Canary Wharf, International Banking Group). multifamily: same page cites 'many apartments' in the One Commercial Street, London project; also a residential building in Tehran, Iran. Retrieved 2026-08-09."}
