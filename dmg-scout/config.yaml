      - [heaters, residential_light_commercial, 0.2]

      - [humidification_dehumidification, specialty_cooling, 0.2]

    # Relevance for a category an account has NO owned coverage in at all
    # (a brand-new account, or one where every line is still "unknown"). Not
    # zero — an empty gap list on day one is useless — but well under most real
    # edges, so a genuinely-connected gap always outranks a guess.
    no_coverage_base: 0.3

    # Below this relevance, a gap is dropped from the ranked list entirely
    # rather than shown at the bottom. This is the literal mechanism behind
    # "the same account has no use for Seresco natatorium units": at 0.0
    # (unlisted pair) or anything under this floor, it does not appear, not
    # just rank low.
    min_relevance_to_show: 0.15

    # Multiplies the category-pair relevance above by how plausible it is that
    # THIS account type buys in that category at all, regardless of what they
    # already own. ESTIMATED judgment calls, not measured — ownership-branch
    # style: a wrong direction here is a small error on every account of that
    # type, so tune it once corrected rather than per-account.
    account_type_modifier:
      default: 1.0
      mechanical_contractor: {default: 1.0}
      service_contractor:
        default: 1.0
        # Service work is parts/controls/retrofit, not new capital equipment —
        # a service contractor occasionally sells a replacement unit, but it is
        # not their primary lane the way it is for a mechanical contractor.
        rooftop_units: 0.6
        air_handling: 0.6
        chillers_cooling: 0.6
        cooling_towers: 0.6
        vrf_split: 0.6
      gc: {default: 1.0}
      owner:
        default: 1.0
        # Owners typically procure large capital equipment through a GC/mech
        # contractor's bid, not this relationship directly, but buy controls,
        # filtration, and service-adjacent upgrades themselves.
        rooftop_units: 0.5
        air_handling: 0.5
        chillers_cooling: 0.5
        cooling_towers: 0.5
      developer: {default: 1.0}
      distributor: {default: 1.0}
      # An engineer specs, they do not buy. Kept at a real (not zero) modifier
      # because a gap on an engineer's account is still worth carrying into a
      # meeting as "what you should be specifying" — just not weighted like a
      # live purchase decision.
      engineer: {default: 0.3}

