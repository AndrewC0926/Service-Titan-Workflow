sources:
  ceqanet:
    enabled: true
    base_url: "https://ceqanet.lci.ca.gov"
    counties: [Los Angeles, Orange, San Bernardino, Riverside, San Diego, Imperial, Kern]
    # Document-type allowlist, using CEQAnet's real 3-letter codes (NOP, EIR,
    # MND, NEG, NOD, NOE, ...). Empty = accept every type.
    #
    # Deliberately empty: over a 12-month live sample of all 7 counties, 8 of
    # the 10 data-center filings were NOE (Notice of Exemption) — including two
    # city data-center moratoria and a county IT-department contract. The old
    # NOP/EIR/NEG/MND/NOD allowlist would have discarded those 8. The keyword
    # filter already cuts 10,651 rows to ~10, so an allowlist buys nothing and
    # costs real signal. Restrict only if a type turns out to be pure noise.
    document_types: []
    fetch_detail: true   # pull the detail page for keyword-matched rows
    lookback_days: 30
  edgar:
    enabled: true
    base_url: "https://efts.sec.gov/LATEST/search-index"
    # 90, not 14, and the reason is the source's cadence rather than its quality.
    #
    # A daily fetch on a 14-day window returned ONE document on 2026-08-07, which
    # looks exactly like a broken adapter. It is not: measured over the same
    # 28-query plan on the same day, 14 days yielded 16 page-0 hits and 2 filings
    # past the issuer gate, while 90 days yielded 105 and 10. Data centre ABS and
    # CMBS deals are episodic — three or four relevant filings a month across the
    # whole issuer list — so a fortnight is simply below the resolution of the
    # thing being measured.
    #
    # The fix is deliberately NOT a broader query. Precision here comes from
    # issuer_patterns, not from search terms, and loosening that is what produced
    # the first backfill's 3,016 rows averaging 202 characters of chip-company
    # risk-factor boilerplate (see app/sources/edgar.py). Widening the window
    # keeps every existing filter and just looks at enough time for the filings
    # to exist. Re-seeing a filing is free: documents dedupe on (source,
    # source_uid), so a 90-day window that overlaps yesterday's stores nothing new.
    lookback_days: 90
    max_pages: 3              # full-text pages are 10 hits each, per query
    max_body_chars: 400000    # filing text stored; app/sections.py chunks it for the LLM
    min_body_chars: 2000      # below this, verify-sources reports FAIL (stub detection)
    min_doc_chars: 2000       # floor used by `scout doc-stats`; the old rows averaged 202
    #
    # Purpose is narrow: data center ABS/CMBS deal documents that name campuses,
    # tenants, MW and delivery dates, plus filings by named developers. The old
    # config ('"data center" "Nevada"' over 10-K/10-Q) produced 3,016 rows of chip
    # and software companies whose risk factors mention data centers.
    #
    # Deal-document forms: where campus/tenant/MW terms actually appear.
    # ABS-15G and ABS-EE are the securitization filings; 424B* are the
    # prospectuses; 10-D are the ongoing servicer reports.
    forms: ["ABS-15G", "ABS-EE", "424B2", "424B3", "424B5", "10-D"]
    # Forms where a *named developer* announces a project. Kept separate so 8-K
    # does not drag in every crypto miner that says "data center".
    developer_forms: ["8-K", "S-1", "S-4", "424B5"]
    # Phrases that essentially only data center deal documents use.
    deal_phrases:
      - "data center revenue notes"
      - "stabilized data center"
      - "critical IT load"
      - "megawatts of critical"
    # Known data center ABS issuers, queried across deal + developer forms.
    issuer_queries:
      - "Vantage Data Centers"
      - "Aligned Data Centers"
      - "Switch, Ltd."
      - "STACK Infrastructure"
      - "CyrusOne"
      - "Compass Datacenters"
      - "DataBank Holdings"
      - "Cologix"
      - "Flexential"
      - "Sabey Data Center"
      - "Phoenix Data Center Acquisitions"
      - "TierPoint"
    #
    # THE PRECISION GATE. A hit is kept only if the *filer's* display name matches
    # one of these. Verified on a 468-hit live sample: 93 kept, 375 dropped. This
    # is what separates "Vantage Data Centers Holdings, LLC files an ABS-15G"
    # (keep) from "JPMORGAN CHASE & CO files a 424B2 that mentions STACK" (drop),
    # and it is why the query terms themselves can stay simple. Filers dropped by
    # this gate in testing: Applied Digital, TeraWulf, Core Scientific, Riot,
    # CleanSpark, Galaxy Digital, BBCMS mortgage trusts, Csquare, WEC Energy.
    issuer_patterns:
      - "data center"
      - "datacenter"
      - "data centre"
      - "vantage data"
      - "retained vantage"
      - "aligned data"
      - "adc holdco"
      - "stack infrastructure"
      - "cyrusone"
      - "compass datacenter"
      - "databank"
      - "cologix"
      - "flexential"
      - "sabey"
      - "tierpoint"
      - "switch, ltd"
      - "edgecore"
      - "novva"
      - "powerhouse data"
      - "prime data"
      # REITs/trusts that own and acquire campuses (their 8-Ks name sites and MW),
      # as distinct from funds that merely hold the ABS notes. Named explicitly —
      # a bare "digital infrastructure" also matched "BlockchAIn Digital
      # Infrastructure, Inc.", a crypto shell with no campuses.
      - "blue owl digital infrastructure"
      - "blackstone digital infrastructure"
      - "stratcap digital infrastructure"
      - "digital realty"
      - "equinix"
  goed:
    enabled: true
    base_url: "https://goed.nv.gov"
    notices_path: "/notices-agendas/"
    # NRS 360.754 qualification thresholds, used to infer minimum size:
    thresholds:
      ten_year: {employees: 10, capex_usd: 25000000}
      twenty_year: {employees: 50, capex_usd: 100000000}
  pucn:
    enabled: true
    # The DATA subdomain, not puc.nv.gov (which blocks all crawling in
    # robots.txt) — see app/sources/pucn.py's module docstring.
    base_url: "https://pucweb1.state.nv.us"
    index_path: "/PUC2/Dktinfo.aspx"
    lookback_days: 180
    min_doc_chars: 60   # the docket listing line IS the document; see adapter docstring
  legistar:
    enabled: true
    api_base: "https://webapi.legistar.com/v1"
    # Every slug below was verified live against webapi.legistar.com — each one
    # returns 200 and real body names. Slugs are NOT derivable from the city
    # name, so do not guess: add a candidate, run `scout verify-sources --only
    # legistar`, and keep it only if it reports ok. A 500 carrying
    # "LegistarConnectionString setting is not set up" means the slug does not
    # exist.
    clients:
      - {client: "fontana", label: "City of Fontana, CA"}
      - {client: "sanbernardino", label: "San Bernardino County, CA"}
      - {client: "riversidecountyca", label: "Riverside County, CA"}       # was "rivco"
      - {client: "lacounty", label: "County of Los Angeles, CA"}           # has Plans and Zoning Committee
      - {client: "clark", label: "Clark County, NV"}                       # was "clarkcountynv"
      - {client: "washoe-nv", label: "Washoe County, NV"}                  # was "washoe"
    lookback_days: 21
    # REMOVED — these jurisdictions are not Legistar tenants at all (verified:
    # no slug variant resolves on webapi.legistar.com, and each publishes
    # agendas on a different platform). Leaving them here as dead slugs is what
    # produced ten HTTP 500s per run. Each needs its own adapter to recover:
    #
    #   City of Ontario, CA        Granicus ViewPublisher  ontarioca.granicus.com
    #   Rancho Cucamonga, CA       Granicus ViewPublisher  ranchocucamonga.granicus.com
    #   Moreno Valley, CA          eScribe                 pub-morenovalley.escribemeetings.com
    #   City of El Segundo, CA     Granicus ViewPublisher  elsegundo.granicus.com
    #   City of Reno, NV           PrimeGov                reno.primegov.com
    #   City of Sparks, NV         Granicus ViewPublisher  sparks.granicus.com
    #   Storey County, NV          CivicPlus AgendaCenter  storeycounty.org/AgendaCenter
    #
    # NEVADA COVERAGE GAP: Legistar now covers only Clark and Washoe counties.
    # Storey County (Tahoe Reno Industrial Center) is the highest-value Nevada
    # jurisdiction and is CivicPlus-only, and Nevada has no CEQA equivalent —
    # so until a CivicPlus/PrimeGov adapter exists, Storey/Reno/Sparks local
    # signal comes only from GOED plus the northern-Nevada RSS feeds below.
    # Las Vegas, Henderson, and North Las Vegas were also probed: not Legistar.
  # CivicPlus AgendaCenter — jurisdictions with no Legistar and no CEQA equivalent.
  # Storey County IS the Tahoe Reno Industrial Center (Vantage, Tract, Google,
  # Switch) and was the largest blind spot in the system.
  civicplus:
    enabled: true
    lookback_days: 60
    # Packets run to 268 pages / 16 MB; the agenda item list is up front, so
    # parse the head and keyword-screen that. Raise only if items are being missed.
    max_pdf_pages: 40
    document_kinds: ["Agenda"]   # add "Minutes" to also pull decisions (doubles downloads)
    jurisdictions:
      - name: "Storey County, NV"
        base_url: "https://storeycounty.org"
        county: "Storey"
        state: "NV"
        # Category IDs come from the AgendaCenter page (`id="cat<N>"`), NOT from
        # the CID query params, which belong to unrelated CivicPlus modules.
        categories:
          - {id: 4, label: "Planning Commission"}
          - {id: 2, label: "Board of Commissioners"}
          # NOT category 8 ("Notices of Possible Quorum"): verified that all 14 of
          # its 2026 documents are one-page scans with no text layer (0 chars, 2
          # images), so they produced nothing but warnings. They are procedural
          # quorum notices with no project content. Every Agenda in categories 2
          # and 4 parses cleanly. tesseract is present on the box if these ever
          # become worth OCRing.
  # PrimeGov public portal — City of Reno.
  #
  # DISABLED, and not for a technical reason: reno.primegov.com/robots.txt is
  # "User-agent: * / Disallow: /" — the entire host is off-limits. The adapter is
  # written and its endpoints are verified (the meeting list and HTML agendas both
  # work when fetched by hand), but PoliteClient correctly refuses the requests and
  # we do not work around robots. Enabling this flag will just produce
  # RobotsDisallowed on every request.
  #
  # If Reno coverage is needed, it has to come from a route that permits crawling:
  # reno.gov's own public-records search, a Google Alerts RSS feed added to
  # sources.rss, or a direct records request. Northern Nevada trade press is
  # already covered by the EDAWN / This Is Reno / NNBW feeds below.
  primegov:
    enabled: false
    lookback_days: 60
    jurisdictions:
      - name: "City of Reno, NV"
        base_url: "https://reno.primegov.com"
        county: "Washoe"
        state: "NV"
        # Substring match on the meeting title; empty list = every committee.
        committees: ["Planning Commission", "City Council", "Redevelopment"]
  rss:
    enabled: true
    feeds:
      - {name: "Data Center Dynamics", url: "https://www.datacenterdynamics.com/rss/"}
      - {name: "Data Center Frontier", url: "https://www.datacenterfrontier.com/rss.xml"}
      - {name: "Nevada Current", url: "https://nevadacurrent.com/feed/"}
      - {name: "The Nevada Independent", url: "https://thenevadaindependent.com/feed"}
      - {name: "Northern Nevada Business Weekly", url: "https://www.nnbusinessview.com/feed/"}
      - {name: "inewsource", url: "https://inewsource.org/feed/"}
      - {name: "CalMatters", url: "https://calmatters.org/feed/"}
      # Nevada fallback coverage (GOED contingency — see RUNBOOK):
      - {name: "EDAWN", url: "https://edawn.org/feed/"}
      - {name: "This Is Reno", url: "https://thisisreno.com/feed/"}
      # Add Google Alerts RSS URLs here.
  ats:
    enabled: true
    # boards resolved from companies section above (greenhouse/lever/ashby keys)
    geo_terms: [Ontario, Rancho Cucamonga, Fontana, Moreno Valley, Riverside, San Bernardino,
                El Segundo, Los Angeles, Orange County, San Diego, Irvine, Reno, Sparks,
                Storey, Washoe, Las Vegas, Clark County, Henderson, North Las Vegas, Phoenix, Mesa]
  air_permits:
    enabled: false   # Tier 2: PDF-heavy; enable after Tier 1 proves out
  utility_filings:
    enabled: false   # Tier 2
  faa_7460:
    enabled: false   # Tier 2
  water_districts:
    enabled: false   # Tier 2
  manual:
    enabled: true

# County-level forward-MW layer imported by hand from utility CEC IEPR
# filings — see app/pipeline/iepr.py. Not a fetched source: no adapter, no
# lookback, no schedule. `scout import-iepr` is the entire feed.
iepr:
  # Comparing SCE's 2024 and 2025 IEPR filings, ~44% of tracked
  # interconnection requests did not survive unchanged year over year
  # (canceled, or otherwise dropped). An interconnection request is not a
  # project — this discount is applied wherever this layer feeds a score
  # (Phase 4 county-adjacency spillover, app/pipeline/scoring.py), never
  # baked into the import itself, so the raw filed MW stays inspectable.
  churn_discount: 0.44

sizing:
  tons_per_mw_it: 284            # 1 MW IT: W*3.412 BTU/hr / 12000
  tons_per_mw_installed_low: 300 # installed incl. non-IT heat + N+1
  tons_per_mw_installed_high: 400
  tons_per_mw_installed_default: 325
  # Band half-width around the midpoint, per estimate basis. The uncertainty of
  # the estimate comes from HOW we know the size, not a fixed ratio:
  band_by_basis:
    stated_it: 0.10             # a filing states IT MW — tightest
    permitted_capacity: 0.15    # a stated total/site MW figure CORROBORATED by a
                                 # stated generator split (critical and/or house) —
                                 # see permitted_capacity_to_it_mw_divisor below
    gensets_critical: 0.15      # a generator split stated with NO total/site
                                 # capacity to corroborate it against — the
                                 # critical fleet becomes the estimate directly
    stated_total: 0.18          # total/utility MW with no generator data at all —
                                 # IT share inferred, no corroboration available
    gensets: 0.28               # MW reverse-engineered from an UNDIFFERENTIATED
                                 # generator fleet (no critical/house split stated)
    sqft: 0.45                  # square footage only — widest, flagged low-confidence
  hp_to_kw: 0.7457
  genset_mw_to_it_mw_divisor: 1.4
  # PUE-based: IT load = total facility power / PUE. Used ONLY when a stated
  # total/site MW figure is accompanied by generator data (critical/house split
  # or a flat count) — see app/pipeline/sizing.permitted_capacity_to_it_mw for
  # the reason that combination gets different treatment than a bare mw_total:
  # a filing that also describes its backup generator fleet is very often a
  # power-plant-type filing (CEC SPPE and similar), where the stated MW is
  # frequently a REGULATORY CEILING the project engineered to stay under, not
  # a measured or designed load. Vernon: filed at 99 MW, one below the CEC's
  # 100 MW Small Power Plant Exemption threshold above which a much slower,
  # more expensive certification applies — and its 40-generator fleet averages
  # 2.6 MW/unit against that permit, visible sparing a permit-ceiling number
  # would otherwise hide. 1.3 is a reasonable default PUE; tune it if you have
  # a better site-specific figure.
  permitted_capacity_to_it_mw_divisor: 1.3
  # Critical-dedicated backup fleet nameplate, as an UPPER BOUND on IT load when
  # corroborating a permitted_capacity estimate (never exceed what the backup
  # fleet could physically supply) and as the estimate itself in the rarer case
  # where no total/site capacity is stated to corroborate it against. 1.0 means
  # "trust the nameplate sum as a ceiling" — it does NOT attempt to back out
  # N+1/N+2 sparing, because the filing essentially never states the redundancy
  # configuration and guessing one would be exactly the kind of invented
  # precision this system exists to avoid. See
  # app/pipeline/sizing.critical_genset_mw_to_it_mw — and do not read a low
  # number here as "sparing corrected for"; it is not.
  critical_genset_mw_to_it_mw_divisor: 1.0
  watts_per_sqft: 150            # used only when sqft is the only size input; low confidence
  sqft_utilization: 0.5          # fraction of building sqft assumed to be white space
  # Industrial buildings are sized from floor area, not IT watts — their load is
  # envelope + ventilation + process, not servers. Square feet per ton by what the
  # building actually does; extraction reports `facility_type` and sizing branches
  # on it. These are Andrew's numbers, not defaults — the spread across types is
  # 50x, so type matters more than area.
  #
  # NOTE on `unknown`: spans every type above, because that is what not knowing
  # actually means. A 100,000 sqft building of unstated type is 40-2,000 tons, and
  # saying so is more useful than a confident middle. Narrow it if you would rather
  # assume light manufacturing.
  industrial_sqft_per_ton_by_type:
    distribution_fulfillment: {low: 1000, high: 2500}
    warehouse_conditioned:    {low: 800,  high: 1500}
    light_manufacturing:      {low: 300,  high: 600}
    heavy_manufacturing:      {low: 100,  high: 300}   # with process load
    cleanroom:                {low: 50,   high: 150}
    office_rnd:               {low: 300,  high: 400}
    # NOTE: there is deliberately no `unknown` row. An unstated type produces no
    # tonnage at all — see _industrial_from_sqft. The 50-2,500 full span that used
    # to live here turned "we do not know what this building is" into
    # "3,240 to 162,000 tons", which reads as a measurement and is not one.
  # Ceiling on watts-per-sqft implied by a STATED MW figure. Above this the stated
  # number is treated as a misread (a product rating, an annual output, a utility
  # service size) and discarded rather than trusted — see the Amperesand case in
  # sizing.implausible_watts_per_sqft. A "stated" value otherwise outranks every
  # low-confidence guard, which is how 500 MW on 73,000 sqft became 136,964 tons.
  max_watts_per_sqft_by_category:
    data_center: 500     # generous: dense white space runs 150-300 W/sqft
    industrial: 60       # manufacturing process load, well above typical
    other: 60

# What a ton of cooling is WORTH, which is not what a ton of cooling IS.
#
# From the field: a custom air handler or a central chiller plant is worth far
# more than the same tonnage spread across terminal units, so ranking on tonnage
# alone systematically over-values large low-intensity boxes. A 5,000 ton
# fulfillment centre on packaged rooftops is a smaller opportunity than a 600 ton
# cleanroom on custom AHUs.
#
# TWO POINTS ON THIS TABLE ARE REAL, from DMG's VP of sales. Everything else is
# interpolated between them and is an estimate. The `source` field on each row
# says which is which, and nothing should be quoted in dollars without checking it.
#
#   VERIFIED  VU Flow CO2 simultaneous heating/cooling chiller, 100-ton modules:
#             ~$850,000 per 100 tons = ~$8,500/ton. Premium specialty, top of the
#             line card.
#   VERIFIED  2 x 60-ton LG heat-or-cool chillers: ~$180,000 for 120 tons =
#             ~$1,500/ton. Commodity, bottom of the line card.
#
# Those two anchor both the magnitude and the spread: 8,500 / 1,500 = 5.7x between
# premium specialty and commodity on this exact line card. The table's endpoints
# are set to the anchors and the middle rows are interpolated by what each
# facility type actually buys, so the ratio across the board reproduces the
# measured 5.7x rather than a guessed one.
#
# Caveat worth keeping in view: both anchors are chiller equipment prices, so rows
# whose dominant equipment is packaged rooftop rather than chillers (distribution,
# warehouse) are extrapolated slightly below the commodity chiller anchor and are
# the least certain in the table.
equipment_value:
  enabled: true
  # $ per installed ton, by the equipment a building of this type actually buys.
  value_per_ton_by_facility_type:
    cleanroom:                {low: 6000, high: 8500, equipment: "custom AHU + specialty chiller, tight-tolerance control", source: "high end = VU Flow CO2 anchor, $8,500/ton (VERIFIED)"}
    data_center:              {low: 3500, high: 6000, equipment: "central chiller plant, CRAH", source: "estimated between anchors"}
    heavy_manufacturing:      {low: 2500, high: 4500, equipment: "process cooling, custom AHU", source: "estimated between anchors"}
    office_rnd:               {low: 1800, high: 3000, equipment: "AHU plus terminal units", source: "estimated between anchors"}
    light_manufacturing:      {low: 1500, high: 2500, equipment: "packaged AHU, some process load", source: "low end = LG commodity chiller anchor, $1,500/ton (VERIFIED)"}
    warehouse_conditioned:    {low: 1200, high: 1800, equipment: "packaged rooftop", source: "estimated, extrapolated below the commodity chiller anchor"}
    distribution_fulfillment: {low: 900,  high: 1500, equipment: "packaged rooftop, spread thin", source: "estimated, extrapolated below the commodity chiller anchor"}
    # No `unknown` row on purpose, same reasoning as the sizing table: without a
    # type there is no equipment category, so there is no value to state.

# ---------------------------------------------------------------------------
# SERVICE LIFE — when equipment is due for replacement.
#
# For the replacement module (charter product B). Nothing consumes this yet; it
# is here so the constants are settled, sourced and reviewable before the
# ingestion that will use them exists.
#
# **ASHRAE SERVICE LIFE CANNOT BE APPLIED UNIFORMLY**, and that is the whole
# reason this table is branched rather than a single number per equipment type.
# The mechanisms are genuinely different:
#
#   private commercial — RUN TO FAILURE. Equipment is replaced when it dies or
#     when repair stops being economic, which is why a service agreement is worth
#     having and why ASHRAE's median service life is the right predictor.
#
#   federal and government-owned — PLANNED REPLACEMENT on a 7-10 year cycle.
#     There is little to no service agreement business, so equipment is programmed
#     out rather than nursed along. A federal rooftop at year 8 is a live
#     candidate; a commercial one is not until year 15.
#
# Getting this wrong is not a small error in one direction — it is a wrong ANSWER
# on roughly half a decade of a building's life. A federal portfolio scored on
# ASHRAE numbers would show nothing due until year 15, by which time the job was
# bought, installed and warrantied years earlier.
#
# `source` on every row says where the figure came from and must be carried onto
# anything quoted, exactly as with equipment_value above.
replacement:
  service_life:
    # Used when a building's ownership cannot be determined. Deliberately the
    # LONGEST cycle: guessing short would put buildings on a call list years
    # before anyone is buying, and a rep who is early twice stops trusting the
    # list. Better to miss a federal building than to invent a live one.
    default_ownership: private_commercial

    ownership:
      private_commercial:
        basis: "ASHRAE median service life (run-to-failure replacement)"
        source: "ASHRAE Applications Handbook service life estimates"
        verified: false   # not yet checked against a published edition — see note
        equipment:
          packaged_rooftop:      {low: 15, high: 17}
          split_dx:              {low: 15, high: 17}
          air_cooled_chiller:    {low: 18, high: 20}
          water_cooled_chiller:  {low: 23, high: 25}
          air_handling_unit:     {low: 25, high: 30}
          boiler:                {low: 22, high: 25}
          cooling_tower:         {low: 18, high: 20}
          vav_terminal:          {low: 18, high: 20}

      federal:
        # NOT ASHRAE. Stated by a contractor in a customer conversation on
        # 2026-08-07: federal and government-owned buildings replace on a planned
        # 7-10 year cycle because there is little to no service agreement
        # business, so replacement is programmed rather than run-to-failure.
        # One source, one conversation, not yet corroborated against a published
        # federal facility standard — treat it as a field report, which is what
        # it is, and re-verify before anything is quoted off it.
        basis: "planned replacement cycle, not condition-based"
        source: "CONTRACTOR field report 2026-08-07 — not ASHRAE, single source"
        verified: false
        equipment:
          packaged_rooftop:      {low: 7,  high: 10}
          split_dx:              {low: 7,  high: 10}
          air_cooled_chiller:    {low: 7,  high: 10}
          water_cooled_chiller:  {low: 10, high: 15}
          air_handling_unit:     {low: 10, high: 15}
          boiler:                {low: 10, high: 15}
          cooling_tower:         {low: 7,  high: 10}
          vav_terminal:          {low: 10, high: 15}

      state_municipal:
        # The contractor's report covered FEDERAL specifically. State and
        # municipal owners sit between the two mechanisms — some run programmed
        # capital replacement, many run to failure on a tighter budget than
        # private commercial — and NOBODY HAS GIVEN US A NUMBER FOR THEM.
        #
        # The band below is interpolated between the other two rows. It is a
        # placeholder with a name, not a measurement, and it is marked so nobody
        # quotes it. The right fix is to ask the same contractor, not to reason
        # about it harder.
        basis: "interpolated between federal and private commercial"
        source: "ESTIMATED — no source, not stated by the contractor, not ASHRAE"
        verified: false
        equipment:
          packaged_rooftop:      {low: 12, high: 15}
          split_dx:              {low: 12, high: 15}
          air_cooled_chiller:    {low: 15, high: 18}
          water_cooled_chiller:  {low: 18, high: 22}
          air_handling_unit:     {low: 18, high: 25}
          boiler:                {low: 18, high: 22}
          cooling_tower:         {low: 15, high: 18}
          vav_terminal:          {low: 15, high: 18}

scoring:
  window_multipliers:
    PRE_BOD: 1.0
    IN_BOD: 0.7
    POST_BOD: 0.15
    OPERATING: 0.05
  recency_halflife_days: 180     # no new signal in 180d ~ halves score
  corroboration_bonus: 0.25      # added certainty per extra independent signal type (capped)
  corroboration_cap: 2           # max extra types counted
  min_digest_score: 0.15
  # Multiplier by count of {name, developer, county} a project is missing (see
  # identity_factor() in app/pipeline/scoring.py). Steep on purpose: a row
  # missing two of the three is not a call-list entry, it is a placeholder, and
  # no amount of certainty/window/size should be able to buy it back into the
  # top of a short board. Missing zero is untouched (1.0).
  identity_penalty:
    1: 0.7
    2: 0.25
    3: 0.1
  # Certainty priors by signal type (0-1)
  signal_certainty:
    utility_load_request: 0.25
    land_transfer: 0.45
    abatement_application: 0.75
    ceqa_nop: 0.75
    planning_agenda: 0.55
    job_posting: 0.45
    air_permit_atc: 0.9
    water_will_serve: 0.7
    ceqa_deir: 0.75
    engineer_move: 0.8
    faa_7460: 0.9
    abs_issuance: 0.8
    news_report: 0.4
    prequal_invite: 1.0
    bid_invite: 1.0
    manual_tip: 0.7
  # Days from stage to estimated mechanical bid (midpoints of lead-time windows)
  days_to_bid_by_stage:
    concept: 900
    entitlement: 540
    design: 360
    permitting: 270
    procurement: 60
    construction: 0
    operating: -1

resolution:
  block_radius_km: 5
  auto_merge_threshold: 0.88     # >= auto-merge
  review_threshold: 0.55         # >= goes to LLM adjudication, then review queue if uncertain
  # aliases seeded here; learned aliases are stored in DB
  developer_aliases:
    "Vantage Data Centers": ["Vantage Data Centers NV11, LLC", "Vantage Data Centers NV1", "Tech Core PY"]
    "Switch": ["Switch Ltd", "Switch, Inc."]

digest:
  enabled: true
  to: ["acrane988@gmail.com"]
  # Resend's own testing sender — no domain to verify, no DNS. Its one limit is
  # exactly what this needs: it can only send to the email address on the
  # Resend account itself, and `to` above is that same address. Upgrade to a
  # verified custom domain later only if deliverability becomes a problem
  # (SPF/DKIM on a sandbox sender is not as strong) or a second recipient is
  # ever added. scout@dmgscout.local was never real and could not have sent.
  from_addr: "onboarding@resend.dev"
  subject_prefix: "[DMG Scout]"
  # resend | smtp | console
  transport: "resend"
  # How far out a next_action_date counts as "due" rather than silence.
  due_soon_days: 3
  smtp: {host: "", port: 587, username: "", password_env: "SMTP_PASSWORD"}
  resend: {api_key_env: "RESEND_API_KEY"}

dashboard:
  basic_auth_username: "andrew"
  basic_auth_password_env: "DASHBOARD_PASSWORD"

# =============================================================================
# ACCOUNTS — line-card coverage for the ~100 dormant accounts, gap ranking, and
# replacement forcing. Three questions per account: what they have (coverage,
# entered by hand — no import exists yet), what they should have (adjacency
# scoring below, against the line card), and what is forcing them to buy
# (install year against replacement.service_life above — no new table, the
# same ownership-branched one Phase B already settled).
# =============================================================================
accounts:
  # Typical single-PO dollar range for one tier of equipment, used to rank
  # coverage gaps by estimated dollar VALUE rather than by row count — a
  # missing custom air handler (tier 1) must outrank twenty missing diffusers
  # (tier 4) even though the diffusers are twenty rows on the gap list. This is
  # the fix a Trane portfolio leader named directly: rank on unit value.
  #
  # ESTIMATED from typical DMG/ToroAire deal sizes — nobody has measured actual
  # invoice history against these tiers yet. If a ranked gap list looks wrong,
  # correct these bands (or a line's value_tier below) before touching the
  # adjacency weights; they are the more likely place to be off.
  value_tier_dollars:
    1: {low: 75000, high: 500000,
        source: "ESTIMATED: custom AHUs, chillers, cooling towers, large RTU/DOAS packages"}
    2: {low: 20000, high: 75000,
        source: "ESTIMATED: VRF systems, WSHP, mid-size RTUs, industrial fans/blowers"}
    3: {low: 5000, high: 20000,
        source: "ESTIMATED: VFDs, controls packages, VAV terminals, sound attenuators"}
    4: {low: 1000, high: 5000,
        source: "ESTIMATED: diffusers/grilles as a package, filters, small heaters, louvers"}
    5: {low: 200, high: 1000,
        source: "ESTIMATED: small accessories, individual components"}

  # Category-to-category affinity: "an account that already owns category A is
  # this relevant a fit for category B", 0-1. Declarative and sparse — an
  # unlisted pair defaults to 0 (no fit), which is the point: it is how a
  # rooftop-only account never sees Seresco natatorium units or Monoxivent fume
  # exhaust in its gap list, without a keyword or an LLM call deciding that at
  # run time. Symmetric — code applies each edge both directions — so add a
  # pair once. Not inference: every number here is a first-pass judgment call
  # by category, meant to be corrected in place by whoever actually reps these
  # lines, not re-derived.
  #
  # Two categories exist specifically because one adjacency example demanded
  # it: `fans_exhaust` (general commercial/industrial fans — a rooftop unit
  # project plausibly needs these too) is split from `process_exhaust` (lab,
  # fume, vehicle/welding exhaust — Strobic Air, Monoxivent — a specialized
  # vertical a generic rooftop account has no use for). Collapsing them into one
  # "fans" category would have made Monoxivent look like a fit for every
  # rooftop account, which is exactly the wrong answer the category split
  # exists to prevent.
  adjacency:
    categories:
      - rooftop_units            # packaged RTUs, self-contained units
      - air_handling              # custom/semi-custom AHUs, DOAS, ERV, cleanroom air handling
      - vrf_split                 # VRF/VRV, ductless, WSHP, PTAC/PTHP
      - chillers_cooling          # chillers, modular chillers
      - cooling_towers            # cooling towers, closed-circuit coolers, heat rejection
      - controls                  # BAS controllers/actuators, VFDs, control dampers, zoning
      - air_distribution          # diffusers, grilles, registers, VAV terminals, louvers, fabric duct
      - fans_exhaust              # general commercial/industrial fans, blowers, roof/wall exhausters
      - process_exhaust           # lab/fume exhaust, vehicle/welding fume extraction
      - filtration_iaq            # filters, UV disinfection, ionization, electronic air cleaners
      - acoustics_vibration       # sound attenuators, vibration isolation
      - heaters                   # unit heaters, duct heaters, make-up air heaters
      - humidification_dehumidification  # humidifiers, pool dehumidification, heat-pipe dehumidification
      - specialty_cooling         # evaporative cooling, HVLS fans, chilled beams/radiant
      - accessories               # access doors, louvers, curbs, air curtains
      - residential_light_commercial     # bath fans, range hoods, residential ventilation
      - water_treatment           # HVAC water treatment
      - monitoring_sensors        # airflow measurement, sensors

    edges:
      - [rooftop_units, air_handling, 0.2]
      - [rooftop_units, vrf_split, 0.2]
      - [rooftop_units, chillers_cooling, 0.1]
