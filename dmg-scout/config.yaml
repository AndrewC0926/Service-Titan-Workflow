    - {name: "Young Regulator", firm: ToroAire, category: controls, subcategory: "pressure regulators",
       description: "Pressure-independent dampers, pressure regulators", value_tier: 3, equipment_type: null,
       oshpd_osp: null,
       oshpd_osp_basis: "Checked HCAI's official 'OSP List by Category' PDF (hcai.ca.gov/document/osp-list-by-category/) by downloading it and searching the full text. 'Young Regulator' does not appear anywhere in the document. The only similarly-named hit is 'YoungTouchtone' (OSP-0129, expired 2016; OSP-0130, current) under the Remote Radiators sub-category of Emergency and Standby Power Systems — a different company (Wabtec-owned, makes charge-air-cooler/radiator equipment for generators), not Young Regulator Company (pressure-independent dampers/regulators). Also confirmed the HCAI OSP program's top-level categories (Emergency/Standby Power, Elevator Equipment, Hazardous Content Components, Exhaust/Smoke Control Fans, Switchgear/Switchboards, Motor Control Centers, imaging equipment, Air Conditioning Units, Air Handling Units, Chillers, Cooling Towers) contain no category for standalone dampers, pressure regulators, or pressure-independent control valves/dampers — the closest adjacent category is Variable Air Volume Units under Air Conditioning Units, which covers complete VAV terminal boxes, not standalone balancing/control dampers or PICVs of the type Young Regulator manufactures. Web search for 'Young Regulator' + OSHPD/HCAI/seismic returned no directory or eServices records, only the company's own marketing/distributor pages. Given no OSP product category plausibly exists for this product type, and no listing was found in HCAI's own directory, this is set to null rather than false — there is no basis to conclude HCAI reviewed and rejected a Young Regulator application, only that no such certification/category is evident. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Not applicable. Young Regulator's relevant product line (manual, motorized, and remote balancing dampers; constant-volume regulators; pressure-relief/IAQ dampers) falls under duct airflow control hardware, which is not a category covered by any AHRI certification program — AHRI's programs address unitary AC/heat pumps, chillers, air handlers with coils, VRF, fan coils, ERV/HRV, PTAC, and similar refrigerant/air-conditioning equipment, not balancing dampers or duct pressure regulators (these are more typically AMCA-rated for airflow, not AHRI-certified). Direct attempts to fetch AHRI's certification-programs page were blocked (HTTP 403/402), so this is based on the well-established, unchanged scope of AHRI's published certification programs rather than a fresh page read. Separately, a direct check of Young Regulator's own website (youngregulator.com, including its /products page) found no mention of AHRI certification or AHRI compliance anywhere in their marketing or product documentation. Given both the category mismatch and the absence of any AHRI claim by the manufacturer, ahri_certified is set to null (not applicable) rather than false, since 'false' would incorrectly imply this is a category where certification could have been sought but was not obtained. Retrieved 2026-08-09.",
       country_of_manufacture: "United States",
       country_of_manufacture_basis: "Young Regulator's own website (youngregulator.com/about) lists its address as 7100 Krick Rd., Walton Hills, OH 44146, with the company's product/manufacturing operations (balancing dampers, EBD electronic balancing dampers, etc.) run from that Ohio site. Corroborated by third-party industrial directory Metoree, which states Young Regulator, founded in 1930 and located in Walton Hills, Ohio, is a manufacturer of control systems, dampers, and temperature regulators. No evidence found of overseas manufacturing facilities; all located sources point to a single Walton Hills, Ohio (Cleveland-area) plant. Retrieved 2026-08-09.",
       competes_with: "Ruskin, Titus, Nailor Industries, Air Balance Inc. (ABI)",
       competes_with_basis: "Young Regulator's own product catalog confirms its core lines are manual/motorized/remote balancing dampers, iris dampers, VAV dampers, and CVR (Constant Volume Regulator) pressure-relief devices — the HVAC testing-and-balancing (TAB) damper niche. Ruskin and Titus (also a DMG-carried line — see that line_card entry; both under Air Distribution Technologies) are the most commonly specified general damper/louver alternatives in mechanical specs; Nailor Industries (also a DMG-carried line) competes on VAV/CAV terminal dampers; Air Balance Inc. (ABI) is the closest direct analog, focusing specifically on iris dampers and constant-volume regulator devices for remote/inaccessible-location balancing, the same niche Young Regulator's CVR and Electronic Balancing Damper (EBD) products target. General industry knowledge from the HVAC balancing/damper market, not corroborated with third-party comparison sources due to search budget exhaustion. Retrieved 2026-08-09.",
       markets: [],
       markets_basis: "Checked youngregulator.com homepage, /about, /resources, /resources/literature-and-marketing-materials, /products, and /products/constant-volume-devices (retrieved 2026-08-09). Site has no markets/industries/verticals page, no named case studies, and no explicit vertical-targeted copy — content is organized purely by product category (dampers, louvers, control valves, Bowden controls) and addressed generically to 'contractors and engineers.' No support found for any of the 8 candidate markets."}
