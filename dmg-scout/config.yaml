    - {name: "PEP Filters", firm: DMG, category: water_treatment, subcategory: "cooling tower / condenser water filtration",
       description: "Water-side cooling tower and condenser water filtration (disc, media, screen, centrifugal separators) — corrected 2026-08-11 from an original 'commercial air filters' miscategorization; not an air-side MERV product",
       value_tier: 4, equipment_type: null,
       oshpd_osp: null,
       oshpd_osp_basis: "Searched HCAI's own OSP records, not just marketing claims. Reviewed the full official 'HCAI Special Seismic Certification Preapproval (OSP) by Category' PDF (hcai.ca.gov/document/osp-list-by-category/) page by page, including the complete 'Air Filters' subcategory under Air Conditioning Units (Category 9), which lists only six holders: OSP-0269 Dynamic, OSP-0307 Genesis Air, OSP-0490 American Green Technologies, OSP-0558 Global Plasma Solutions, OSP-0607 Johnson Controls, and OSP-0627 Price Industries Ltd. Also checked adjacent HVAC-relevant categories that could plausibly cover a filter product line — Air Conditioning Units (Custom/Data Room/Inline Fan and Terminal/Packaged/Split), Fan Coil Units, Humidification Systems, Variable Air Volume Units, Air Handling Units/Fans, and Exhaust/Smoke Control Fans — none contain any entry for 'PEP' or 'PEP Filters'. Also ran targeted web searches and found no HCAI-hosted OSP application PDF or eServices/directory record for PEP Filters under any name variant. No current OSP number found, and no record of an expired/rejected HCAI certification for this manufacturer either — so this is a true absence-of-evidence case, not a documented non-certification. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Not applicable — AHRI does not operate a certification program for this product category. CATEGORIZATION FLAG: checked pepfilters.com directly and found PEP Filters is actually a water-side/cooling-tower filtration manufacturer (media filters, disc filters, screen filters, centrifugal separators, bag filters for cooling-tower, chiller, and process-water applications), not a maker of air-side MERV/ASHRAE 52.2-rated commercial air filters as this line_card entry's 'commercial air filters' description implies. No mention of AHRI certification, rating, or claim appears anywhere on their site. AHRI's known certification programs (unitary AC/heat pumps, chillers, air handlers with coils, VRF, fan coils, ERV/HRV, PTAC, grilles/registers/diffusers, etc.) do not include either air filtration media/equipment or cooling-tower/process water-side filtration equipment — neither the assumed product category nor PEP Filters' actual one is AHRI-certifiable. Combined with the absence of any AHRI claim in PEP Filters' own marketing, ahri_certified is set to null/not-applicable rather than false, since this is a category mismatch, not a failed or absent certification. Retrieved 2026-08-09.",
       country_of_manufacture: null,
       country_of_manufacture_basis: "Could not confirm actual factory/production location. Confirmed only: PEP Filters, Inc. is headquartered at 120-J Talbert Road, Mooresville, NC, USA (pepfilters.com homepage and /contact/; also stated as the governing jurisdiction in PEP's own Website Terms of Use PDF). No page on pepfilters.com discloses a factory, plant, or 'made in' location. LinkedIn lists the company at only ~4 employees, consistent with a small engineering/sales/assembly operation rather than an owner-operated factory. Two circumstantial leads point toward Israel but neither is a direct statement of manufacturing location: (1) PEP's own product line 'Spin Klin (TM) Disc Filters' uses the 'Spin Klin' trademark, which is owned by Amiad Water Systems Ltd. (Israel), a global water-filtration manufacturer with plants in Israel and additional operations reported in the US/UK/elsewhere; (2) the embedded document-properties metadata of PEP's own Website Terms of Use PDF lists the authoring organization in Hebrew as Amiad Water Systems Ltd., suggesting some corporate, legal, or supply affiliation between PEP Filters and Amiad. No independent source (press, corporate filings, Amiad's own site) confirms a parent/subsidiary relationship or states where PEP-branded equipment is actually fabricated. Given no source directly states a country of manufacture, this field is set to null rather than guessed. Retrieved 2026-08-09.",
       competes_with: "LAKOS (Claude Laval Corp), Amiad Water Systems, Nalco Water/Ecolab (UltraSand), Everfilt",
       competes_with_basis: "PEP Filters' own product line (confirmed via its distributor page, maddockindustries.com/brands/pep-filters) is media filters (down to ~5 micron, cooling-tower focused), disc filters (20-400 micron), and screen filters (10-1,500 micron) for cooling-tower and commercial HVAC process water. The most-cited direct competitors making the same category of sidestream/condenser-water filtration equipment (disc, media, screen, or centrifugal-separator technology) for cooling towers are: LAKOS (Claude Laval Corp), the dominant name in HVAC sidestream centrifugal separators and media filtration; Amiad Water Systems, which manufactures the same three technology types (disc, screen, media filters) for industrial/cooling water — NOTE: this is the same company flagged as a possible corporate/trademark affiliate of PEP Filters in the country-of-manufacture research above (Spin Klin trademark, PDF metadata), so treat this as a competitor listing with an unresolved possible-affiliation caveat, not a clean independent rival; Nalco Water (Ecolab), which sells UltraSand high-efficiency sand filters marketed specifically for industrial side-stream cooling-tower filtration; and Everfilt, whose CTS-series cooling-tower filters compete in the same 5-micron sidestream niche. Identified via direct fetches of manufacturer/distributor sites, not a general web search. Retrieved 2026-08-09.",
       markets: [data_center],
       markets_basis: "pepfilters.com homepage and pepfilters.com/markets/ list five named market verticals: 'HVAC / Data Centers', Petrochemical and Power, Oil and Gas, Municipal, and Aquaculture. A dedicated page at pepfilters.com/markets/hvac-data-centers/ (retrieved 2026-08-09) explicitly targets data centers with content on side-stream cooling, heat exchanger protection, and make-up water filtration for HVAC/data center comfort cooling systems. No content on the site explicitly named healthcare, industrial_warehouse, education, hospitality, labs, office, or multifamily as target markets. Retrieved 2026-08-09."}
