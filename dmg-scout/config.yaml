# DMG Scout configuration.
# Everything tunable lives here: jurisdictions, keywords, companies, thresholds,
# sizing assumptions. Never edit Python to add a county.

user_agent: "DMGScout/0.1 (HVAC market research; contact: acrane988@gmail.com)"
request_interval_seconds: 2.0     # per-domain politeness
request_max_retries: 4

llm:
  triage_model: "claude-haiku-4-5-20251001"
  extract_model: "claude-sonnet-4-6"
  adjudicate_model: "claude-sonnet-4-6"
  triage_max_chars: 6000          # chars of document text sent to triage
  extract_max_chars: 60000        # ceiling on chars sent to Sonnet per document
  # Section-aware chunking for long docs (EIRs): head + targeted sections.
  section_head_chars: 8000        # always include the document head
  section_max_chars: 15000        # cap per captured section
  # $/MTok, used for spend logging and backfill estimates. Update if pricing changes.
  prices:
    "claude-haiku-4-5-20251001": {in: 1.0, out: 5.0}
    "claude-sonnet-4-6": {in: 3.0, out: 15.0}
  assumed_triage_pass_rate: 0.3   # for cost estimates only
  daily_budget_usd: 15.0          # hard kill switch: LLM calls stop past this
  budget_warn_fraction: 0.8       # digest + dashboard warning threshold

territories:
  california:
    counties: [Los Angeles, Orange, San Bernardino, Riverside, San Diego, Imperial, Kern]
  nevada:
    counties: [Storey, Washoe, Clark, Lyon, Douglas, Carson City]
  arizona:
    counties: [Maricopa, Pinal]
  baja_california:
    counties: [Tijuana, Mexicali]

keywords:
  # Any of these marks a document as worth triaging.
  data_center:
    - data center
    - datacenter
    - data centre
    - hyperscale
    - colocation
    - server farm
    - mission critical facility
    - technology campus
  supporting:
    - megawatt
    - substation
    - backup generator
    - diesel generator
    - cooling tower
    - chiller

