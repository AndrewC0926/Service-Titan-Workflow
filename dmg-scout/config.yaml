    - {name: "Hecoclima", firm: DMG, category: chillers_cooling, subcategory: "chillers / fan coils",
       description: "Chillers/fan coils — category confirmed correct 2026-08-11; same Italian plant as Geoclima",
       value_tier: 2, equipment_type: null,
       oshpd_osp: null,
       oshpd_osp_basis: "Searched HCAI's own OSP resources (hcai.ca.gov/facilities/building-safety/preapproval-programs/osp/, the official OSP-list-by-category PDF at hcai.ca.gov/document/osp-list-by-category/, and HCAI site/eServices search) plus general web search for 'Hecoclima' combined with OSHPD/HCAI/OSP — no listing, OSP number, or application PDF for Hecoclima was found. Cross-checked the third-party HCAI-OSP mirror at panacheg.com/osp-database, manually reviewing manufacturer lists in the Chillers - Air Cooled, Chillers - Water Cooled, and Fan Coil Units categories (the categories most relevant to Hecoclima's product line); Hecoclima does not appear in any of them. No evidence of a rejected or expired HCAI record for Hecoclima was found either — this is a genuine absence of evidence, not a confirmed non-certification, so the field is set to null rather than false. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "ahridirectory.org returned HTTP 402 on every direct fetch attempt, so the directory itself could not be queried for 'Hecoclima'. Searched Hecoclima's own site (hecoclima.com/en/, including /profile/, /quality/, /comfort-cooling/, /categories/chiller-en/) — no mention of AHRI anywhere; the Quality page cites only ISO 9001, PED 2014/68/EU, and the Machinery Directive 2006/42/EC, not AHRI. Web search for 'Hecoclima'+'AHRI' combined returned zero results. Notably, Hecoclima's own site states it 'is a brand belonging to Geoclima International Srl,' and Geoclima International's own site documents real, verifiable AHRI WCCL (water-cooled chiller) and air-cooled chiller certification for its 'Geoclima'-branded G-Range/V-Range products (see this same batch's Geoclima line_card entry), corroborated by third-party press. However, that certification is listed under the 'Geoclima' brand/participant name, not 'Hecoclima', and geoclima.com/certification/ makes no mention of Hecoclima at all — so it cannot be confirmed that AHRI's directory lists Hecoclima itself as a participant or that Hecoclima's specific model lines are the certified ones. Given the directory could not be directly checked and no Hecoclima-branded AHRI citation was found, this is treated as unverified/null rather than true — reps should confirm with Hecoclima/Geoclima directly whether the AHRI certification held by parent company Geoclima International extends to the specific Hecoclima-branded models being quoted. Retrieved 2026-08-09.",
       country_of_manufacture: "Italy",
       country_of_manufacture_basis: "Hecoclima's own company page (hecoclima.com) lists two Italian facilities explicitly labeled as manufacturing plants: 'SEDE LEGALE E STABILIMENTO PRINCIPALE' (registered office and main plant) at Via dell'Industria 12, 34077 Ronchi dei Legionari (GO), Italy, and a second 'STABILIMENTO' (plant) at Via Valdarno 45, 06024 Gubbio (PG), Italy. Corroborated by Geoclima International S.r.l.'s corporate site (geoclima.com), which lists the same Ronchi dei Legionari (GO), Italy address as its headquarters. Hecoclima operates under Geoclima International Srl Unipersonale. No non-Italian production facilities were found for the Hecoclima brand. Retrieved 2026-08-09.",
       competes_with: "RC Group, MTA S.p.A., Aermec, Clivet",
       competes_with_basis: "All four are Italian manufacturers of air- and water-cooled chillers and fan coils covering the same comfort-cooling plus process/industrial-cooling range Hecoclima serves (industry, commercial buildings, hospitals, data centers), and are the brands most often cross-shopped against Geoclima/Hecoclima product lines by mechanical contractors specifying European-style semi-custom chillers with natural-refrigerant (e.g., propane/R290) options rather than mainstream US big-name chillers. RC Group and MTA were specifically identified as closely related industry players to Geoclima in available web sources; Aermec and Clivet are added from general industry knowledge as the other major Italian chiller/fan-coil manufacturers competing in the same custom/semi-custom capacity segment (also see the same competitor set found for the sister-brand Geoclima line_card entry, which named a partly overlapping list). Findings rely on WebFetch of Hecoclima's own site plus general industry knowledge of the Italian chiller/fan-coil manufacturing landscape. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, industrial_warehouse, education, office, multifamily],
       markets_basis: "hecoclima.com (retrieved 2026-08-09). Homepage: 'Siamo in grado di fornire un'ampia gamma di soluzioni per ogni tipo di applicazione: industria, edifici commerciali, centrali elettriche, ospedali e data center' (industry, commercial buildings, power plants, hospitals, data centers) — supports data_center, healthcare, industrial_warehouse. Comfort Cooling page: 'Si trova negli edifici residenziali, negli uffici, nei cinema e negli ospedali' (residential buildings, offices, cinemas, hospitals) — supports multifamily and office. Process Cooling page reinforces data_center and industrial_warehouse. Projects page includes named case studies: Monash University, Australia (largest multi-split installation in the world) supporting education; Thyssenkrupp and Silvano Chiapparoli Logistica (logistics/warehouse) supporting industrial_warehouse; multiple office case studies (Palazzo Mercurio Chiasso, Colt Rome office, RTL 102.5 HQ) supporting office. A Thailand case study describes a GMP pharmaceutical manufacturing cleanroom, not a lab/R&D facility, so labs was excluded; no hotel/resort/hospitality content was found on any page, so hospitality was excluded. Retrieved 2026-08-09."}
