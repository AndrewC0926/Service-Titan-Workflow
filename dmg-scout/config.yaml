    - {name: "Islandaire", firm: DMG, category: vrf_split, subcategory: "PTAC/PTHP",
       description: "Packaged terminal air conditioners/heat pumps", value_tier: 3, equipment_type: split_dx,
       oshpd_osp: null,
       oshpd_osp_basis: "Searched HCAI's official OSP list by category PDF (hcai.ca.gov/document/osp-list-by-category/, downloaded and text-extracted directly; entries run through OSP-0732) across all relevant categories — Air Conditioning Units (Custom, Data Room, Inline Fans and Terminal, Packaged, Split) and Fan Coil Units. No entry for 'Islandaire' or its historical parent/co-brand 'Fedders' appears anywhere in the document (full-text case-insensitive search for 'island' returned zero hits). Also ran web searches combining 'Islandaire' with HCAI/OSHPD/OSP/eServices terms and a site:hcai.ca.gov search; no genuine HCAI record for Islandaire was found. Did not find an HCAI eServices OSP record or PDF (no OSP-XXXX number) for Islandaire, and no evidence of an expired/rejected HCAI record either — setting to null per absence-of-evidence guidance rather than false. Retrieved 2026-08-09.",
       ahri_certified: true,
       ahri_certified_basis: "Direct fetch of ahridirectory.org returned HTTP 402 (blocked), so the live AHRI Directory listing could not be independently confirmed. As an alternate source, Islandaire's own official company news page confirms AHRI certification for its PTAC/PTHP line: 'The EZ Series 42 is now AHRI Certified' (islandaire.com/ez-series-42-now-ahri-certified/, posted 2017-05-15), which states the EZ42 Series can again be specified now that certification is complete, and links directly to the AHRI Directory's quick-search filtered to the PTAC/PTHP product category. This is manufacturer documentation naming AHRI certification specifically (not vague 'AHRI compliant' marketing prose) and citing the applicable AHRI program/category. Scope note: Islandaire's own engineering-manual language indicates AHRI certification applicable to EZ42 models only, so certification is confirmed specifically for the EZ Series 42 PTAC/PTHP line, not necessarily verified across Islandaire's entire product catalog. Retrieved 2026-08-09.",
       country_of_manufacture: "United States",
       country_of_manufacture_basis: "Islandaire's own website states the company 'designs and manufactures a full line of high-quality HVAC products' at its facility in St. James, NY (500 Middle Country Rd., St. James, NY 11780), and separately describes itself as 'a leading manufacturer of high-quality through-the-wall HVAC units, proudly made in the USA.' Sources: islandaire.com and islandaire.com/about-us. No separate overseas plant or multi-country production was found in company materials. Retrieved 2026-08-09.",
       competes_with: "Amana PTAC (Goodman/Daikin), Friedrich PDAC/PTAC, GE Zoneline, LG PTAC",
       competes_with_basis: "Islandaire's own site confirms its core positioning is 'perfect fit' PTAC/PTHP replacement units engineered to drop into existing wall sleeves in hotels, multifamily, hospitals, and universities, without site modification. That retrofit niche places it in direct competition with the incumbent OEM brands whose units are most commonly already installed in those wall sleeves and that also sell into new-construction and replacement PTAC/PTHP programs for the same hospitality/multifamily segment: Amana PTAC (now Goodman/Daikin), the longtime volume leader in hotel and apartment through-the-wall units; Friedrich, a major PTAC/PDAC line with a strong hospitality replacement business; GE Zoneline, one of the most widely installed legacy PTAC brands in older hotel/apartment stock (making it a frequent Islandaire replacement target and rival bidder); and LG, which has expanded aggressively into commercial PTAC for hospitality and multifamily. Based on general industry knowledge of the PTAC/PTHP category rather than a named competitor list from Islandaire itself. Retrieved 2026-08-09.",
       markets: [healthcare, education, hospitality, multifamily],
       markets_basis: "islandaire.com homepage (retrieved 2026-08-09): 'Islandaire specializes in creating replacement and custom units that meet the needs of hotels, hospitals, universities, and multi-family buildings.' Checked homepage, about-us page, products page, and sitemap.xml; no dedicated industries/markets landing pages exist and no copy found supporting data_center, industrial_warehouse, labs, or office. Retrieved 2026-08-09."}
    - {name: "ChangeAir", firm: DMG, category: air_handling, subcategory: "energy recovery ventilation",
       description: "Energy recovery ventilators — category confirmed correct 2026-08-13: this line's own already-completed research (competes_with_basis, markets_basis below) independently and unambiguously describes a decentralized classroom energy-recovery ventilation product, matching air_handling/ERV exactly; no new research needed.",
       value_tier: 3, equipment_type: null,
       oshpd_osp: null,
       oshpd_osp_basis: "Searched HCAI's official OSP list-by-category PDF (hcai.ca.gov/document/osp-list-by-category/), downloaded and text-extracted directly rather than relying on search snippets, covering all 20 pages and every category including Air Conditioning Units (Custom, Data Room, Inline Fans/Terminal, Packaged, Split), Air Filters, Fan Coil Units, Humidification Systems, Air Handling Units, and Exhaust/Smoke Control Fans — entries run through at least OSP-0732. No entry for 'ChangeAir', 'Change Air', or 'Systemair' (ChangeAir's parent company, per thermalnetics.com and systemair.com) appears anywhere in the document. Also ran general web searches and checked ChangeAir's own manufacturer page (thermalnetics.com/hvac-manufacturer/changeair/), which makes no OSHPD/HCAI/seismic-certification claim at all. Found no HCAI directory record, positive or negative. ChangeAir/Systemair's core product (decentralized classroom vertical unit ventilators) is also a less typical fit for OSHPD hospital HVAC installs than for K-12/commercial. Absence of a hit in the HCAI list is not proof no OSP exists (it could be missing from this compendium or filed under a different corporate name), so this is recorded as null, not false. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Could not directly verify. ahridirectory.org blocked automated access (HTTP 402; a raw curl returned HTTP 200 but only an empty client-rendered SPA shell with no server-side search results, and no working public API endpoint was found to query brand/model directly). Checked ChangeAir's own marketing/rep pages instead (systemair.com/en-us/products/air-handling-units/changeair, thermalnetics.com/hvac-manufacturer/changeair, aquaair.ab.ca/product/changeair): these cite ChangeAir units as 'tested in accordance with AHRI 260' (a sound-rating standard) only, with no mention of AHRI 1060 (the relevant program for air-to-air energy recovery ventilation equipment) and no 'AHRI 1060 Certified Component' badge — a specific badge/content block confirmed present on other, non-ChangeAir Systemair product pages but not found on the ChangeAir category page itself. Systemair (parent) does have a generic sitewide 'AHRI Product Performance Certification Program' card linking to ahridirectory.org and confirmed AHRI-1060-certified components elsewhere in its broader catalog, so the category is plausible given ChangeAir's optional Energy Recovery Wheel (ERW) accessory, but no direct evidence was found tying that specific AHRI 1060 certification to the ChangeAir line. Recommend a manual/authenticated ahridirectory.org search for 'ChangeAir' or 'Systemair' under the AHRI 1060 program before treating this as resolved. Retrieved 2026-08-09.",
       country_of_manufacture: "Canada and United States",
       country_of_manufacture_basis: "Systemair's own CSI Guide Specification for the ChangeAir Sophomore IQ Series lists two manufacturer plants for ChangeAir under Part 2.1 Manufacturers: 'Systemair Commercial AHU Ltd., 8 Rouse St, Tillsonburg, Ontario, N4G 5W8, Canada' and 'Systemair MFG Inc., 10048 Industrial Blvd, Lenexa, Kansas, 66215, USA.' Corroborated by supportontariomade.ca/explore-products/changeair-series ('Proudly made in Ontario by: Systemair') and Systemair's Tillsonburg, Ontario LinkedIn page, which describes Tillsonburg as 'the center for manufacturing commercial air handling units (AHU) for North America.' The Kansas plant is independently confirmed to make Systemair's Topvex ERV line and is listed as an alternate approved manufacturer for ChangeAir in the same CSI spec — both plants are named together as acceptable manufacturer entries, indicating units can be sourced from either. Systemair HQ is in Skinnskatteberg, Sweden, but ChangeAir units themselves are built at the Ontario, Canada and Kansas, USA plants, not in Sweden. Retrieved 2026-08-09.",
       competes_with: "Semco, Temspec, AAON, Trane",
       competes_with_basis: "Confirmed via Systemair/ChangeAir product pages and industry research: each company sells into the same niche — decentralized vertical unit ventilators with integrated energy recovery for K-12 classroom retrofit, the same category as ChangeAir's Freshman/Sophomore series. Semco's FV Series ERV is a vertical classroom unit ventilator with an integrated total energy recovery wheel, one of the longest-standing names in this space. Temspec's VER (Vertical Unit Ventilator with Integral Energy Recovery) line is purpose-built for K-12 schools and is among the closest product-for-product matches to ChangeAir. AAON (also a DMG-carried line — see that line_card entry) markets energy recovery ventilation specifically for classroom IAQ and is commonly named alongside ChangeAir/Semco in comparisons. Trane markets horizontal and vertical unit ventilators explicitly for K-12 school renovations and is the common legacy incumbent reps displace in classroom retrofit bids. Retrieved 2026-08-09.",
       markets: [education],
       markets_basis: "Systemair's own ChangeAir product page (systemair.com/en-us/products/air-handling-units/changeair, retrieved 2026-08-09) is framed entirely around 'Decentralized Air in Classrooms' and 'classroom unit ventilators,' with no other vertical named. Corroborated by a ChangeAir case study at Saint Mark's College (University of British Columbia theological seminary, lecture rooms/computer lab) and by authorized-distributor product pages (ThermalNetics, Aqua Air Systems, Midwest Applied Solutions), all retrieved 2026-08-09, which uniformly describe ChangeAir as 'The Sound Leader for Classroom Ventilation' for school/classroom environments. No literature found names data_center, healthcare, industrial_warehouse, hospitality, labs, office, or multifamily as target markets for this line."}
