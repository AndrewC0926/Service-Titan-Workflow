    - {name: "Neptronic", firm: both, category: controls, subcategory: "dampers, actuators, humidifiers",
       description: "Control dampers, actuators, electric heat, humidifiers", value_tier: 3, equipment_type: null,
       oshpd_osp: true,
       oshpd_osp_basis: "Confirmed current in HCAI's own directory. HCAI's OSP-by-category listing lists 'OSP-0531: Neptronic' under Air Conditioning Units > Humidification Systems, with no expired/cancelled annotation (unlike several other entries in the same category flagged expired/cancelled, e.g. OSP-0651 DriSteem 'Cancelled'). Verified directly against the primary-source HCAI application PDF at hcai.ca.gov/document/OSP-0531: Manufacturer 'Neptronic' (400 Lebeau Blvd, Saint-Laurent, QC), Product Category 'Air Conditioning Units', Sub-Category 'Humidification Systems', models SKS4 (steam-to-steam humidifiers), SKG4 (gas-fired humidifiers), SKD-MS/MF SAM/MS (steam grid distributors), and SKE4 (electric humidifiers). This is a RENEWAL application dated 01/05/2026, with 'HCAI Approval — Approval Expires on 01/05/2032.' (An earlier version of OSP-0531, originally approved 09/03/2021, had shown expiry 12/31/2025, confirming this is a genuine renewal rather than a stale/expired listing.) Certification method: ICC-ES AC156 shake-table testing via Dynamic Certification Laboratory, applicant/agent The VMC Group. Scope note: this OSP covers Neptronic's electric/gas/steam humidification systems and steam grid distributors specifically — it does NOT cover Neptronic's control dampers or actuators, which were not found in any HCAI OSP category (Air Conditioning Units subtypes, Fan Coil Units, Air Filters, Exhaust/Smoke Control Fans) during this search. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Not applicable — Neptronic's relevant product lines (control dampers, actuators, humidifiers, electric heat) fall outside AHRI's certifiable scope. AHRI's own certification program page (ahrinet.org/certification) describes roughly 50 voluntary programs covering HVACR and water-heating equipment such as furnaces, unitary AC, heat pumps, chillers, VRF, fan coils, VAV terminal units, and water heaters — no program exists for humidifiers, control dampers, or actuators. Multiple searches of AHRI's certification/directory pages and of Neptronic's own site/marketing (neptronic.com) turned up no AHRI certification claim for any Neptronic product; the only Neptronic+AHRI association found was Neptronic's exhibitor participation in the 'AHR Expo' trade show, an unrelated industry trade show (International Air-Conditioning, Heating, Refrigerating Exposition), not AHRI product certification — should not be confused with it. Direct fetch of ahrinet.org/neptronic.com pages was blocked (403), so this relies on corroborating search snippets rather than a full page read; category-scope conclusion is high confidence, but direct site confirmation could not be completed. Retrieved 2026-08-09.",
       country_of_manufacture: "Canada",
       country_of_manufacture_basis: "Neptronic's official 'About Us' page (neptronic.com/Aboutus.aspx) states: 'All our intelligent controllers, electronic actuators, actuated valves, humidifiers, and electric heaters are Canada-made by our private corporation,' and that the company's 300+ person team designs and manufactures all products (including circuit board assembly, sheet metal fabrication, and testing) at a 9,000 m2 (97,000 sq ft) facility in Montreal, Canada — consistent with the company's Saint-Laurent, Quebec headquarters. First-party, unambiguous claim covering the full core product line; no conflicting information or offshore manufacturing found. Retrieved 2026-08-09.",
       competes_with: "Belimo, Siemens Building Technologies, Johnson Controls (Ruskin/JCI actuators), DriSteem, Nortec (Condair Group), Carel",
       competes_with_basis: "Neptronic sits in two distinct HVAC sub-categories, so the comparable set splits: (1) Control dampers/actuators — Neptronic's niche is electric (non-pneumatic) fail-safe damper/valve actuators and round/rectangular dampers used in BAS retrofit and new-construction specs. Belimo is the closest direct competitor, as the dominant electronic spring-return actuator maker specified head-to-head with Neptronic on most bid comparisons; Siemens Building Technologies and Johnson Controls (whose Ruskin brand supplies dampers, paired with JCI actuators) are the other names reps most commonly see on the same spec sheets/submittals for BAS-integrated actuation. (2) Electric/electrode humidifiers — DriSteem (Eden Prairie, MN) and Nortec (a Condair Group brand, confirmed selling electrode steam humidifiers like the Condair EL/Nortec line) are Neptronic's most direct rivals for electrode and resistive commercial humidifiers; Carel (also a DMG-carried line — see that line_card entry) is a frequent third name in electrode/humidification specs, especially on data center and light-commercial jobs. Verified Neptronic's own product line via neptronic.com and DriSteem's/Condair's electrode humidifier lines directly; the actuator/damper competitor set (Belimo, Siemens, JCI/Ruskin) reflects general industry knowledge not freshly source-verified this session. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, industrial_warehouse, education, labs, office, multifamily],
       markets_basis: "neptronic.com product-application pages (retrieved 2026-08-09): Actuator and Valve applications pages both explicitly list 'Data Centers,' 'Hospital and Healthcare Facilities,' 'Institutional and School Facilities,' and 'Offices and Workplaces' as named application categories; the actuator page also lists 'Laboratory Fume Hoods' and 'Cleanrooms'; the humidifiers/humidity page lists 'Hospitals and Healthcare Facilities,' 'Pharmaceuticals and Laboratories,' 'Cleanrooms, Data Centers and Electronics,' and 'Institutional and School Facilities'; the Controls applications page names 'Manufacturing and Warehouses Facilities' and 'Offices and Commercial Spaces'; a humidifier product application page names 'Data Centers' and 'Factories'; a heater application page explicitly names 'Condominiums and Apartment Buildings' (multifamily). No hotel/resort/lodging/hospitality vertical was named on any checked application page, so hospitality is excluded. Retrieved 2026-08-09."}
    - {name: "LFSystems", firm: DMG, category: controls, subcategory: "lab airflow controls",
       description: "Lab/fume airflow controls (best-guess categorization — confirm)",
       value_tier: 3, equipment_type: null,
       markets: [],
       markets_basis: "Could not confirm which real company this line_card entry refers to, so no markets can be sourced. Two distinct companies match the name: (1) lfsystems.com, LF Systems Corp, a laboratory-furniture dealer/installer (DE/PA/MD/NJ) selling fume hoods, casework, and benches as furniture products since 1983 — no controls product line, no markets/industries page, no case studies; not a manufacturer of airflow controls (valves, sensors, controllers). (2) lfsystems.net, a division of RM Manifold Group, is a genuine controls manufacturer (L150/L330/L850/L864 constant-pressure and stairwell-pressurization controllers) but its stated scope is commercial laundry exhaust, dryer venting, high-rise exhaust, and stairwell/elevator-hoistway pressurization — not lab/fume-hood airflow control, and names no lab/fume-hood application anywhere on its site. Competitor search for lab/fume-hood airflow control manufacturers surfaced only unrelated firms (Accutrol, TSI, Triatek, Phoenix Controls). Neither candidate is verifiably the described lab/fume-hood airflow-controls line, so this line's category flag remains unresolved pending confirmation of the correct company identity — this is a research gap, not a finding that no markets exist. Retrieved 2026-08-13."}
    - {name: "Carel", firm: DMG, category: controls, subcategory: "humidification & refrigeration controls",
       description: "Humidification and refrigeration controls", value_tier: 3, equipment_type: null,
       oshpd_osp: true,
       oshpd_osp_basis: "Confirmed via the HCAI-hosted application PDF itself (not just marketing copy): OSP-0705, Manufacturer 'Carel USA', Product Type 'Humidification Systems', Product Model Number 'HeaterSteam and UltimateSAM' (HeaterSteam Boilers and UltimateSAM Distribution Grids). Mounting configs covered: wall-mounted boilers, floor/ceiling-mounted distribution grids in suspended ducts, and distribution grids mounted in rigid-base-mounted AHUs (cross braces required for rigid base mounted ACUs). Certification method ICC-ES AC156, tested by Dynamic Certification Laboratory (DCL). The HCAI approval block is signed/sealed by Timothy Piland, Senior Structural Engineer, dated 08/11/2022, stating 'Approval Expires on 08/11/2028' — this is CURRENT as of the 2026-08-09 retrieval date (about 2 years remaining). Source PDF: https://hcai.ca.gov/wp-content/uploads/2022/08/OSP-0705.pdf, also indexed on HCAI's OSP list-by-category page under Humidification Systems. Note: an earlier snapshot/search result had shown OSP-0705 as 'In Review' as of March 2022, but the HCAI-issued document itself (dated August 2022) bears a signed approval with an expiry date, confirming it was subsequently approved and is not merely pending. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Not applicable — humidification and refrigeration controls are not AHRI-certifiable product categories. Checked AHRI's official list of certification programs (ahrinet.org/certification/ahri-certification-programs): it covers chillers, coils, ERV/HRV, boilers, air handlers, dehumidifiers, furnaces, heat pumps, PTAC, room fan-coils, unit ventilators, unitary equipment, water heaters, ice makers, and transport refrigeration — no humidifier program and no refrigeration-controls program exist. Also checked Carel's own site (carel.com) directly and found no AHRI certification claim anywhere in its product or company content. Since Carel's core lines (humidification, refrigeration/HVAC controls) fall outside AHRI's scope entirely, ahri_certified is null/not-applicable rather than true or false. Retrieved 2026-08-09.",
       country_of_manufacture: "Italy and United States (multi-country manufacturer)",
       country_of_manufacture_basis: "Carel Industries S.p.A. is headquartered in Brugine, Padua, Italy, where its air-humidification/evaporative-cooling lab is based. Carel's corporate About Us page states the Group has 50 subsidiaries and production plants in Europe, Americas and Asia without a full plant list. Carel USA's own page confirms a manufacturing facility in Manheim, PA (built 2004, expanded 2019 to ~80,000 sq ft) that produces humidification systems plus A/C and refrigeration controls for the North American market. Carel's subsidiaries/acquisitions page additionally lists HygroMatik (Henstedt-Ulzburg, Germany) as designing/producing humidifiers and accessories, and Klingenburg International (Poland) as producing heat-recovery and humidification products — so Carel-brand humidification equipment is built across at least Italy, USA, Germany, and Poland depending on line/market. Could NOT find an explicit country-of-manufacture statement specific to the HeaterSteam or UltimateSAM product names (the OSP-0705-certified models) on Carel's product pages — those pages list the products without factory/origin detail. Given HeaterSteam's North America-specific naming ('heaterSteam NA') and the Manheim, PA plant's stated role manufacturing humidification systems for the NA market, US assembly for HeaterSteam is plausible but NOT confirmed by an explicit source; treat the US portion as reasonably-inferred rather than directly documented, and Italy as the confirmed home-market/HQ manufacturing base for the broader humidification line. Retrieved 2026-08-09.",
       competes_with: "DriSteem, Condair (Nortec), Neptronic, Herrmidifier",
       competes_with_basis: "These four are the manufacturers most commonly specified head-to-head against Carel's HeaterSteam/UltimateSAM line because they build the same narrow product set — electrode (and resistive) steam boiler humidifiers plus in-duct/AHU steam distribution grids/manifolds for commercial and industrial buildings — rather than being generic HVAC equipment makers. DriSteem (GTS, CRUV, Vapormist boilers with Rapid-Sorb distribution manifolds) and Condair, which absorbed Nortec (EL/SE electrode and resistive humidifiers with matching duct grids), are the two most frequently named direct alternatives in commercial specs. Neptronic (also a DMG-carried line — see that line_card entry; SKE electrode humidifiers) and Herrmidifier (a legacy US specialist in duct steam grid/distribution design) round out the set of vendors reps would realistically be asked to compare against on a mechanical spec for duct/AHU humidification. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, industrial_warehouse, hospitality, labs, office],
       markets_basis: "carel.com/application pages (retrieved 2026-08-09): dedicated data center page (PUE/WUE-focused cooling and humidification for mission-critical facilities); hospitals-and-operating-theatres page (humidity control framed as 'a legal requirement' for patient/staff safety, white paper 'Air humidification in hospitals'); hotels and steam-bath pages (hotels named explicitly for guest-comfort and spa/steam-bath market); offices page (offices named explicitly for IAQ/comfort humidification); refrigerated-units-for-scientific-applications page (explicitly targets 'analysis laboratories,' pharmacies, and hospitals for scientific/lab refrigeration control); industry-and-process plus automotive, plastic-industry, textile-industry, wood-industry, and cold-rooms pages (broad named industrial manufacturing/process and cold-storage verticals). Checked and excluded: education (no education/school/university application page or case study found); multifamily (the only residential page markets single-family home heat-pump comfort control, not apartment/multifamily buildings). Retrieved 2026-08-09."}
