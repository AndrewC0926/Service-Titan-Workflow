sources:
  ceqanet:
    enabled: true
    base_url: "https://ceqanet.lci.ca.gov"
    counties: [Los Angeles, Orange, San Bernardino, Riverside, San Diego, Imperial, Kern]
    # Document-type allowlist, using CEQAnet's real 3-letter codes (NOP, EIR,
    # MND, NEG, NOD, NOE, ...). Empty = accept every type.
    #
    # Deliberately empty: over a 12-month live sample of all 7 counties, 8 of
    # the 10 data-center filings were NOE (Notice of Exemption) — including two
    # city data-center moratoria and a county IT-department contract. The old
    # NOP/EIR/NEG/MND/NOD allowlist would have discarded those 8. The keyword
    # filter already cuts 10,651 rows to ~10, so an allowlist buys nothing and
    # costs real signal. Restrict only if a type turns out to be pure noise.
    document_types: []
    fetch_detail: true   # pull the detail page for keyword-matched rows
    lookback_days: 30
  edgar:
    enabled: true
    base_url: "https://efts.sec.gov/LATEST/search-index"
    lookback_days: 14
    max_pages: 3              # full-text pages are 10 hits each, per query
    max_body_chars: 400000    # filing text stored; app/sections.py chunks it for the LLM
    min_body_chars: 2000      # below this, verify-sources reports FAIL (stub detection)
    min_doc_chars: 2000       # floor used by `scout doc-stats`; the old rows averaged 202
    #
    # Purpose is narrow: data center ABS/CMBS deal documents that name campuses,
    # tenants, MW and delivery dates, plus filings by named developers. The old
    # config ('"data center" "Nevada"' over 10-K/10-Q) produced 3,016 rows of chip
    # and software companies whose risk factors mention data centers.
    #
    # Deal-document forms: where campus/tenant/MW terms actually appear.
    # ABS-15G and ABS-EE are the securitization filings; 424B* are the
    # prospectuses; 10-D are the ongoing servicer reports.
    forms: ["ABS-15G", "ABS-EE", "424B2", "424B3", "424B5", "10-D"]
    # Forms where a *named developer* announces a project. Kept separate so 8-K
    # does not drag in every crypto miner that says "data center".
    developer_forms: ["8-K", "S-1", "S-4", "424B5"]
    # Phrases that essentially only data center deal documents use.
    deal_phrases:
      - "data center revenue notes"
      - "stabilized data center"
      - "critical IT load"
      - "megawatts of critical"
    # Known data center ABS issuers, queried across deal + developer forms.
    issuer_queries:
      - "Vantage Data Centers"
      - "Aligned Data Centers"
      - "Switch, Ltd."
      - "STACK Infrastructure"
      - "CyrusOne"
      - "Compass Datacenters"
      - "DataBank Holdings"
      - "Cologix"
      - "Flexential"
      - "Sabey Data Center"
      - "Phoenix Data Center Acquisitions"
      - "TierPoint"
    #
    # THE PRECISION GATE. A hit is kept only if the *filer's* display name matches
    # one of these. Verified on a 468-hit live sample: 93 kept, 375 dropped. This
    # is what separates "Vantage Data Centers Holdings, LLC files an ABS-15G"
    # (keep) from "JPMORGAN CHASE & CO files a 424B2 that mentions STACK" (drop),
    # and it is why the query terms themselves can stay simple. Filers dropped by
    # this gate in testing: Applied Digital, TeraWulf, Core Scientific, Riot,
    # CleanSpark, Galaxy Digital, BBCMS mortgage trusts, Csquare, WEC Energy.
    issuer_patterns:
      - "data center"
      - "datacenter"
      - "data centre"
      - "vantage data"
      - "retained vantage"
      - "aligned data"
      - "adc holdco"
      - "stack infrastructure"
      - "cyrusone"
      - "compass datacenter"
      - "databank"
      - "cologix"
      - "flexential"
      - "sabey"
      - "tierpoint"
      - "switch, ltd"
      - "edgecore"
      - "novva"
      - "powerhouse data"
      - "prime data"
      # REITs/trusts that own and acquire campuses (their 8-Ks name sites and MW),
      # as distinct from funds that merely hold the ABS notes. Named explicitly —
      # a bare "digital infrastructure" also matched "BlockchAIn Digital
      # Infrastructure, Inc.", a crypto shell with no campuses.
      - "blue owl digital infrastructure"
      - "blackstone digital infrastructure"
      - "stratcap digital infrastructure"
      - "digital realty"
      - "equinix"
  goed:
    enabled: true
    base_url: "https://goed.nv.gov"
    notices_path: "/notices-agendas/"
    # NRS 360.754 qualification thresholds, used to infer minimum size:
    thresholds:
      ten_year: {employees: 10, capex_usd: 25000000}
      twenty_year: {employees: 50, capex_usd: 100000000}
  legistar:
    enabled: true
    api_base: "https://webapi.legistar.com/v1"
    # Every slug below was verified live against webapi.legistar.com — each one
    # returns 200 and real body names. Slugs are NOT derivable from the city
    # name, so do not guess: add a candidate, run `scout verify-sources --only
    # legistar`, and keep it only if it reports ok. A 500 carrying
    # "LegistarConnectionString setting is not set up" means the slug does not
    # exist.
    clients:
      - {client: "fontana", label: "City of Fontana, CA"}
      - {client: "sanbernardino", label: "San Bernardino County, CA"}
      - {client: "riversidecountyca", label: "Riverside County, CA"}       # was "rivco"
      - {client: "lacounty", label: "County of Los Angeles, CA"}           # has Plans and Zoning Committee
      - {client: "clark", label: "Clark County, NV"}                       # was "clarkcountynv"
      - {client: "washoe-nv", label: "Washoe County, NV"}                  # was "washoe"
    lookback_days: 21
    # REMOVED — these jurisdictions are not Legistar tenants at all (verified:
    # no slug variant resolves on webapi.legistar.com, and each publishes
    # agendas on a different platform). Leaving them here as dead slugs is what
    # produced ten HTTP 500s per run. Each needs its own adapter to recover:
    #
    #   City of Ontario, CA        Granicus ViewPublisher  ontarioca.granicus.com
    #   Rancho Cucamonga, CA       Granicus ViewPublisher  ranchocucamonga.granicus.com
    #   Moreno Valley, CA          eScribe                 pub-morenovalley.escribemeetings.com
    #   City of El Segundo, CA     Granicus ViewPublisher  elsegundo.granicus.com
    #   City of Reno, NV           PrimeGov                reno.primegov.com
    #   City of Sparks, NV         Granicus ViewPublisher  sparks.granicus.com
    #   Storey County, NV          CivicPlus AgendaCenter  storeycounty.org/AgendaCenter
    #
    # NEVADA COVERAGE GAP: Legistar now covers only Clark and Washoe counties.
    # Storey County (Tahoe Reno Industrial Center) is the highest-value Nevada
    # jurisdiction and is CivicPlus-only, and Nevada has no CEQA equivalent —
    # so until a CivicPlus/PrimeGov adapter exists, Storey/Reno/Sparks local
    # signal comes only from GOED plus the northern-Nevada RSS feeds below.
    # Las Vegas, Henderson, and North Las Vegas were also probed: not Legistar.
  # CivicPlus AgendaCenter — jurisdictions with no Legistar and no CEQA equivalent.
  # Storey County IS the Tahoe Reno Industrial Center (Vantage, Tract, Google,
  # Switch) and was the largest blind spot in the system.
  civicplus:
    enabled: true
    lookback_days: 60
    # Packets run to 268 pages / 16 MB; the agenda item list is up front, so
    # parse the head and keyword-screen that. Raise only if items are being missed.
    max_pdf_pages: 40
    document_kinds: ["Agenda"]   # add "Minutes" to also pull decisions (doubles downloads)
    jurisdictions:
      - name: "Storey County, NV"
        base_url: "https://storeycounty.org"
        county: "Storey"
        state: "NV"
        # Category IDs come from the AgendaCenter page (`id="cat<N>"`), NOT from
        # the CID query params, which belong to unrelated CivicPlus modules.
        categories:
          - {id: 4, label: "Planning Commission"}
          - {id: 2, label: "Board of Commissioners"}
          # NOT category 8 ("Notices of Possible Quorum"): verified that all 14 of
          # its 2026 documents are one-page scans with no text layer (0 chars, 2
          # images), so they produced nothing but warnings. They are procedural
          # quorum notices with no project content. Every Agenda in categories 2
          # and 4 parses cleanly. tesseract is present on the box if these ever
          # become worth OCRing.
  # PrimeGov public portal — City of Reno.
  #
  # DISABLED, and not for a technical reason: reno.primegov.com/robots.txt is
  # "User-agent: * / Disallow: /" — the entire host is off-limits. The adapter is
  # written and its endpoints are verified (the meeting list and HTML agendas both
  # work when fetched by hand), but PoliteClient correctly refuses the requests and
  # we do not work around robots. Enabling this flag will just produce
  # RobotsDisallowed on every request.
  #
  # If Reno coverage is needed, it has to come from a route that permits crawling:
  # reno.gov's own public-records search, a Google Alerts RSS feed added to
  # sources.rss, or a direct records request. Northern Nevada trade press is
  # already covered by the EDAWN / This Is Reno / NNBW feeds below.
  primegov:
    enabled: false
    lookback_days: 60
    jurisdictions:
      - name: "City of Reno, NV"
        base_url: "https://reno.primegov.com"
        county: "Washoe"
        state: "NV"
        # Substring match on the meeting title; empty list = every committee.
        committees: ["Planning Commission", "City Council", "Redevelopment"]
  rss:
    enabled: true
    feeds:
      - {name: "Data Center Dynamics", url: "https://www.datacenterdynamics.com/rss/"}
      - {name: "Data Center Frontier", url: "https://www.datacenterfrontier.com/rss.xml"}
      - {name: "Nevada Current", url: "https://nevadacurrent.com/feed/"}
      - {name: "The Nevada Independent", url: "https://thenevadaindependent.com/feed"}
      - {name: "Northern Nevada Business Weekly", url: "https://www.nnbusinessview.com/feed/"}
      - {name: "inewsource", url: "https://inewsource.org/feed/"}
      - {name: "CalMatters", url: "https://calmatters.org/feed/"}
      # Nevada fallback coverage (GOED contingency — see RUNBOOK):
      - {name: "EDAWN", url: "https://edawn.org/feed/"}
      - {name: "This Is Reno", url: "https://thisisreno.com/feed/"}
      # Add Google Alerts RSS URLs here.
  ats:
    enabled: true
    # boards resolved from companies section above (greenhouse/lever/ashby keys)
    geo_terms: [Ontario, Rancho Cucamonga, Fontana, Moreno Valley, Riverside, San Bernardino,
                El Segundo, Los Angeles, Orange County, San Diego, Irvine, Reno, Sparks,
                Storey, Washoe, Las Vegas, Clark County, Henderson, North Las Vegas, Phoenix, Mesa]
  air_permits:
    enabled: false   # Tier 2: PDF-heavy; enable after Tier 1 proves out
  utility_filings:
    enabled: false   # Tier 2
  faa_7460:
    enabled: false   # Tier 2
  water_districts:
    enabled: false   # Tier 2
  manual:
    enabled: true

sizing:
  tons_per_mw_it: 284            # 1 MW IT: W*3.412 BTU/hr / 12000
  tons_per_mw_installed_low: 300 # installed incl. non-IT heat + N+1
  tons_per_mw_installed_high: 400
  tons_per_mw_installed_default: 325
  # Band half-width around the midpoint, per estimate basis. The uncertainty of
  # the estimate comes from HOW we know the size, not a fixed ratio:
  band_by_basis:
    stated_it: 0.10       # a filing states IT MW — tightest
    stated_total: 0.18    # total/utility MW, IT share inferred
    gensets: 0.28         # MW reverse-engineered from generator fleet
    sqft: 0.45            # square footage only — widest, flagged low-confidence
  hp_to_kw: 0.7457
  genset_mw_to_it_mw_divisor: 1.4
  watts_per_sqft: 150            # used only when sqft is the only size input; low confidence
  sqft_utilization: 0.5          # fraction of building sqft assumed to be white space
  # Industrial buildings are sized from floor area, not IT watts — their load is
  # envelope + ventilation + process, not servers. Square feet per ton by what the
  # building actually does; extraction reports `facility_type` and sizing branches
  # on it. These are Andrew's numbers, not defaults — the spread across types is
  # 50x, so type matters more than area.
  #
  # NOTE on `unknown`: spans every type above, because that is what not knowing
  # actually means. A 100,000 sqft building of unstated type is 40-2,000 tons, and
  # saying so is more useful than a confident middle. Narrow it if you would rather
  # assume light manufacturing.
  industrial_sqft_per_ton_by_type:
    distribution_fulfillment: {low: 1000, high: 2500}
    warehouse_conditioned:    {low: 800,  high: 1500}
    light_manufacturing:      {low: 300,  high: 600}
    heavy_manufacturing:      {low: 100,  high: 300}   # with process load
    cleanroom:                {low: 50,   high: 150}
    office_rnd:               {low: 300,  high: 400}
    unknown:                  {low: 50,   high: 2500}  # the full span, deliberately
  # Ceiling on watts-per-sqft implied by a STATED MW figure. Above this the stated
  # number is treated as a misread (a product rating, an annual output, a utility
  # service size) and discarded rather than trusted — see the Amperesand case in
  # sizing.implausible_watts_per_sqft. A "stated" value otherwise outranks every
  # low-confidence guard, which is how 500 MW on 73,000 sqft became 136,964 tons.
  max_watts_per_sqft_by_category:
    data_center: 500     # generous: dense white space runs 150-300 W/sqft
    industrial: 60       # manufacturing process load, well above typical
    other: 60

scoring:
  window_multipliers:
    PRE_BOD: 1.0
    IN_BOD: 0.7
    POST_BOD: 0.15
    OPERATING: 0.05
  recency_halflife_days: 180     # no new signal in 180d ~ halves score
  corroboration_bonus: 0.25      # added certainty per extra independent signal type (capped)
  corroboration_cap: 2           # max extra types counted
  min_digest_score: 0.15
  # Certainty priors by signal type (0-1)
  signal_certainty:
    utility_load_request: 0.25
    land_transfer: 0.45
    abatement_application: 0.75
    ceqa_nop: 0.75
    planning_agenda: 0.55
    job_posting: 0.45
    air_permit_atc: 0.9
    water_will_serve: 0.7
    ceqa_deir: 0.75
    engineer_move: 0.8
    faa_7460: 0.9
    abs_issuance: 0.8
    news_report: 0.4
    prequal_invite: 1.0
