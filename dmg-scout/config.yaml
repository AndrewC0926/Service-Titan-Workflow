    - {name: "AtmosAir/Bioclimatic", firm: DMG, category: filtration_iaq, subcategory: "bipolar ionization",
       description: "Bipolar ionization air purification", value_tier: 3, equipment_type: null,
       oshpd_osp: null,
       oshpd_osp_basis: "Searched HCAI's own OSP records directly, not marketing claims. Downloaded and full-text-extracted the official 'OSP List by Category' PDF (footer-dated 03/01/2022) and searched case-insensitively for 'atmos', 'bioclim', and 'ioniz' across the whole document — zero matches. Cross-checked against the live HCAI OSP program page, whose Air Filters category — the only plausible category for an in-duct bipolar-ionization accessory — lists exactly four current entries: OSP-0269 Dynamic Air Quality Solutions (exp. 9/26/2028), OSP-0307 Genesis Air Inc. & IAQ Solutions (exp. 3/11/2032), OSP-0558 Global Plasma Solutions (exp. 9/14/2028, a bipolar-ionization competitor, confirming the category does accept this product type), and OSP-0627 Price Industries Ltd (exp. 3/5/2032). No AtmosAir or Bioclimatic entry. Also checked Air Conditioning Units (all subtypes), Fan Coil Units, Humidification Systems, and Exhaust/Smoke Control Fans — no AtmosAir/Bioclimatic entries anywhere. General web search for AtmosAir + OSHPD/HCAI seismic certification returned only AtmosAir's own marketing/technical literature, no actual HCAI OSP number. No HCAI record of rejection or expiration was found either — this is a genuine absence, not a lapsed/denied certification, so recorded as null rather than false. Since a direct competitor (Global Plasma Solutions) does hold a current OSP in this exact category, it's plausible AtmosAir has simply never pursued preapproval rather than the category being inapplicable to this product type. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Not applicable. AHRI does not offer a certification program for air purification/bipolar ionization devices. Checked AHRI's own certification programs directory (ahrinet.org/certification/ahri-certification-programs), which lists 38 programs covering categories like air-cooled chillers, ERVs, AHU casings/fans, boilers, furnaces, and commercial refrigeration/water heaters — no air purification or ionization category exists (none would sort alphabetically between 'Air-Cooled Water-Chilling Packages' and 'Air-to-Air Energy Recovery Ventilators,' confirming the gap). Cross-checked AtmosAir's own marketing (atmosair.com homepage and atmosair.com/active-ox/ product page): no AHRI certification claim appears anywhere; the company cites ASHRAE 62.1 compliance, UL 2998 (zero-ozone) guidance, and independent/peer-reviewed lab testing instead. Bipolar ionization is simply not an AHRI-certifiable product category, so this field is null/not-applicable rather than true or false. Retrieved 2026-08-09.",
       country_of_manufacture: "United States",
       country_of_manufacture_basis: "AtmosAir Solutions (a Clean Air Group, Inc. brand) is headquartered in Fairfield, CT (atmosair.com/contact/) — a corporate/sales office, not a stated plant. Clean Air Group acquired Bioclimatic Air Systems, LLC in April 2021 (atmosair.com/press/air-purification-leader-expands-portfolio/; westfaironline.com). Bioclimatic Air Systems, LLC was established in 1982 in Delran, New Jersey and is independently listed in trade directories as a 'Manufacturer' of bipolar ionization / custom-built air purification and handling units (600 Delran Pkwy Suite D, phone 856-764-4300) (us.metoree.com; eco-web.com). AtmosAir's current 'New Jersey Office' (1000 Taylors Lane, Cinnaminson, NJ) lists the identical phone number, 856-764-4300, indicating the legacy Bioclimatic NJ manufacturing site continues to operate under the AtmosAir/Clean Air Group umbrella. No overseas factory or plant was found in any company page, press release, or trade listing reviewed; AtmosAir also lists a Shanghai, China office, but this was not described as a manufacturing facility in any source found. Confidence is moderate — no page uses an explicit 'Made in USA' or 'manufactured at' label; this is inferred from the NJ facility's continuity and its independent trade-directory manufacturer listings. Retrieved 2026-08-09.",
       competes_with: "Global Plasma Solutions (GPS Air), Plasma Air (WellAir), iWave/NuShield (Nu-Calgon)",
       competes_with_basis: "These are the other major manufacturers of bipolar/needlepoint ionization air purification devices for HVAC systems, confirmed via their own product pages (gpsair.com, wellairsolutions.com/plasma-air, iwaveair.com). Global Plasma Solutions markets needlepoint bipolar ionization (NPBI) and holds an active HCAI OSP per this project's round-1 research (see this same line's oshpd_osp_basis). Plasma Air (now under WellAir) offers ozone-free 'soft ionization' whole-building HVAC purification, directly overlapping AtmosAir's commercial/mechanical-contractor channel. iWave/NuShield (manufactured by Nu-Calgon) is a widely specified needlepoint bipolar ionization line sold into the same HVAC contractor market. AtmosAir's own site made no explicit competitor comparisons, so this list is based on general industry knowledge plus direct verification of each competitor's technology category via their websites. Retrieved 2026-08-09.",
       markets: [healthcare, industrial_warehouse, education, hospitality, office, multifamily],
       markets_basis: "atmosair.com markets navigation (atmosair.com/markets/, retrieved 2026-08-09) lists dedicated vertical pages for Healthcare (case studies: Rush University Medical Center, McLaren Greater Lansing Hospital, Avera Health, ALG Senior, Ronald McDonald House Charities), Education (Pace University, SUNY, Texas A&M, UCLA, USC, multiple school districts), Hospitality (Four Seasons, Hilton, Marriott, Hard Rock, Moxy hotels, restaurants/theaters/cinemas), Office (dedicated 'Our Office Clients' page plus Gensler, Morgan Lewis HQ, NBA HQ case studies), Industrial (manufacturing plant exhaust/VOC treatment case study, The Ensinger Group), and Residential/multifamily case studies (85 Jay Brooklyn, Eleven on the River, Lux UTC — apartment/condo towers). No dedicated data_center vertical page, case study, or explicit copy was found anywhere in the site's full page sitemap, so data_center is excluded. No dedicated laboratory/lab vertical page or case study was found (the industrial case study is a manufacturing/plastics plant, not a lab), so labs is excluded. Retrieved 2026-08-09."}
    - {name: "UVDI", firm: DMG, category: filtration_iaq, subcategory: "UV disinfection",
       description: "UV-C disinfection systems", value_tier: 3, equipment_type: null,
       oshpd_osp: null,
       oshpd_osp_basis: "Searched HCAI's own OSP directory, the OSP-list-by-category PDF, HCAI eServices/document search, and the Panache Engineering third-party OSP database for any manufacturer entry under 'UVDI' or 'Ultraviolet Devices Inc.' No manufacturer page or OSP number was found for UVDI as an OSP holder in its own right. The only HCAI record where UVDI's name appears is inside Johnson Controls Inc.'s OSP-0243 (product family: York Custom YC / Miller-Picking MP Air Conditioning Units, renewal dated 8/25/2021, full text confirmed at hcai.ca.gov/wp-content/uploads/2023/05/OSP-0243.pdf), where UVDI 'V-MAX Grid UV Systems' (carbon/stainless steel grid, 28x48 and 97x144, tunnel-mounted) and UVDI 'HMB V-Bank Air Filters' (24x12W/24x24W, mounted within Type 8/HEPA filter frame) are listed in Attachment 1 as qualified subcomponents that may be installed inside JCI's custom AHU casing under JCI's seismic test envelope (SDS=1.93g, z/h=1, Ip=1.5) — they are not UVDI's own certification. Furthermore, that OSP-0243 approval itself expired 12/31/2025, i.e. before today's date (2026-08-09), so even the subcomponent listing is not currently active. No other OSP document naming UVDI, and no UVDI entry in the Air Filters/Air Conditioning Units/Fan Coil/Humidification/Exhaust-Smoke-Control-Fan categories, was found. Conclusion: UVDI does not appear to hold a current standalone HCAI OSP; it has at most been referenced as a qualified subcomponent inside another manufacturer's now-expired unit-level OSP. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Not applicable — UV-C disinfection devices are not an AHRI-certifiable product category. AHRI's certification programs cover HVACR equipment only — unitary AC/heat pumps, chillers, air handlers with coils, VRF, fan coils, ERV/HRV, PTAC, etc. — with no program for UV, ultraviolet, or air disinfection/sterilization equipment. Checked UVDI's own site (uvdi.com homepage and products page) and found no AHRI claim, reference, or marketing language of any kind — only unrelated certifications (e.g., NMSDC Certified Minority Business Enterprise). Since the product category itself falls outside AHRI's scope and UVDI makes no AHRI claim, this field is treated as not applicable rather than true or false. Retrieved 2026-08-09.",
       country_of_manufacture: "United States",
       country_of_manufacture_basis: "UVDI's own website states products are 'Designed and made in the U.S.A. to perform in demanding environments worldwide' (uvdi.com), and the company's 'Our Story' page states UVDI 'designs and manufactures advanced Ultraviolet (UV) air and surface disinfection technology in Valencia, California' (uvdi.com/our-story/). No other plant/factory locations were found; headquarters and manufacturing appear co-located in Valencia, CA. Retrieved 2026-08-09.",
       competes_with: "Steril-Aire, Fresh-Aire UV, UV Resources, Lumalier",
       competes_with_basis: "General industry knowledge. These are the manufacturers most commonly bid against UVDI on commercial/institutional in-duct and AHU coil UV-C germicidal irradiation systems: Steril-Aire (Burbank, CA) is the longest-standing player and most frequent head-to-head competitor in mechanical/hospital HVAC specs; Fresh-Aire UV (Jupiter, FL) and UV Resources (San Diego/Santee, CA, formerly Ultravation) compete on similar in-duct coil-cleaning and air-disinfection product lines for commercial AHUs; Lumalier (Memphis, TN) is a recognized alternative in healthcare/institutional UV-C air and surface disinfection. Reflects standard trade-publication and mechanical-contractor comparison sets for this category rather than a single cited source; not corroborated with a live search due to search budget exhaustion, should be spot-checked before being treated as authoritative. Retrieved 2026-08-09.",
       markets: [healthcare],
       markets_basis: "uvdi.com's own marketing copy is exclusively healthcare-focused: the homepage and multiple product pages feature a dedicated 'Contact Healthcare Sales' pathway; the UV Surface Disinfection page states 'UVDI is trusted by over 1,100 hospitals worldwide' and discusses terminal cleaning for hospital infection control (C. diff, MRSA); the UVDI-360 Room Sanitizer page is framed entirely around hospital patient rooms, operating rooms, and emergency rooms; and the site's Training & Resources section includes a dedicated 'UV Applications in Healthcare' resource and a Medical Sales Team. Checked homepage, sitemap, uv-surface-disinfection, uvdi-360, indoor-air-quality, product-information, and contact-healthcare-sales pages (retrieved 2026-08-09) — none named data_center, industrial_warehouse, education, hospitality, labs, office, or multifamily as target verticals. Retrieved 2026-08-09."}
    - {name: "Cosatron", firm: DMG, category: filtration_iaq, subcategory: "electronic air cleaners",
       description: "Electronic air cleaners", value_tier: 3, equipment_type: null,
       oshpd_osp: null,
       oshpd_osp_basis: "Searched HCAI's own OSP directory, not just Cosatron marketing claims. Fetched the official 'HCAI Special Seismic Certification Preapproval (OSP) by Category' PDF directly from hcai.ca.gov/document/osp-list-by-category/ (20-page document) and full-text-searched the whole document for 'Cosatron' — zero matches anywhere, including the Air Filters subcategory (the most applicable category for an electronic in-duct air cleaner), which lists only Dynamic (OSP-0269), Genesis Air (OSP-0307), American Green Technologies (OSP-0490), Global Plasma Solutions (OSP-0558), Johnson Controls (OSP-0607), and Price Industries Ltd (OSP-0627). Also checked Air Conditioning Units (all subtypes), Fan Coil Units, Humidification Systems, and Exhaust/Smoke Control Fans categories — no Cosatron entries there either. Supplemented with web searches ('site:hcai.ca.gov Cosatron', 'Cosatron OSP hcai.ca.gov', 'Cosatron HCAI OSP seismic preapproval') which returned no relevant HCAI records. No HCAI-hosted OSP application PDF referencing Cosatron was found. This is absence of evidence, not evidence of rejection/expiration, so recording null rather than false. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Not applicable — Cosatron's products are electronic air cleaners/in-duct air purification (IAQ) devices, not a category AHRI certifies. AHRI operates roughly 50 certification programs covering residential/commercial heating, ventilating, air-conditioning, refrigeration, and water-heating equipment (e.g., unitary AC/heat pumps, chillers, air handlers, VRF, fan coils, ERV/HRV, PTAC) — electronic air cleaners/filtration devices are not among AHRI's certifiable product categories. A secondary search confirmed AHRI's certified scope is limited to HVACR/water-heating equipment types, with no electronic air cleaner or IAQ filtration program. Separately, Cosatron's own site (cosatron.com) makes no AHRI claim anywhere; its only stated certification is 'Certified Ozone Free.' Given the category is not AHRI-certifiable and Cosatron makes no such claim, ahri_certified is set to null (not applicable) rather than false or true. Retrieved 2026-08-09.",
       country_of_manufacture: "United States",
       country_of_manufacture_basis: "Cosatron's own website footer lists its address as 2514 Broad Street, Camden, SC 29020 (cosatron.com), confirming a South Carolina headquarters/facility. Two Cosatron press releases hosted on their reps subdomain state manufacturing location explicitly: 'The CosaTron family of products is made in the USA and is custom designed and built to meet the specific needs of each application' and 'CosaTron is a division of CRS Industries, Inc. and is a privately owned US Company' (text confirmed via search-index snippet; the direct PDF links now return 404, so treat as historical company statements rather than a live page). No evidence found of overseas manufacturing plants; all located sourcing points to a single US site in Camden, SC. Retrieved 2026-08-09.",
       competes_with: "Trion (Johnson Controls), Dynamic Air Quality Solutions, United Air Specialists (Smog-Hog, Parker Hannifin)",
       competes_with_basis: "General industry knowledge of the in-duct electronic air cleaner / electrostatic precipitator category for commercial HVAC and kitchen exhaust applications, cross-checked via web search. Trion (owned by Johnson Controls) and Dynamic Air Quality Solutions are the two most commonly cited commercial/industrial electronic air cleaner manufacturers competing in the same in-duct ESP space as Cosatron. United Air Specialists (the Smog-Hog electrostatic precipitator line, now under Parker Hannifin) is a longstanding third competitor, particularly in commercial kitchen/restaurant exhaust ESP applications that overlap with Cosatron's core market. Cosatron's own site frames its competitive set by technology category (ionization/cold plasma, PCO, UV, and electrostatic precipitators) rather than naming rivals directly, so this list reflects named manufacturers identified through general industry/web research rather than a direct competitor statement from Cosatron. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, industrial_warehouse, education, labs, office],
       markets_basis: "cosatron.com own marketing copy, retrieved 2026-08-09. healthcare: dedicated page cosatron.com/where-it-works/hospitals/ ('the safety and well-being of patients and staff depend significantly on air quality... ideal for use in sensitive areas like operating rooms, ICUs, and general wards'); also cosatron.com/our-products/commercial/ ('Hospitals & Healthcare Facilities'). education: cosatron.com/where-it-works/ ('Keeping the air clean inside a school') and the commercial products page ('Educational institutions', 'schools'). office: dedicated page cosatron.com/where-it-works/office-and-retail/ ('Smart Air Purification for Offices & Retail'). labs: commercial products page ('custom designed systems for use with down flow HVAC systems, common in high-tech applications such as computer rooms, server farms and laboratories'). data_center: same quote naming 'computer rooms, server farms' as a named application. industrial_warehouse: commercial products page ('Tailored for commercial, industrial, and institutional settings'; '...to industrial plants'). Checked but not supported by explicit copy: hospitality (site names casinos and airports, not hotels/hospitality) and multifamily (residential page targets single-family homeowners only). Retrieved 2026-08-09."}
