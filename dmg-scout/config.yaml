    - {name: "Soler & Palau", firm: ToroAire, category: fans_exhaust, subcategory: "commercial/inline fans",
       description: "Commercial and industrial in-line fans", value_tier: 3, equipment_type: null,
       oshpd_osp: null,
       oshpd_osp_basis: "Checked HCAI's own OSP records directly and found no Soler & Palau / S&P entry. The official HCAI 'OSP List by Category' PDF (hcai.ca.gov/document/osp-list-by-category/) lists the Exhaust/Smoke Control Fans category as: OSP-0033/0102/0442 Loren Cook, OSP-0148/0223 Greenheck Fan, OSP-0195/0271/0395 Twin City Fan, OSP-0343 Enervex, OSP-0360 ACME — no Soler & Palau. The 'Air Conditioning Units - Inline Fans and Terminal' category lists Greenheck, Loren Cook, Trane, Price, Titus, Johnson Controls, Tuttle & Bailey, Krueger, Siemens, Nailor, Envirco — again no Soler & Palau. The third-party mirror panacheg.com/osp-database (11 total preapprovals / 9 active in this category) lists only Loren Cook, Greenheck Fan Corporation, ENERVEX Inc., ACME Engineering & Manufacturing Corporation, and Twin City Fan. A site-restricted web search of hcai.ca.gov for 'Soler' returned no OSP-related hits. No independent source or S&P's own site surfaced a specific HCAI/OSHPD OSP number. S&P's marketing materials describe UL-793 listing and high-temperature smoke-fan performance (e.g., TUB-HT, SMXDK-HT), but this is not treated as equivalent to an HCAI OSP preapproval. Conclusion: no current HCAI OSP record found for Soler & Palau; this is absence of evidence, not confirmed non-certification, so the field is left null rather than false. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Checked AHRI's own certification-programs list (ahrinet.org/certification/ahri-certification-programs): standalone commercial/industrial fans (in-line, utility, tubeaxial, centrifugal roof/wall, jet fans — S&P's actual product line) are not among AHRI's roughly 38 certification programs. The only fan-adjacent program is 'Central Station Air-Handling Unit Supply Fans (AHU)', which covers fans embedded in AHU casings, not standalone commercial/industrial fans like S&P sells — confirming these products are not an AHRI-certifiable category, consistent with the general HVAC industry norm that such fans are AMCA-rated, not AHRI certified. Separately, AHRI does run an 'Air-to-Air Energy Recovery Ventilators (ERV)' program that could in principle cover S&P's residential/light-commercial ERV/HRV line (TR/TRC/TRe/TReN series), but on solerpalau-usa.com the 'AHRI Certified' badge in the footer is a generic, site-wide element appearing identically on the homepage, the in-line fans page, and the ERV page — it names no specific AHRI standard (e.g., AHRI 1060) and is not tied to any named model. The AHRI directory could not be queried directly (JS-driven search, blocked to automated fetch) to confirm whether any specific S&P ERV model is an actual listed participant. This vague/generic badge does not meet the bar for a true finding, and since the specific in-line/commercial fan product line in scope is not an AHRI-certifiable category at all, the field is set to null rather than false or true. Retrieved 2026-08-09.",
       country_of_manufacture: "Multi-country (Spain and USA, among others)",
       country_of_manufacture_basis: "Soler & Palau Ventilation Group is headquartered in Spain with primary Spanish plants in Ripoll, Sils, Torello, and Madrid (solerpalau.com/en-ie/production-logistics-and-distribution/), which states the group also operates factories in France, England, Norway, Mexico, Brazil, the USA, China, Singapore, Thailand, Malaysia, and India. For the US market, S&P USA Ventilation Systems, LLC is based in a manufacturing/warehouse facility in Jacksonville, FL (solerpalau-usa.com/about; corroborated by third-party distributor airdistributor.net citing a 150,000+ sq ft Jacksonville manufacturing facility), tracing to Stanley Fans (1956) and its Breidert Fans (1992) and JencoFan (1994) acquisitions; the North American division also includes RenewAire in Madison, WI. No source found breaks out which specific commercial/industrial in-line fan SKUs (TD, TD-SILENT, CAB, PV, SQB, etc.) sold in the US are built in the Jacksonville plant versus imported from Spain or other group plants, so a single country cannot be confidently assigned to that specific product line. Retrieved 2026-08-09.",
       competes_with: "Greenheck, Twin City Fan (TCF), Loren Cook Company",
       competes_with_basis: "These three are the manufacturers most consistently named alongside Soler & Palau in commercial/industrial fan market analyses and vendor comparisons — all compete directly in centrifugal, in-line, and utility fan product lines for commercial/industrial ventilation applications, and are the standard basis-of-design alternates specified against S&P in this category in the US market. Corroborated via multiple industry market-research summaries that group Greenheck, Twin City Fan, Soler & Palau, and Loren Cook as leading players, plus general industry knowledge of the commercial mechanical contracting space. CORRECTION: the researching agent additionally claimed 'PennBarry ... was acquired by and now operates under Twin City Fan Companies' — this conflicts with this project's own verified June 2026 finding (PR Newswire plus four corroborating trade-press articles) that PennBarry was instead sold by Air Distribution Technologies to Hessaire Products Inc. on June 23, 2026 (see the Penn Barry line_card entry's country_of_manufacture_basis). The TCF/PennBarry ownership claim here should be disregarded as incorrect; it does not affect the Greenheck/TCF/Loren Cook competitor list itself. Retrieved 2026-08-09.",
       markets: [industrial_warehouse, hospitality, multifamily],
