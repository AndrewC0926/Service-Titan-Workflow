       description: "Smart dedicated outdoor air/ERV systems", value_tier: 2, equipment_type: air_handling_unit,
       oshpd_osp: null,
       oshpd_osp_basis: "Checked HCAI's official 'OSP List by Category' PDF (hcai.ca.gov/document/osp-list-by-category/, downloaded and text-extracted directly; document footer dated 03/01/2022) — searched all entries under Air Conditioning Units (Custom, Data Room, Inline Fans and Terminal, Packaged, Split), Air Filters, Fan Coil Units, Humidification Systems, Variable Air Volume Units, Air Handling Units/Fans, and Exhaust/Smoke Control Fans, plus a case-insensitive full-text search for 'ventacity' and 'vent' across the whole document. No entry for Ventacity (or any obvious parent/brand alias) appears in any category. Also ran web searches ('Ventacity HCAI OSP seismic preapproval', 'Ventacity OSHPD OSP seismic certification', 'Ventacity site:hcai.ca.gov', 'Ventacity OSHPD hospital seismic AC156') and found no HCAI directory, eServices, or third-party record of a Ventacity OSP number. Note: the source PDF's footer date (03/01/2022) suggests it may not reflect the most current HCAI listings as of retrieval; HCAI's OSP program page also points to an eServices Portal (eSP) for OSP applications/records that was not separately searchable via public web tools in this session. Given no positive or negative HCAI record was found, and the possibility that HCAI's live/eSP records are not fully mirrored in the static PDF, this is recorded as null rather than false. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Product category (ERV/DOAS equipment) IS plausibly AHRI-certifiable under AHRI Standard 1060 (Air-to-Air Energy Recovery Ventilators), so this is not an out-of-scope category. However, direct verification against AHRI's own directory failed: multiple ahridirectory.org search URL formats returned HTTP 402 Payment Required, and AHRI's own ERV certification program page returned HTTP 403 on direct fetch; Wayback Machine access was unavailable. What was found: Ventacity's own certifications page (ventacity.com/certifications/) states 'Certified September 2021' and 'Find our products on the AHRI database,' and a third-party manufacturer's-rep blog (airpurchases.com) independently states Ventacity Systems achieved AHRI certification — but neither source names the specific standard/program, a certificate number, or is AHRI's own documentation, and neither could be cross-checked against AHRI's directory or an official AHRI program-participant list. Per sourcing discipline, self-reported manufacturer/reseller claims alone are insufficient to mark true. Recommend manually checking ahridirectory.org (participant 'Ventacity Systems', program AHRI 1060/ERV) before quoting certification status to a customer. Retrieved 2026-08-09.",
       country_of_manufacture: null,
       country_of_manufacture_basis: "Confirmed Ventacity Systems' corporate headquarters is Corvallis, Oregon, USA (2121 NE Jack London St, Corvallis, OR 97330) via multiple independent sources — the Passive House Institute component database, the company's LinkedIn profile (11-50 employees, founded 2015, HVAC and Refrigeration Equipment Manufacturing category), and IndustryNet's Corvallis-based HVAC equipment listing. However, none of these sources — nor Ventacity's own site (ventacity.com: homepage, /products/, /resources/, /certifications/, /contact-us/) — state an actual factory/plant location or country-of-origin for the equipment itself. IndustryNet's description leans toward Ventacity being a supplier/technology provider ('Smarter Building Platform,' cloud-managed HVAC) rather than explicitly an in-house manufacturer, which raises the possibility of contract manufacturing, but no source confirms where that would occur (domestic Oregon assembly vs. an overseas contract manufacturer). Could not access UL's product certification database or the Wayback Machine for archived About Us pages with more detail. Given no source confirms actual plant/factory location, and the explicit distinction between headquarters and manufacturing location, this is reported as null rather than guessing. Retrieved 2026-08-09.",
       competes_with: "RenewAire, Greenheck, AAON",
       competes_with_basis: "Based on general industry/trade knowledge of the light-commercial DOAS/ERV category. Ventacity's own site and DMG's own product page confirm its positioning: ceiling-mount, decentralized energy-recovery ventilators (ERV/HRV) with cloud-connected smart controls, MERV-13+ filtration, aimed at light commercial, K-12/institutional, and multifamily retrofit projects. The three named companies compete directly because they sell into the same project type with the same core technology (air-to-air energy recovery cores/wheels) and routinely appear as basis-of-design alternates in the same specs/submittals: RenewAire is a dedicated ERV/DOAS manufacturer whose core light-commercial, K-12, and multifamily focus most closely mirrors Ventacity's target market; Greenheck's ERV/ERC and DOAS lines are commonly cross-specified against smaller/smart entrants like Ventacity in commercial construction bid packages; AAON (also a DMG-carried line — see that line_card entry) rooftop DOAS units with integrated energy-recovery wheels are a frequent efficiency/value alternate against Ventacity's decentralized ceiling-mount units in school and light-commercial bids. A distributor line-card page (jbarrow.com) also listed Ventacity alongside Systemair, ChangeAir, and other ERV/DOAS/unit-ventilator brands it carries, treated as supporting context only, not primary basis. Retrieved 2026-08-09.",
       markets: [education, office, multifamily],
       markets_basis: "Ventacity's own website (ventacity.com homepage and resources page) features named case studies/solution briefs for: an office building ('Law Firm Reduces the EUI of Their HVAC by 71%'), education (a school/classroom air-quality brief titled 'Supplying Superior Air Quality to Schools and Classrooms' plus a dormitory case study), and multifamily residential (an urban flats project pursuing Net Zero Energy performance). An airport case study was also found but does not map to any of the 8 allowed market values. No case studies, named verticals, or explicit copy were found for healthcare, industrial_warehouse, hospitality, labs, or data_center — dedicated /solutions and /markets/applications pages either returned 404 or contained only generic 'buildings/HVAC' language with no named verticals. Retrieved 2026-08-09."}

    - {name: "Titus", firm: ToroAire, category: air_distribution, subcategory: "diffusers, grilles, VAV terminals",
       description: "Diffusers, grilles, registers, VAV terminal units", value_tier: 3, equipment_type: vav_terminal,
       oshpd_osp: true,
       oshpd_osp_basis: "Confirmed current: HCAI OSP-0352 (renewal), approved 01/06/2026, expires 01/06/2032. Source: official HCAI-hosted application PDF at https://hcai.ca.gov/document/OSP-0352/ (verified by direct PDF fetch/read, retrieved 2026-08-09). Applicant/manufacturer of record is 'Air Distribution Technologies, Inc.' (605 Shiloh Road, Plano, TX — Titus HVAC's headquarters address), and the attached certified-product tables (Petra Seismic Design, Table DD-1A/DD-1B) explicitly list 'Manufacturer: Titus' for the certified models. Category: Air Conditioning Units > Air Conditioning Units - Inline Fan and Terminal. Covers Titus VAV and Fan Powered Air Terminal Units: Dual Duct (PEDV, DEDV), Single Duct (PESV, EESV, AESV, DESV, ESV-S, LMHS-S, SDV-S), and Series Fan Powered (PTFS, ATFS, DTFS, and -A/-G/-F suffix variants). Condition of approval: coils and silencers cannot be used with dual duct units (untested configuration). Cross-checked against a prior renewal cycle of the same OSP number (OSP-0352-1, approved 04/29/2020 under manufacturer name 'Titus HVAC (Air System Components)', which had expired 12/31/2025 — confirming this is a continuous, actively-renewed certification, not a one-off lapsed record) and against HCAI's cached 'OSP List by Category' PDF (snapshot dated 03/01/2022) which listed 'OSP-0352: Titus' as active under the same sub-category. Grilles/diffusers/registers are not covered by this or any other OSP category found for Titus; this certification applies only to the VAV/fan-powered terminal unit line. Retrieved 2026-08-09.",
       ahri_certified: true,
       ahri_certified_basis: "Confirmed via Titus's own manufacturer performance-data document for its single/dual duct VAV terminals (models PESV, EESV, AESV, DESV), which bears the official AHRI CERTIFIED® mark for 'VAV Terminals — AHRI Standard 880' and states: 'Titus is a charter member company and current participant in the AHRI Directory of Certified Performance,' describing third-party annual verification testing per ASHRAE Standard 130 against AHRI Standard 880 tolerances. Source: titus-hvac.com (ESV AHRI performance data PDF). Direct verification against ahridirectory.org itself was not possible — the site returned HTTP 402 Payment Required on all attempted fetches, so the live directory listing could not be independently confirmed. Note: unlike diffusers/grilles/dampers (not AHRI-rated categories), AHRI Standard 880 'Performance Rating of Air Terminals' is a genuine third-party-verified certification program (confirmed via secondary sources: Anemostat, Price Industries, and Aerodyne Cooling Systems documentation describing the same program), so this product category is certifiable and Titus's own documentation shows active participation. This finding covers single/dual duct VAV terminals specifically; fan-powered terminal unit certification under the same program was not separately verified with a named-model document. Retrieved 2026-08-09.",
       country_of_manufacture: "United States (primary) and Mexico",
       country_of_manufacture_basis: "Titus (a brand of Air Distribution Technologies, Inc.) is headquartered at 605 Shiloh Rd, Plano, TX 75074. Titus's own website lists ISO 9001-certified manufacturing/facility locations at: El Paso, TX, USA; Ponca City, OK, USA; Sanford, FL, USA; Tarboro, NC, USA; Tucson, AZ, USA; and Juarez, Mexico. Source: titus-hvac.com/main/about/Certifications, corroborated by titus-hvac.com/main/about. This reflects certified facility locations found on Titus's corporate site; it does not confirm which specific product lines (diffusers vs. grilles vs. VAV terminal units) are built at which specific plant, so line-specific origin would need confirmation with a Titus rep for a given SKU. Retrieved 2026-08-09.",
       competes_with: "Price Industries, Nailor Industries, MetalAire (Metal Industries), TROX",
       competes_with_basis: "Based on direct product-line overlap in diffusers/grilles/registers and VAV terminal units, verified via company websites (nailor.com, metalaire.com) plus general industry knowledge for Price Industries and TROX. Price Industries (Winnipeg, MB) is the largest independent full-line competitor, spec'd head-to-head with Titus on diffusers, grilles, and VAV boxes on most commercial projects. Nailor Industries (also a DMG-carried line — see that line_card entry) directly overlaps with displacement/ceiling diffusers, air distribution grilles, and fan-powered VAV terminal units. MetalAire (Metal Industries) matches Titus's product breadth almost line-for-line: diffusers, grilles/registers, and single/dual-duct and fan-powered VAV boxes, and is a frequent basis-of-design alternate. TROX (Germany/US) competes in the same commercial diffuser, grille, and terminal-unit categories, especially on larger or international-spec projects. Note: Krueger, though a well-known air distribution brand, was explicitly excluded — verified via airdistribution.com that Krueger is a sister brand under the same parent, Air Distribution Technologies, Inc., not an independent competitor. Retrieved 2026-08-09.",
       markets: [healthcare, industrial_warehouse, education, hospitality, labs, office, multifamily],
       markets_basis: "titus-hvac.com own product literature, retrieved 2026-08-09. Products overview page explicitly names target applications per product line: Terminal Units — 'healthcare facilities like hospitals or high-tech manufacturing'; Critical Environment Diffusers — 'Cleanrooms include hospital operating rooms, electronics manufacturing, pharmaceutical and biotechnology manufacturing, research facilities, automotive painting'; FTW/LGO Fan Coils — 'apartments and condominiums, hotels, motels, schools and universities, hospitals and nursing homes'; Blower Coils — 'schools, office buildings, hospitals, condominiums, assisted living facilities, apartments and stores'; Air Handlers — 'common areas and large meeting rooms in hotels, condominiums, universities and hospitals.' Healthcare further confirmed by the dedicated NEXUS OR Suite product page (operating rooms, ASHRAE 170 compliance). Education and office corroborated by Titus's case-study library, which groups projects under 'Colleges/Universities', 'K-12 Education', and 'Corporate Headquarters'; labs corroborated by the 'Critical Environment' case-study category (BioDesign Institute, life-science/research buildings). No mention of data_center found anywhere, so it is excluded. Retrieved 2026-08-09."}
    - {name: "Pottorff", firm: ToroAire, category: air_distribution, subcategory: "dampers & louvers",
       description: "Fire/smoke dampers and louvers", value_tier: 3, equipment_type: null,
       oshpd_osp: null,
       oshpd_osp_basis: "Checked HCAI's official OSP List by Category PDF (hcai.ca.gov/document/osp-list-by-category/) in full — all 20 pages / 25 categories and roughly 733 individual OSP-numbered listings were extracted and text-searched. There is no 'Dampers' category at all in HCAI's OSP category taxonomy; the 25 categories cover Emergency/Standby Power, Elevator Equipment, Hazardous Content Components, Exhaust/Smoke Control Fans, Switchgear/Switchboards, Motor Control Centers, imaging equipment, Air Conditioning Units (incl. Custom/Data Room/Inline Fan/Packaged/Split/Filters/Fan Coil/Humidification/VAV subtypes), Air Handling Units, Chillers, Cooling Towers, and various electrical/life-safety/medical equipment categories — no 'damper' or 'fire/smoke damper' subcategory exists under any of them, including Air Conditioning Units/Air Handling Units. 'Pottorff' does not appear anywhere in the document as a manufacturer under any category. Cross-checked the third-party HCAI-OSP mirror at panacheg.com/osp-database/manufacturer/pottorff, which returned HTTP 404 (no manufacturer page), consistent with no listings. Conclusion: HCAI's OSP program appears to have no product category applicable to standalone fire/smoke dampers or louvers at all — it covers whole mechanical/electrical equipment (AC units, AHUs, chillers, fans, etc.), not individual duct-mounted dampers — so the absence of a Pottorff OSP listing is expected/structural rather than a sign of an expired or rejected certification. Setting to null since this is a 'nothing found' result, not a documented rejection/expiration. Pottorff's applicable California hospital compliance path is UL 555/555S listing plus CSFM listing, not an HCAI OSP number. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Not applicable — fire/smoke dampers and louvers are not an AHRI-certifiable product category. Checked AHRI's own certification programs list (ahrinet.org/certification/ahri-certification-programs): its 20+ listed programs cover chillers, coils, air-to-air energy recovery/ventilation components, boilers, central station air-handling units, PTAC/PTHP, room fan-coils, unitary equipment, water heaters, etc. — no damper or louver program exists. Also checked Pottorff's own site (pottorff.com), which makes no AHRI claim anywhere; its listed certifications are UL fire/smoke damper ratings, AMCA performance certification, and Buy American Act compliance. Consistent with industry norm: dampers/louvers are rated under UL 555/555S and AMCA 500-D, not AHRI. Retrieved 2026-08-09.",
       country_of_manufacture: "United States",
       country_of_manufacture_basis: "Pottorff company website (pottorff.com/company and pottorff.com/history) states products are 'Manufactured and shipped from two factories in the United States.' A signed Pottorff 'Buy American and Buy America Requirements' conformance letter (Mark Saunders, VP of Sales and Marketing, dated May 4, 2023, hosted at pottorff.com) certifies 'all Pottorff products are manufactured in the United States from materials produced substantially in the United States' and lists production and assembly locations in Fort Worth, Texas, Montebello, California, and Brooklyn, New York. Retrieved 2026-08-09.",
       competes_with: "Ruskin, Greenheck, Nailor Industries, American Warming and Ventilating (AWV)",
       competes_with_basis: "General industry knowledge. Pottorff's own site describes it as a leading US manufacturer of UL-rated fire dampers, smoke dampers, combination fire/smoke dampers, and louvers. Ruskin, Greenheck, Nailor Industries (also a DMG-carried line — see that line_card entry), and American Warming and Ventilating (AWV, a Mestek brand) are the other well-established AMCA/UL-certified manufacturers most commonly specified as equals or alternates to Pottorff in mechanical specifications for this same product category (fire/smoke dampers and architectural/industrial louvers). Cross-checked against Pottorff's own listed product scope; not corroborated with a live web search due to search budget exhaustion. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, industrial_warehouse, education, hospitality, office, multifamily],
       markets_basis: "pottorff.com (retrieved 2026-08-09). Data center: dedicated main-nav 'Product Applications - Data Centers' item, a 'Data Center Brochure' in Literature, and the 'Ashburn Data Center' project case study. Healthcare: 'CHOP New Patient Tower' (Children's Hospital of Philadelphia) and 'Parkland Hospital' case studies. Industrial_warehouse: 'Amazon Fulfillment Center' case study and CD-45/46 damper literature explicitly citing 'Warehouses and Distribution Centers'. Education: 'Raymore High School' and 'UC Irvine Towers' (university housing) case studies. Hospitality: 'Seminole Hard Rock' and 'SLS Brickell' hotel case studies. Office: 'Comcast Tech Center', 'Frost Tower', 'Shorb Tower', 'Wilshire Grand Center', 'World Trade Center' case studies, all tagged office buildings. Multifamily: 'Oasis at Brandon' (apartments), '432 Park Avenue', and 'Ten Thousand' residential-tower case studies. Labs excluded: no laboratory application/market item exists in main navigation or literature — the only 'lab' reference found was Pottorff's own internal product-testing facility, not a client market. Retrieved 2026-08-09."}
    - {name: "TCF/Twin City Fan", firm: ToroAire, category: fans_exhaust, subcategory: "commercial/industrial fans",
       description: "Commercial and industrial fans", value_tier: 2, equipment_type: null,
       oshpd_osp: false,
       oshpd_osp_basis: "HCAI's own master directory (hcai.ca.gov/document/osp-list-by-category/) lists four Twin City Fan Companies OSP numbers: OSP-0195, OSP-0271, and OSP-0395 under 'Exhaust/Smoke Control Fans', and OSP-0355 under 'Air Handling Units > Fans'. Pulling the actual HCAI-hosted application PDFs for all four shows each is a 2016 filing (Type: Renewal for 0195/0271/0395, New for 0355) with the HCAI approval block stating verbatim 'Approval Expires on December 31, 2022.' No subsequent renewal filing (e.g. an -11 suffix or a new post-2022 OSP number under Twin City Fan) exists anywhere on hcai.ca.gov as of this search. Third-party mirror panacheg.com/osp-database/category/exhaust-smoke-control-fans independently lists Twin City Fan's OSP-0395 with status 'Expired', corroborating this. Products covered when active were: BCV/BCVR/BCVSH centrifugal utility fans (also sold as Aerovent BIUB/BIUBR/BIUBSH) under OSP-0195; mixed-flow/centrifugal inline fans under OSP-0271; roof/wall exhaust centrifugal fans under OSP-0395; and E-Series/Commercial Duty plenum fans plus airfoil/backward-inclined housed fans under OSP-0355. Because HCAI's own filed record explicitly shows these preapprovals expired 12/31/2022 with no renewal on file, Twin City Fan does not currently hold a valid HCAI OSP for exhaust/smoke-control or AHU fans — this is a specific expired-record finding, not an absence of search results. Retrieved 2026-08-09.",
       ahri_certified: null,
       ahri_certified_basis: "Not applicable — industrial/commercial fans are not an AHRI-certifiable product category. AHRI's certification scope covers residential and commercial heating, ventilating, air-conditioning, refrigeration, and water heating equipment (roughly 50 programs: unitary AC/heat pumps, chillers, air handlers with coils, VRF, fan coils, ERV/HRV, PTAC, furnaces, etc.) — standalone fans/blowers are not among them. Fan performance in this industry is instead rated/certified via AMCA (Air Movement and Control Association), not AHRI. Confirmed on Twin City Fan's own site (tcf.com): no AHRI mention anywhere, even in vague marketing form. TCF instead cites AMCA 204 (Balance & Vibration), AMCA 210 (Air Performance), AMCA 300 (Sound Testing), and UL 705 safety testing as its third-party validation. Direct fetch of ahrinet.org's certification-programs page returned HTTP 403, so the full program list could not be loaded verbatim; finding is corroborated via AHRI's own program-scope description found through cached search results plus absence of any AHRI claim on TCF's site. Retrieved 2026-08-09.",
       country_of_manufacture: "United States (primary), with additional plants in China, Czech Republic, India, Singapore, and a UAE joint venture",
       country_of_manufacture_basis: "Twin City Fan Companies, Ltd. (parent of Twin City Fan, Aerovent, and Clarage brands) is headquartered in Minneapolis, MN (worldwide HQ and R&D). Primary US manufacturing plants: Brookings, SD (flagship plant); Aberdeen, SD (axial products); Mitchell, SD; Elkton, SD (commercial mfg/assembly); Pulaski, TN (Clarage heavy-duty division); Davenport, IA (TC Holland foundry) — most ISO 9001:2015 certified. International manufacturing/service operations: Shanghai, China (TCF China); Czech Republic (TCF Europe, serving Europe/Middle East/Africa); Singapore (TCF Azen, serving Asia Pacific incl. Malaysia, Vietnam, Thailand, Indonesia); Chennai, India (TCF India, wholly owned subsidiary); and a joint venture, Energy Twin City, in Sharjah, UAE (formed Nov 2021). Source: twincityfan.com/facilities/ and twincityfan.com/our-companies/, corroborated by tcf.com's statement that TCF has expanded manufacturing and service operations located in the U.S., Europe, India, China and Singapore. Retrieved 2026-08-09.",
       competes_with: "Greenheck, Loren Cook Company, New York Blower Company, Hartzell Air Movement",
       competes_with_basis: "General industry knowledge. These are the primary U.S. manufacturers of commercial/industrial fans (centrifugal, axial, and industrial process fans) that compete head-to-head with Twin City Fan on mechanical contractor bid specs — Greenheck and Loren Cook are the most commonly cross-shopped alternates on commercial HVAC fan schedules, New York Blower and Hartzell Air Movement are frequent alternates on industrial/process fan applications. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, industrial_warehouse, education, hospitality, labs, office],
       markets_basis: "tcf.com (retrieved 2026-08-09). Dedicated data-centers applications page: 'Twin City Fan offers a full line of products for properly ventilating and cooling data centers.' The institutional-hospitality markets page explicitly names 'universities, hospitals, laboratories/research facilities, military bases, hotels, convention centers, fitness centers and cruise ships' (supports education, healthcare, labs, hospitality). Industries and industrial-markets pages list extensive industrial verticals (automotive, chemical, mining, manufacturing, power generation, wastewater) supporting industrial_warehouse. Case studies include named examples: Old Dominion University, Purdue University Drug Discovery, NYU Abu Dhabi, SIUE, University of Washington, Olympus High School (education/labs); UPMC East Hospital (healthcare); Office Building AHUs (office); multiple industrial/mining/chemical/power case studies (industrial_warehouse). No explicit multifamily/apartment vertical found — the residential page describes generic residential (stairwell/elevator pressurization, kitchen/pool exhaust) without naming multifamily or apartment buildings specifically, so multifamily is excluded. Retrieved 2026-08-09."}
    - {name: "Nailor", firm: ToroAire, category: air_distribution, subcategory: "VAV terminals, dampers, diffusers",
       description: "Air terminals, VAV boxes, dampers, diffusers", value_tier: 3, equipment_type: vav_terminal,
       oshpd_osp: true,
       oshpd_osp_basis: "Confirmed directly from the HCAI-hosted application/certification PDF at https://hcai.ca.gov/wp-content/uploads/2023/04/OSP-0561.pdf, also listed on HCAI's OSP-by-category page and directory entry (hcai.ca.gov/document/OSP-0561/). OSP-0561 is held by Nailor Industries, Inc. (Houston, TX) and covers Nailor's core VAV/terminal-unit product line: Single Duct Terminal Units, Dual Duct Terminal Units, and Fan Powered Terminal Units (VAV and FPTU, with controller, damper, and coils). The certified-product tables (Petra Seismic Design report) list Nailor Model 30/31/32 series single duct terminal units (e.g. #30RW, #31RW, #30RE, #31RE, #30RWQ/HQW, #30REQ/HQE families) plus, per the application form, Dual Duct Model 3200 and Fan Powered Models 33SZ/35S/35N/37S. The certification was signed and approved by Timothy J. Piland, SSE, dated April 17, 2023, with the approval block stating explicitly: 'OSHPD Approval — Approval Expires on April 17, 2029.' This is a signed, dated approval in HCAI's own hosted document, valid through 4/17/2029 (currently active as of the 2026-08-09 retrieval date) — an older web-search snippet describing this same number as 'In Review' is superseded by the actual signed/approved PDF text and should be disregarded. Note this is separate from and in addition to OSP-0772 (Nailor's Engineered Comfort horizontal fan coil units 35FH/37FH/40H, approved 4/8/2025, expires 4/8/2031 — see the Engineered Comfort line_card entry), which covers a different Nailor product line. Retrieved 2026-08-09.",
       ahri_certified: true,
       ahri_certified_basis: "Nailor's own press release states: 'Nailor has maintained AHRI certification for terminal units for over 20 years and fan coils for 15 years,' with terminal unit certification tested per ASHRAE Standard 130 (pressure drop, sound, airflow, heating/cooling capacity) — the same standard covering single duct, dual duct, and fan-powered VAV terminal units. Source: nailor.com/resources/news/ahri-recognizes-nailor-20-years-of-success. Direct confirmation via ahridirectory.org was not possible — the site returned HTTP 402 Payment Required on fetch, and ahrinet.org returned HTTP 403; a candidate certifications page at nailor.com/company/certifications returned 404. This finding rests on Nailor's own press page rather than independent confirmation from the AHRI directory itself, consistent with the same corroboration tier used for the related Engineered Comfort fan-coil finding. Retrieved 2026-08-09.",
       country_of_manufacture: "USA and Canada",
       country_of_manufacture_basis: "Nailor's own contact-us page (nailor.com/contact-us) lists Houston, TX (Group HQ + manufacturing) and North Las Vegas, NV, USA (labeled 'Regional Manufacturing/Sales'), plus Calgary, AB, Canada (labeled 'Manufacturing and sales operations') as facilities — these produce the core Nailor-branded VAV terminal units, dampers, and diffusers. Nailor GTA (nailorgta.com, Vaughan, ON) is confirmed a distributor/warehouse only, not a manufacturing plant. The company's About/International Group page confirms 11 facilities across USA, Canada, and UK and notes USA/Canada production is 'Union made' by Sheet Metal Workers International Association members. The UK facility (Advanced Air, Thetford) is a separate Nailor International Group member that manufactures its own VAV/damper/diffuser/fan-coil line locally for the UK/European market, with no stated export relationship to North America — so it is not the source of product for a US contractor. No source found stating VAV terminals/dampers are manufactured anywhere outside USA/Canada for the North American market. Retrieved 2026-08-09.",
       competes_with: "Titus, Price Industries, Krueger, Metalaire",
       competes_with_basis: "General industry knowledge, cross-checked against manufacturer sites. Titus (also a DMG-carried line — see that line_card entry), Price Industries, and Krueger are full-line air distribution manufacturers matching Nailor's exact category overlap (VAV/fan-powered terminal units, dampers, diffusers, grilles) and are commonly listed as basis-of-design vs. equivalent-substitute options on the same commercial/institutional mechanical specs and bid lists. Metalaire is a narrower but frequently co-specified competitor focused on diffusers/grilles and terminal units in the same market segment. Retrieved 2026-08-09.",
       markets: [data_center, healthcare, industrial_warehouse, hospitality, labs, office],
       markets_basis: "nailor.com (retrieved 2026-08-09). Critical Environment product page names 'operating rooms,' 'hospital rooms,' 'laboratories,' 'cleanrooms,' 'biotechnology research and pharmaceutical manufacturing' (healthcare, labs) and 'microelectronic manufacturing,' 'aerospace manufacturing/assembly and laser/optics industries' (industrial_warehouse). Dedicated literature flyer 'Leaders in Data Center Ventilation' markets dampers/louvers explicitly for 'mission critical data centers.' Case study 'Allegheny General Hospital, AHN Cancer Institute' (Category: Healthcare, Hospital). Office case studies: Amegy Bank Houston Corporate HQ, Texas Tower, ExxonMobil Campus, The Old Post Office Chicago. Hospitality case studies: Westin Hotel at the Woodlands, Hilton Americas Houston. No explicit education or multifamily claims were found anywhere on nailor.com's core brand pages (the only such language appeared on the separate Engineered Comfort sub-brand page, out of scope here), so both are excluded. Retrieved 2026-08-09."}
    - {name: "Ductsox", firm: ToroAire, category: air_distribution, subcategory: "fabric duct",
       description: "Fabric duct air dispersion systems", value_tier: 3, equipment_type: null,
       markets: [data_center, healthcare, industrial_warehouse, education, hospitality, labs, office],
